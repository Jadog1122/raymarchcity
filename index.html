<script id="vert" type="x-shader/x-vertex">
precision highp float;
in vec3 position;
void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
out vec4 fragColor;

uniform float iTime;
uniform vec2  iResolution;   // render target size in pixels
uniform vec4  uAudio;        // bass, mid, high, energy  (0..1)
uniform float uBeat;         // 1 on beat, exp decay
uniform float uScale;        // renderScale (for debug)
uniform float uCamZ;         // camera travel along the street (integrated in JS)
uniform vec4  uParams;       // response, fog multiplier, speed multiplier, reserved
uniform float uSearch;       // searchlight azimuth (integrated in JS)
uniform vec2  uBeatAge;      // seconds since the last two beats (99 = none)
uniform float uFlashAge;     // seconds since the last lightning (rare: every 8th beat or an energy peak)
uniform vec4  uMood;         // rain, quiet(0..1 slow energy), beam strength at the camera, fade
uniform vec2  uSection;      // section id (0 verse, 1 build, 2 drop, 3 breakdown), seconds in it
uniform sampler2D tSigns;    // atlas of vertical shop signs, one per cell
uniform vec2  uSignGrid;
uniform sampler2D tHSigns;   // atlas of horizontal signage: rooftop boards, wall panels, tenant rows
uniform vec2  uHSignGrid;
uniform float uPath;         // 1 = grid-walk tracer, 0 = reference sphere-trace
uniform vec3  uCamRo, uCamRt, uCamUp, uCamFw;
uniform float uFocal;
uniform vec2  uJitter;

// ---------- hashes ----------
// integer hashes: exact and identical across shader compiles (fract(sin) / fract(big product) are not)
uint uhash(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float hash21(vec2 p){ uvec2 q = uvec2(ivec2(floor(p * 64.0))); uint h = uhash(q.x ^ uhash(q.y + 0x9e3779b9u)); return float(h) * (1.0 / 4294967296.0); }
float hash11(float n){ return hash21(vec2(n, 17.0)); }
vec2  hash22(vec2 p){ float h = hash21(p); return vec2(h, hash21(p + h + 7.1)); }
// interleaved gradient noise: a structured dither for ray-march start offsets. White noise here
// shows up as raw speckle in any still where TAA has not averaged it away.
float ign(vec2 p){ return fract(52.9829189 * fract(0.06711056*p.x + 0.00583715*p.y)); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);
  return mix(mix(hash21(i), hash21(i + vec2(1, 0)), f.x), mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), f.x), f.y); }

// ---------- scene ----------
#define CELL   8.0     // block pitch (street to street)
#define STREET 2.0     // half street width
#define MAXD   320.0
int gMat = 0;          // 1 building, 2 ground
float gHitT = 1e9;                   // the analytic tracer records the face it hit as it goes, so the
vec3  gHitN = vec3(0.0, 1.0, 0.0);   // shader never has to rediscover it with a gradient of the SDF
float gDepth = 0.0;    // hit distance of the primary ray (MAXD if sky)
vec3  gRo = vec3(0.0);  // camera position (for cloud projection)

float sdBox(vec3 p, vec3 b){ vec3 d = abs(p) - b; return length(max(d, 0.0)) + min(max(d.x, max(d.y, d.z)), 0.0); }

// per-block parameters from the integer cell id
// Zoning. A low-frequency field over the block grid, so districts come out as contiguous
// neighbourhoods rather than per-block noise: 0 downtown towers, 1 entertainment, 2 low-rise old
// town, 3 offices, 4 industrial.
int districtOf(vec2 id){
  float a = vnoise(id * 0.075 + 3.1);
  float b = vnoise(id * 0.115 + 17.7);
  if (a > 0.63) return 0;
  if (b > 0.62) return 1;
  if (a < 0.33) return 2;
  if (b < 0.34) return 4;
  return 3;
}
// Street hierarchy along x: one avenue and one back alley in every five, the rest ordinary.
float streetHalf(float kx){
  float m = mod(kx, 5.0);
  return m == 0.0 ? 3.10 : (m == 3.0 ? 1.15 : 2.0);
}
// The buildable span of a block, once its two streets have taken their width.
void lotSpanX(vec2 id, out float cx, out float halfx){
  float lo = id.x*CELL + streetHalf(id.x), hi = (id.x + 1.0)*CELL - streetHalf(id.x + 1.0);
  cx = 0.5*(lo + hi); halfx = max(0.5*(hi - lo), 0.5);
}
void cellParams(vec2 id, out vec2 hs, out float ht){
  vec2 r = hash22(id + 5.3);
  float h = hash21(id);
  int dz = districtOf(id);
  // Each district has its own skyline statistics; that is what makes a neighbourhood read as one.
  if (dz == 0){ hs = vec2(1.35) + 0.75*r; ht = 12.0 + 26.0*pow(h, 2.0); }            // downtown: tall, broad
  else if (dz == 1){ hs = vec2(0.95) + 0.75*r; ht = 5.0 + 13.0*pow(h, 2.6); }        // entertainment: mid-rise, packed
  else if (dz == 2){ hs = vec2(0.85) + 0.55*r; ht = 2.6 + 6.0*pow(h, 1.6); }         // old town: low and small-grained
  else if (dz == 4){ hs = vec2(1.5) + 0.7*r;  ht = 3.0 + 5.0*h; }                     // industrial: wide low sheds
  else { hs = vec2(1.2) + 0.7*r; ht = 8.0 + 15.0*pow(h, 1.5); }                        // offices: even mid-rise
  float cx, halfx; lotSpanX(id, cx, halfx);
  hs.x = min(hs.x, max(halfx - 0.2, 0.45));                                            // an alley block is a narrow lot
  hs.y = min(hs.y, CELL*0.5 - 1.55);
  if (hash21(id + 17.3) < (dz == 2 ? 0.05 : 0.10)) ht = 0.35;                          // a few empty lots
}

#define TOWER_H 90.0
vec3 towerPos(){ return vec3(14.0, 0.0, uCamZ + 200.0); }   // landmark: always 200 ahead, a little to the right
float blink(){ return 1.0 - step(0.5, fract(iTime)); }        // 1 Hz aviation light

// ---- exact SDF components (one cell at a time) ----
vec2 lotOffset(vec2 id, vec2 hs){                       // slide inside the lot, never into either street
  float cx, halfx; lotSpanX(id, cx, halfx);
  float ox = cx - (id.x + 0.5)*CELL + (hash21(id + 11.9) - 0.5) * 2.0 * max(halfx - hs.x, 0.0);
  float oz = (hash21(id + 12.7) - 0.5) * 2.0 * max(CELL*0.5 - 1.55 - hs.y, 0.0);
  return vec2(ox, oz);
}
bool riverRow(float idy){ float r = mod(idy, 7.0); return r == 3.0 || r == 4.0; }
// An elevated railway crossing the grid every thirteenth row. Civic infrastructure is what makes a
// grid read as a plan rather than a field of blocks.
bool viaductRow(float idz){ return mod(idz, 13.0) == 6.0; }
// Where the elevated line crosses an avenue there is a station, and the block beside it is kept open
// as its plaza. A city needs somewhere people converge, not just a texture of blocks.
bool stationAt(vec2 id){ return viaductRow(id.y) && mod(id.x, 5.0) == 0.0; }
bool plazaAt(vec2 id){ return !viaductRow(id.y) && mod(id.x, 5.0) == 0.0 && (viaductRow(id.y - 1.0) || viaductRow(id.y + 1.0)); }
#define CONC_H  6.2
#define VIA_Y   7.0
#define VIA_HZ  1.55
#define VIA_HT  0.55

// vertical capped cylinder: SDF and analytic intersection, so curved towers and pipes agree between the two paths
float sdCylY(vec3 p, vec2 c, float r, float y0, float y1){
  float d = length(p.xz - c) - r;
  float dy = abs(p.y - 0.5*(y0 + y1)) - 0.5*(y1 - y0);
  return min(max(d, dy), 0.0) + length(max(vec2(d, dy), 0.0));
}
float sdSphere(vec3 p, vec3 c, float r){ return length(p - c) - r; }
float hitSphere(vec3 ro, vec3 rd, vec3 c, float r, float tCur, float tLim){
  vec3 o = ro - c; float b = dot(o, rd), cc = dot(o, o) - r*r, disc = b*b - cc;
  if (disc <= 0.0) return 1e9;
  float t = -b - sqrt(disc);
  if (t < tCur) t = -b + sqrt(disc);
  if (!(t > tCur && t < tLim)) return 1e9;
  if (t < gHitT){ gHitT = t; gHitN = normalize(ro + rd*t - c); }
  return t;
}
float hitCylY(vec3 ro, vec3 rd, vec2 c, float r, float y0, float y1, float tCur, float tLim){
  float best = 1e9;
  vec2 o = ro.xz - c, d = rd.xz;
  float A = dot(d, d), B = dot(o, d), C = dot(o, o) - r*r;
  float disc = B*B - A*C;
  int kind = -1;                                                // 0 curved side, 1 lower cap, 2 upper cap
  if (disc > 0.0 && A > 1e-9){
    float sq = sqrt(disc);
    float t0 = (-B - sq) / A, t1 = (-B + sq) / A;
    float y0h = ro.y + rd.y*t0;
    if (t0 > tCur && t0 < tLim && y0h > y0 && y0h < y1 && t0 < best){ best = t0; kind = 0; }
    float y1h = ro.y + rd.y*t1;
    if (t1 > tCur && t1 < tLim && y1h > y0 && y1h < y1 && t1 < best){ best = t1; kind = 0; }
  }
  for (int k = 0; k < 2; k++){                                  // end caps
    float t = ((k == 0 ? y0 : y1) - ro.y) / rd.y;
    if (t > tCur && t < tLim && t < best){ vec2 pp = ro.xz + rd.xz*t - c; if (dot(pp, pp) < r*r){ best = t; kind = k + 1; } }
  }
  if (kind >= 0 && best < gHitT){
    gHitT = best;
    if (kind == 0){ vec2 pp = ro.xz + rd.xz*best - c; gHitN = normalize(vec3(pp.x, 0.0, pp.y)); }
    else gHitN = vec3(0.0, kind == 1 ? -1.0 : 1.0, 0.0);
  }
  return best;
}

// One building's shape family. 0 plain slab, 1 podium + shaft, 2 stepped ziggurat,
// 3 round tower, 4 stepped crown, 5 setback tower with antenna.
// Cladding of one block: 0 concrete, 1 glass curtain wall, 2 brick / stone.
int matClassOf(vec2 id){
  if (stationAt(id)) return 1;                            // stations are glazed and lit right through
  float m = hash21(id + 101.3);
  int dz = districtOf(id);
  if (dz == 0 || dz == 3) return m < 0.68 ? 1 : 0;      // downtown and offices: curtain wall
  if (dz == 2) return m < 0.62 ? 2 : 0;                 // old town: masonry
  if (dz == 4) return 0;                                 // industrial: concrete
  return m < 0.30 ? 1 : (m < 0.70 ? 2 : 0);              // entertainment: a mixture
}
int archOf(vec2 id){
  float h = hash21(id);
  if (h > 0.95) return 5;
  float a = hash21(id + 51.7);
  return a < 0.20 ? 1 : (a < 0.38 ? 2 : (a < 0.52 ? 3 : (a < 0.66 ? 4 : 0)));
}
// One 袖看板: an internally lit box projecting perpendicular from the facade, stacked one per tenant
// floor. The street runs along z, so the box sticks out along x and its two printed faces look up and
// down the street — which is how you actually read them while walking.
bool signOf(vec2 id, int k, out vec3 c, out vec3 e, out float atlasIdx){
  // 0.60 x 2.40 m. The atlas cell is 1:4 and the panel was 1:2.9, which stretched every character
  // 38% wide; a real 袖看板 is about 1:4 anyway, so the geometry was the thing that was wrong.
  c = vec3(0.0); e = vec3(0.30, 1.20, 0.05); atlasIdx = 0.0;
  if (riverRow(id.y)) return false;
  vec2 hs; float ht; cellParams(id, hs, ht);
  if (ht < 6.0) return false;
  float dens = (districtOf(id) == 1) ? 0.85 : 0.18;   // the neon bands are papered with them; ordinary streets stay sparse
  if (hash21(id + 140.0 + float(k)*11.0) >= dens) return false;
  float y = 2.9 + 2.5*float(k);
  if (y + e.y > ht) return false;
  vec2 ctr = (id + 0.5)*CELL + lotOffset(id, hs);
  float side = hash21(id + 151.0 + float(k)*3.0) < 0.5 ? -1.0 : 1.0;
  float zoff = (hash21(id + 163.0 + float(k)*5.0) - 0.5) * max(hs.y - 0.4, 0.0) * 1.4;
  c = vec3(ctr.x + side*(hs.x + 0.34), y, ctr.y + zoff);
  atlasIdx = floor(hash21(id + 177.0 + float(k)*7.0) * 47.999);
  return true;
}
// 屋上看板: a board standing on the roof, broadside to the street so it reads from up the block.
bool roofSignOf(vec2 id, out vec3 c, out vec3 e, out float ai){
  c = vec3(0.0); e = vec3(0.0); ai = 0.0;
  if (riverRow(id.y)) return false;
  vec2 hs; float ht; cellParams(id, hs, ht);
  if (ht < 9.0 || ht > 30.0) return false;
  float dens = (districtOf(id) == 1) ? 0.55 : 0.22;
  if (hash21(id + 301.0) >= dens) return false;
  vec2 ctr = (id + 0.5)*CELL + lotOffset(id, hs);
  float w = min(hs.x * 0.85, 2.6), h = 0.75 + 0.35*hash21(id + 303.0);
  c = vec3(ctr.x + (hash21(id + 305.0) - 0.5)*hs.x*0.5, ht + 0.35 + h, ctr.y + (hash21(id + 307.0) - 0.5)*hs.y*0.8);
  e = vec3(w, h, 0.09);
  ai = floor(hash21(id + 309.0) * 47.999);
  return true;
}
// 壁面看板: a panel flat on the facade, a couple of floors up.
bool wallSignOf(vec2 id, int k, out vec3 c, out vec3 e, out float ai){
  c = vec3(0.0); e = vec3(0.08, 0.42, 1.5); ai = 0.0;
  if (riverRow(id.y)) return false;
  float dens = (districtOf(id) == 1) ? 0.6 : 0.3;
  if (hash21(id + 321.0 + float(k)*9.0) >= dens) return false;
  vec2 hs; float ht; cellParams(id, hs, ht);
  if (ht < 5.0) return false;
  float y = 4.0 + 2.6*float(k) + 1.2*hash21(id + 323.0 + float(k));
  if (y + 0.6 > ht) return false;
  vec2 ctr = (id + 0.5)*CELL + lotOffset(id, hs);
  float side = hash21(id + 325.0 + float(k)) < 0.5 ? -1.0 : 1.0;
  e.z = min(hs.y * 0.7, 1.6);
  c = vec3(ctr.x + side*(hs.x + e.x*0.6), y, ctr.y + (hash21(id + 327.0 + float(k)) - 0.5)*(hs.y - e.z));
  ai = floor(hash21(id + 329.0 + float(k)) * 47.999);
  return true;
}
// テナント看板: the stacked directory beside a multi-tenant entrance. This is the layer that was missing —
// the densest signage on a Japanese street sits below three metres, right where people read it.
bool tenantOf(vec2 id, int k, out vec3 c, out vec3 e){
  c = vec3(0.0); e = vec3(0.07, 1.10, 0.52);
  if (riverRow(id.y)) return false;
  float dens = (districtOf(id) == 1) ? 0.9 : 0.6;
  if (hash21(id + 341.0 + float(k)*13.0) >= dens) return false;
  vec2 hs; float ht; cellParams(id, hs, ht);
  if (ht < 4.0) return false;
  vec2 ctr = (id + 0.5)*CELL + lotOffset(id, hs);
  float side = k == 0 ? -1.0 : 1.0;                              // one either side: both streets get a directory
  c = vec3(ctr.x + side*(hs.x + e.x*0.8), 1.95, ctr.y + (hash21(id + 345.0 + float(k)*5.0) - 0.5)*(hs.y - e.z)*1.4);
  return true;
}
// 提灯: a row of paper lanterns under the canopy.
bool lanternOf(vec2 id, int k, out vec3 c, out float r){
  c = vec3(0.0); r = 0.145;
  if (riverRow(id.y)) return false;
  if (hash21(id + 361.0) >= ((districtOf(id) == 1) ? 0.8 : 0.45)) return false;
  vec2 hs; float ht; cellParams(id, hs, ht);
  vec2 ctr = (id + 0.5)*CELL + lotOffset(id, hs);
  float side = hash21(id + 363.0) < 0.5 ? -1.0 : 1.0;
  float z0 = ctr.y + (hash21(id + 365.0) - 0.5)*(hs.y - 1.2);
  c = vec3(ctr.x + side*(hs.x + 0.30), 2.02, z0 + (float(k) - 1.5)*0.52);
  return true;
}
// 立て看板: the little board a shop puts out on the pavement.
bool aboardOf(vec2 id, out vec3 c, out vec3 e, out float ai){
  c = vec3(0.0); e = vec3(0.05, 0.34, 0.46); ai = 0.0;
  if (riverRow(id.y)) return false;
  if (hash21(id + 381.0) >= ((districtOf(id) == 1) ? 0.7 : 0.4)) return false;
  vec2 hs; float ht; cellParams(id, hs, ht);
  vec2 ctr = (id + 0.5)*CELL + lotOffset(id, hs);
  float side = hash21(id + 383.0) < 0.5 ? -1.0 : 1.0;
  c = vec3(ctr.x + side*(hs.x + 0.62), 0.50, ctr.y + (hash21(id + 385.0) - 0.5)*(hs.y - 0.8));
  ai = floor(hash21(id + 387.0) * 47.999);
  return true;
}

float signsSDF(vec2 id, vec3 p){
  float d = 1e5;
  for (int k = 0; k < 3; k++){ vec3 c, e; float ai; if (signOf(id, k, c, e, ai)) d = min(d, sdBox(p - c, e)); }
  return d;
}
// Where a point sits on a flat panel, whichever way the panel faces.
vec2 panelUV(vec3 p, vec3 c, vec3 e, vec3 n){
  bool thinX = e.x < e.z;
  float u = thinX ? (p.z - c.z) / e.z : (p.x - c.x) / e.x;
  // A street board is printed on both faces and reads the right way round from either side. Sharing
  // one u across both meant the far face was a mirror image — every sign seen from behind was
  // backwards, which is most of the signs in any given shot.
  if (thinX ? (n.x > 0.0) : (n.z < 0.0)) u = -u;
  return vec2(u * 0.5 + 0.5, 0.5 - (p.y - c.y) / e.y * 0.5);
}
// Which horizontal board a point belongs to: rooftop, flush wall, or the one on the pavement.
float hsignSample(vec3 p, vec3 n, out vec2 uvOut){
  uvOut = vec2(0.5);
  vec2 id = floor(p.xz / CELL);
  vec3 c, e; float ai;
  if (roofSignOf(id, c, e, ai)){ vec3 q = abs(p - c) - e; if (max(q.x, max(q.y, q.z)) < 0.04){ uvOut = panelUV(p, c, e, n); return ai; } }
  for (int k = 0; k < 2; k++) if (wallSignOf(id, k, c, e, ai)){ vec3 q = abs(p - c) - e; if (max(q.x, max(q.y, q.z)) < 0.04){ uvOut = panelUV(p, c, e, n); return ai; } }
  if (aboardOf(id, c, e, ai)){ vec3 q = abs(p - c) - e; if (max(q.x, max(q.y, q.z)) < 0.04){ uvOut = panelUV(p, c, e, n); return ai; } }
  return -1.0;
}
// Which sign a shaded point belongs to, and where on its printed face it sits.
float signSample(vec3 p, vec3 n, out vec2 uvOut){
  uvOut = vec2(0.5);
  vec2 id = floor(p.xz / CELL);
  for (int k = 0; k < 3; k++){
    vec3 c, e; float ai;
    if (!signOf(id, k, c, e, ai)) continue;
    vec3 q = abs(p - c) - e;
    if (max(q.x, max(q.y, q.z)) < 0.03){
      // A 袖看板 is a blade hanging off the building, printed on both faces and read from either end
      // of the street. Both faces shared one u, so the one the camera actually drives towards — every
      // single one of them, since the dolly runs up +z — was a mirror image.
      float u = (p.x - c.x) / e.x;
      if (n.z < 0.0) u = -u;
      uvOut = vec2(u * 0.5 + 0.5, 0.5 - (p.y - c.y) / e.y * 0.5);
      return ai;
    }
  }
  return -1.0;
}

// How much of a street prop survives as the lens closes on it. The first version of every prop was
// culled on raw distance to the camera — 7 m for a kiosk, 14 m for a car — which blinks a full-size
// object out of the middle of the frame, once per prop, all the way down the street. Two changes:
// the test is about the camera's *axis*, so anything walking past off to the side is never touched at
// all; and what is left shrinks to nothing over a few metres instead of switching off.
float lensFade(vec3 c, float near){
  vec2 fwd = normalize(uCamFw.xz);
  vec2 v = c.xz - uCamRo.xz;
  if (dot(v, fwd) < 0.6) return 0.0;                             // level with or behind the lens: already out of frame
  return smoothstep(near, near*1.9, length(v));                  // and what is still ahead shrinks, it does not blink
}

// A vending machine against the building line. Nothing sets the scale of a Japanese street faster:
// everyone knows how tall one is, so the building behind it stops being an abstract box.
bool vendOf(vec2 id, int k, out vec3 c, out vec3 e){
  c = vec3(0.0); e = vec3(0.44, 0.76, 0.32);
  if (riverRow(id.y)) return false;
  if (hash21(id + 210.0 + float(k)*13.0) >= (mod(floor(id.y / 6.0), 2.0) == 1.0 ? 0.55 : 0.30)) return false;
  vec2 hs; float ht; cellParams(id, hs, ht);
  vec2 ctr = (id + 0.5)*CELL + lotOffset(id, hs);
  float side = hash21(id + 221.0 + float(k)) < 0.5 ? -1.0 : 1.0;
  float zoff = (hash21(id + 233.0 + float(k)*3.0) - 0.5) * max(hs.y - 0.6, 0.0) * 1.6 + float(k)*0.95;
  c = vec3(ctr.x + side*(hs.x + 0.34), 0.12 + e.y, ctr.y + zoff);
  float f = lensFade(c, 4.2);
  if (f < 0.03) return false;
  e *= f; c.y = 0.12 + e.y;                                    // sits on the pavement while it shrinks
  return true;
}
// A car in one of the two lanes of the street on this cell's -x edge. Same timing as carLights(),
// so the body and the pool of light it throws on the road belong to each other.
bool carOf(vec2 id, int lane, out vec3 c, out vec3 e, out float dir){
  c = vec3(0.0); e = vec3(0.70, 0.34, 1.65); dir = 1.0;
  if (riverRow(id.y)) return false;
  if (id.x == 0.0 && lane != 0) return false;                 // keep the camera's own lane clear, but not the oncoming one
  dir = lane == 0 ? 1.0 : -1.0;
  vec2 seed = vec2(id.x*1.7, float(lane));
  float P  = 11.0 + 9.0*hash21(seed);
  float sp = 8.0 + 6.0*hash21(seed + 4.0);
  float c0 = dir*iTime*sp + 100.0*hash21(seed + 8.0);
  float zc = (id.y + 0.5)*CELL;
  float n  = floor((zc - c0) / P + 0.5);
  float cpos = c0 + n*P;
  if (abs(cpos - zc) > CELL*0.5) return false;                // that car sits in another block; it is that block's to draw
  if (hash21(seed + n*0.31 + 12.0) > 0.72) return false;
  c = vec3(id.x*CELL + dir*streetHalf(id.x)*0.45, 0.12 + e.y, cpos);
  float f = lensFade(c, 6.0);                                  // the lane beside the lens stays clear, but it fades out of it
  if (f < 0.03) return false;
  e *= f; c.y = 0.12 + e.y;
  return true;
}
// Someone on the pavement. A figure of known height is the cheapest way to tell the viewer whether
// the building behind it is thirty storeys or three hundred.
bool pedOf(vec2 id, int k, out vec3 base, out float bob, out float sc){
  base = vec3(0.0); bob = 0.0; sc = 1.0;
  if (riverRow(id.y)) return false;
  vec2 seed = id + 260.0 + float(k)*17.0;
  if (hash21(seed) >= (mod(floor(id.y / 6.0), 2.0) == 1.0 ? 0.75 : 0.40)) return false;
  vec2 hs; float ht; cellParams(id, hs, ht);
  vec2 ctr = (id + 0.5)*CELL + lotOffset(id, hs);
  float side = hash21(seed + 1.0) < 0.5 ? -1.0 : 1.0;
  float dir  = hash21(seed + 2.0) < 0.5 ? -1.0 : 1.0;
  float sp   = 1.0 + 0.7*hash21(seed + 3.0);
  float lane = 0.55 + 0.55*hash21(seed + 4.0);                    // how far out from the wall they walk
  float z0   = (id.y + 0.5)*CELL + (hash21(seed + 5.0) - 0.5)*CELL;
  float z    = z0 + dir*iTime*sp;
  z = (id.y + 0.5)*CELL + mod(z - (id.y + 0.5)*CELL + CELL*0.5, CELL) - CELL*0.5;   // stays on its own block
  base = vec3(ctr.x + side*(hs.x + lane), 0.12, z);
  bob = 0.035 * sin(iTime * sp * 5.2 + hash21(seed + 6.0) * 6.28);
  sc = lensFade(base, 3.6);                                    // same: a figure reads as scale at a distance, not in your face
  return sc > 0.03;
}
float streetPropsSDF(vec2 id, vec3 p, inout int mat){
  float d = 1e5;
  for (int k = 0; k < 2; k++){ vec3 c, e; if (vendOf(id, k, c, e)){ float v = sdBox(p - c, e); if (v < d){ d = v; mat = 9; } } }
  for (int k = 0; k < 2; k++){ vec3 b0; float bob, sc;
    if (pedOf(id, k, b0, bob, sc)){
      float body = sdCylY(p, b0.xz, 0.115*sc, b0.y + 0.05, b0.y + (0.78 + bob)*sc);                  // legs
      body = min(body, sdCylY(p, b0.xz, 0.185*sc, b0.y + (0.70 + bob)*sc, b0.y + (1.32 + bob)*sc)); // torso
      body = min(body, sdSphere(p, b0 + vec3(0.0, (1.44 + bob)*sc, 0.0), 0.125*sc));               // head
      if (body < d){ d = body; mat = 11; }
    } }
  for (int k = 0; k < 2; k++){ vec3 c, e; float dr;
    if (carOf(id, k, c, e, dr)){
      float b = sdBox(p - c, e);
      b = min(b, sdBox(p - c - vec3(0.0, e.y*0.85, -0.15*dr), vec3(e.x*0.78, e.y*0.55, e.z*0.48)));   // cabin
      if (b < d){ d = b; mat = 10; }
    } }
  return d;
}

// A skybridge from this cell toward +x (axis 0) or +z (axis 1), if both neighbours can carry one.
bool bridgeOf(vec2 id, int axis, out float by, out float hw, out float span0, out float span1, out float perp){
  by = 0.0; hw = 0.6; span0 = 0.0; span1 = 0.0; perp = 0.0;
  vec2 idB = id + (axis == 0 ? vec2(1.0, 0.0) : vec2(0.0, 1.0));
  if (riverRow(id.y) || riverRow(idB.y)) return false;
  float dens = (districtOf(id) == 1) ? 0.30 : 0.14;   // denser over the neon bands
  if (hash21(id + 61.3 + float(axis)*7.0) >= dens) return false;
  vec2 hsA; float htA; cellParams(id, hsA, htA);
  vec2 hsB; float htB; cellParams(idB, hsB, htB);
  if (min(htA, htB) < 9.0) return false;
  vec2 cA = (id + 0.5)*CELL + lotOffset(id, hsA), cB = (idB + 0.5)*CELL + lotOffset(idB, hsB);
  float top = min(htA, htB) - 1.5;
  by = mix(4.0, top, 0.25 + 0.6*hash21(id + 71.9 + float(axis)));
  if (by < 3.5 || by > top) return false;
  hw = 0.5 + 0.35*hash21(id + 83.1 + float(axis));
  if (axis == 0){ span0 = cA.x + hsA.x - 0.2; span1 = cB.x - hsB.x + 0.2; perp = mix(cA.y, cB.y, 0.5); }
  else          { span0 = cA.y + hsA.y - 0.2; span1 = cB.y - hsB.y + 0.2; perp = mix(cA.x, cB.x, 0.5); }
  return span1 > span0 + 0.5;
}
// bridges that can reach into this cell: the one it owns and the ones its -x / -z neighbours own
float bridgesSDF(vec2 id, vec3 p){
  float d = 1e5;
  for (int k = 0; k < 4; k++){
    int axis = k & 1;
    vec2 src = id - ((k < 2) ? vec2(0.0) : (axis == 0 ? vec2(1.0, 0.0) : vec2(0.0, 1.0)));
    float by, hw, s0, s1, perp;
    if (!bridgeOf(src, axis, by, hw, s0, s1, perp)) continue;
    vec3 c = axis == 0 ? vec3(0.5*(s0 + s1), by, perp) : vec3(perp, by, 0.5*(s0 + s1));
    vec3 e = axis == 0 ? vec3(0.5*(s1 - s0), hw, hw) : vec3(hw, hw, 0.5*(s1 - s0));
    d = min(d, sdBox(p - c, e));
  }
  return d;
}

// Platform canopy, its columns, the platforms themselves and the kiosk on the plaza.
float civicSDF(vec2 id, vec3 p, inout int mat){
  float d = 1e5;
  float cx = (id.x + 0.5)*CELL, zc = (id.y + 0.5)*CELL;
  if (stationAt(id)){
    d = min(d, sdBox(vec3(p.x - cx, p.y - 9.45, p.z - zc), vec3(CELL*0.5, 0.16, 3.2)));          // canopy
    for (int k = 0; k < 4; k++){                                                                  // its columns
      float sx = (k < 2 ? -1.0 : 1.0) * (CELL*0.5 - 0.9), sz = ((k & 1) == 0 ? -1.0 : 1.0) * 2.9;
      d = min(d, sdBox(vec3(p.x - cx - sx, p.y - 8.5, p.z - zc - sz), vec3(0.14, 0.95, 0.14)));
    }
    for (int k = 0; k < 2; k++)                                                                   // the two platforms
      d = min(d, sdBox(vec3(p.x - cx, p.y - 7.62, p.z - zc - (k == 0 ? -2.35 : 2.35)), vec3(CELL*0.5, 0.10, 0.80)));
    if (d < 1e4) mat = 7;
  }
  if (plazaAt(id) && p.y < 3.4){
    float kx = cx + 2.1, kz = zc - 1.8;                                                           // a kiosk on the square
    float k = sdBox(vec3(p.x - kx, p.y - 1.25, p.z - kz), vec3(0.95, 1.25, 0.85));
    if (k < d){ d = k; mat = 9; }
  }
  return d;
}
// Viaduct deck and its piers, for the cell the point is in.
float viaductSDF(vec2 id, vec3 p){
  if (!viaductRow(id.y)) return 1e5;
  float zc = (id.y + 0.5)*CELL;
  float d = sdBox(vec3(p.x - (id.x + 0.5)*CELL, p.y - VIA_Y, p.z - zc), vec3(CELL*0.5, VIA_HT, VIA_HZ));
  float px = id.x*CELL;                                                    // one pier per block, on the street line
  d = min(d, sdBox(vec3(p.x - px, p.y - (VIA_Y - VIA_HT)*0.5, p.z - zc), vec3(0.55, (VIA_Y - VIA_HT)*0.5, 0.55)));
  return d;
}
// Where a street crosses the water it crosses on a bridge; elsewhere the bank has a parapet.
float riverEdgeSDF(vec2 id, vec3 p, inout int mat){
  if (!riverRow(id.y)) return 1e5;
  float d = 1e5;
  for (int k = 0; k < 2; k++){
    float kx = id.x + float(k), hw = streetHalf(kx);
    float b = sdBox(vec3(p.x - kx*CELL, p.y - 0.30, p.z - (id.y + 0.5)*CELL), vec3(hw, 0.30, CELL*0.5));
    if (b < d){ d = b; mat = 2; }
    float rail = sdBox(vec3(abs(p.x - kx*CELL) - hw + 0.10, p.y - 0.85, p.z - (id.y + 0.5)*CELL), vec3(0.10, 0.28, CELL*0.5));
    if (rail < d){ d = rail; mat = 7; }
  }
  float rowm = mod(id.y, 7.0);                                             // parapet along the bank
  float zEdge = (rowm == 3.0 ? id.y*CELL : (id.y + 1.0)*CELL);
  float w = sdBox(vec3(p.x - (id.x + 0.5)*CELL, p.y - 0.42, p.z - zEdge), vec3(CELL*0.5, 0.42, 0.22));
  if (w < d){ d = w; mat = 2; }
  return d;
}
float lotSDF(vec2 id, vec3 p, out int mat){                    // the building(s) of one cell, exact
  mat = 1;
  float br = bridgesSDF(id, p);
  { float v = viaductSDF(id, p); if (v < br){ br = v; mat = 7; } }
  { int cm = mat; float cv = civicSDF(id, p, cm); if (cv < br){ br = cv; mat = cm; } }
  if (plazaAt(id)) return br;                                   // the square is kept clear
  if (riverRow(id.y)){ int rm = mat; float re = riverEdgeSDF(id, p, rm); if (re < br){ br = re; mat = rm; } return br; }
  vec2 hs; float ht; cellParams(id, hs, ht);
  if (stationAt(id)){                                           // concourse: a low lit hall under the tracks
    // It has to respect the street like every other lot. With a fixed half width it was built 0.9 m
    // from the cell edge whatever the street was doing, so on the narrow columns (half width 1.15) its
    // wall landed on the camera's own line and one lit window filled a quarter of the frame.
    float cxc, hxc; lotSpanX(id, cxc, hxc);
    float cc = sdBox(vec3(p.x - cxc, p.y - CONC_H*0.5, p.z - (id.y + 0.5)*CELL), vec3(hxc, CONC_H*0.5, CELL*0.5 - 1.9));
    if (cc < br){ br = cc; mat = 1; }
    return br;
  }
  float h = hash21(id);
  int arch = archOf(id);
  vec2 q = p.xz - (id + 0.5)*CELL - lotOffset(id, hs);
  vec3 lp = vec3(q.x, p.y, q.y);
  float b;
  if (arch == 5){                                             // setback tower: three nested tiers + antenna + beacon
    b = sdBox(vec3(q.x, p.y - ht*0.30, q.y), vec3(hs.x, ht*0.30, hs.y));
    if (p.y > ht*0.55){
      b = min(b, sdBox(vec3(q.x, p.y - ht*0.40, q.y), vec3(hs.x*0.72, ht*0.40, hs.y*0.72)));
      b = min(b, sdBox(vec3(q.x, p.y - ht*0.50, q.y), vec3(hs.x*0.46, ht*0.50, hs.y*0.46)));
    }
    if (p.y > ht - 1.0){
      float ah = ht*0.22;
      b = min(b, sdBox(vec3(q.x, p.y - ht - ah*0.5, q.y), vec3(0.08, ah*0.5, 0.08)));
      if (h > 0.98){
        float beacon = sdBox(vec3(q.x, p.y - ht - ah, q.y), vec3(0.10));
        if (beacon < b){ b = beacon; mat = 3; }
      }
    }
  } else if (arch == 1){                                      // podium + shaft: a wide base carrying a narrower tower
    float pod = min(ht*0.28, 5.0);
    b = sdBox(vec3(q.x, p.y - pod*0.5, q.y), vec3(hs.x, pod*0.5, hs.y));
    vec2 ss = hs * (0.55 + 0.15*hash21(id + 12.7));
    b = min(b, sdBox(vec3(q.x, p.y - ht*0.5, q.y), vec3(ss.x, ht*0.5, ss.y)));
  } else if (arch == 2){                                      // ziggurat: three receding steps
    for (int k = 0; k < 3; k++){
      float f = 1.0 - 0.24*float(k);
      float top = ht * (0.45 + 0.275*float(k));
      float d = sdBox(vec3(q.x, p.y - top*0.5, q.y), vec3(hs.x*f, top*0.5, hs.y*f));
      b = (k == 0) ? d : min(b, d);
    }
  } else if (arch == 3){                                      // round tower
    float r = min(hs.x, hs.y);
    b = sdCylY(lp, vec2(0.0), r, 0.0, ht);
    b = min(b, sdCylY(lp, vec2(0.0), r*0.55, ht, ht + 1.2 + 2.0*hash21(id + 17.3)));   // drum on top
  } else if (arch == 4){                                      // stepped crown
    b = sdBox(vec3(q.x, p.y - ht*0.5, q.y), vec3(hs.x, ht*0.5, hs.y));
    if (p.y > ht - 3.0){
      for (int k = 1; k <= 3; k++){
        float f = 1.0 - 0.22*float(k);
        float y0 = ht + 0.55*float(k - 1), y1 = ht + 0.55*float(k);
        b = min(b, sdBox(vec3(q.x, p.y - 0.5*(y0 + y1), q.y), vec3(hs.x*f, 0.5*(y1 - y0), hs.y*f)));
      }
    }
  } else {                                                    // plain slab
    b = sdBox(vec3(q.x, p.y - ht*0.5, q.y), vec3(hs.x, ht*0.5, hs.y));
  }
  // external pipe bundle running up one face
  float metal = 1e5;
  if (hash21(id + 33.1) < 0.45){
    float side = hash21(id + 34.7);
    float pt = ht * (0.55 + 0.35*hash21(id + 35.9));
    for (int k = 0; k < 3; k++){
      vec2 c = side < 0.5 ? vec2((side < 0.25 ? -1.0 : 1.0) * (hs.x + 0.10), (float(k) - 1.0) * 0.26 + (hash21(id + 36.0) - 0.5))
                          : vec2((float(k) - 1.0) * 0.26 + (hash21(id + 36.0) - 0.5), (side < 0.75 ? -1.0 : 1.0) * (hs.y + 0.10));
      metal = min(metal, sdCylY(lp, c, 0.055 + 0.02*float(k), 0.6, pt));
    }
  }
  if (p.y < 1.8 && hash21(id + 3.9) < 0.6){                    // ground floor: a thin canopy ring around the building
    float ring = max(sdBox(vec3(q.x, p.y - 1.3, q.y), vec3(hs.x + 0.45, 0.03, hs.y + 0.45)), -sdBox(vec3(q.x, p.y - 1.3, q.y), vec3(hs.x - 0.02, 0.2, hs.y - 0.02)));
    b = min(b, ring);
  }
  if (p.y >= ht - 0.5 && arch != 5){                           // roof clutter: tanks, plant rooms, vent stacks
    if (hash21(id + 9.1) < 0.20){
      for (int k = 0; k < 3; k++){
        vec2 o = (hash22(id + 2.2 + float(k)*3.7) - 0.5) * (hs - 0.35) * 1.6;
        float rh = 0.35 + 0.6*hash21(id + 5.5 + float(k));
        metal = min(metal, sdCylY(lp, o, 0.24 + 0.10*float(k), ht, ht + rh));
      }
    } else {
      vec2 rs = hs*0.35; float rh = 0.5 + 1.2*hash21(id + 9.1);
      vec2 ro2 = (hash22(id + 2.2) - 0.5)*(hs - rs)*1.6;
      b = min(b, sdBox(vec3(q.x - ro2.x, p.y - ht - rh*0.5, q.y - ro2.y), vec3(rs.x, rh*0.5, rs.y)));
      metal = min(metal, sdCylY(lp, ro2 + vec2(rs.x*0.6, 0.0), 0.09, ht + rh, ht + rh + 1.1));   // vent stack
    }
  }
  float sg = signsSDF(id, p);
  if (sg < b){ b = sg; mat = 8; }                               // 袖看板
  { vec3 c, e; float ai;
    if (roofSignOf(id, c, e, ai)){ float d2 = sdBox(p - c, e); if (d2 < b){ b = d2; mat = 12; } }
    for (int k = 0; k < 2; k++) if (wallSignOf(id, k, c, e, ai)){ float d2 = sdBox(p - c, e); if (d2 < b){ b = d2; mat = 12; } }
    if (p.y < 3.6){
      if (aboardOf(id, c, e, ai)){ float d2 = sdBox(p - c, e); if (d2 < b){ b = d2; mat = 12; } }
      for (int k = 0; k < 2; k++) if (tenantOf(id, k, c, e)){ float d2 = sdBox(p - c, e); if (d2 < b){ b = d2; mat = 13; } }
      float r; for (int k = 0; k < 4; k++) if (lanternOf(id, k, c, r)){
        float d2 = sdCylY(p, c.xz, r, c.y - 0.14, c.y + 0.14); if (d2 < b){ b = d2; mat = 14; } }
    }
  }
  if (p.y < 2.6){ int pm = mat; float pd = streetPropsSDF(id, p, pm); if (pd < b){ b = pd; mat = pm; } }   // street furniture and traffic
  if (metal < b){ b = metal; mat = 7; }                         // pipes, tanks and vent stacks read as metal
  if (br < b){ b = br; mat = 7; }                               // so do the skybridges
  return b;
}
float slabSDF(vec2 id, vec3 p){                                 // sidewalk slab, kerb 0.12 high
  if (riverRow(id.y)) return 1e5;
  vec2 q = p.xz - (id + 0.5)*CELL;
  float cx, halfx; lotSpanX(id, cx, halfx);
  if (plazaAt(id)) return sdBox(vec3(p.x - cx, p.y - 0.06, q.y), vec3(halfx + 0.7, 0.06, CELL*0.5 - 0.4));   // the square is paved edge to edge
  return sdBox(vec3(p.x - cx, p.y - 0.06, q.y), vec3(halfx, 0.06, CELL*0.5 - 1.55));
}
float lampSDF(vec2 id, vec3 p, out int mat){                    // the two street lamps of one cell (one per N-S street side)
  mat = 1;
  if (riverRow(id.y)) return 1e5;
  float px0 = id.x*CELL + streetHalf(id.x) - 0.3, px1 = (id.x + 1.0)*CELL - streetHalf(id.x + 1.0) + 0.3;
  float lx = min(abs(p.x - px0), abs(p.x - px1));
  float lz = p.z - (id.y + 0.5)*CELL;
  float post = max(length(vec2(lx, lz)) - 0.06, abs(p.y - 1.6) - 1.6);
  float head = sdBox(vec3(lx, p.y - 3.22, lz), vec3(0.13, 0.04, 0.13));
  if (head < post){ mat = 6; return head; }
  return post;
}
float towerSDF(vec3 p, out int mat){                            // landmark tower: 3 tiers, spire, beacon
  mat = 5;
  vec3 tp = p - towerPos();
  float tw = sdBox(vec3(tp.x, tp.y - TOWER_H*0.25, tp.z), vec3(4.2, TOWER_H*0.25, 4.2));
  tw = min(tw, sdBox(vec3(tp.x, tp.y - TOWER_H*0.36, tp.z), vec3(3.0, TOWER_H*0.36, 3.0)));
  tw = min(tw, sdBox(vec3(tp.x, tp.y - TOWER_H*0.50, tp.z), vec3(1.9, TOWER_H*0.50, 1.9)));
  tw = min(tw, sdBox(vec3(tp.x, tp.y - TOWER_H - 7.0, tp.z), vec3(0.22, 7.0, 0.22)));
  float tb = sdBox(vec3(tp.x, tp.y - TOWER_H - 14.0, tp.z), vec3(0.35));
  if (tb < tw){ mat = 3; return tb; }
  return tw;
}

// full scene SDF (used by normals, AO, volumetric shadow taps and the reference march path)
float map(vec3 p){
  float ground = p.y;
  vec2 id = floor(p.xz / CELL);
  vec2 q  = p.xz - (id + 0.5)*CELL;
  float d = 1e5; int mat = 1, m;
  if (p.y < 0.6){ float sd = slabSDF(id, p); if (sd < d){ d = sd; mat = 2; } }
  if (p.y < 3.6 && abs(q.y) < 1.5){ float ld = lampSDF(id, p, m); if (ld < d){ d = ld; mat = m; } }
  float bd = lotSDF(id, p, m); if (bd < d){ d = bd; mat = m; }
  // domain repetition safety for the reference march: never step past the neighbouring cell's building
  float bound = min(CELL*0.5 - abs(q.x), CELL*0.5 - abs(q.y)) + (CELL*0.5 - 2.0);
  d = min(d, bound);
  vec3 tp = p - towerPos();
  float tw = sdBox(vec3(tp.x, tp.y - TOWER_H*0.5 - 8.0, tp.z), vec3(4.2, TOWER_H*0.5 + 8.0, 4.2));   // coarse bound
  if (tw < 2.0){ tw = towerSDF(p, m); if (tw < d){ d = tw; mat = m; } }
  d = min(d, tw);
  gMat = (d < ground) ? mat : 2;
  return min(d, ground);
}

// Cheap stand-in for the scene: one box per block, no shape family, no pipes, no bridges.
// The exact map() branches through five building families, and it is called ~40x per pixel by fog,
// volumetrics, AO and shadows — those only need proximity, so they use this instead.
float mapCoarse(vec3 p){
  float d = p.y;
  vec2 id = floor(p.xz / CELL);
  if (!riverRow(id.y)){
    vec2 hs; float ht; cellParams(id, hs, ht);
    vec2 q = p.xz - (id + 0.5)*CELL - lotOffset(id, hs);
    d = min(d, sdBox(vec3(q.x, p.y - ht*0.5, q.y), vec3(hs.x, ht*0.5, hs.y)));
  }
  vec3 tp = p - towerPos();
  d = min(d, sdBox(vec3(tp.x, tp.y - TOWER_H*0.5, tp.z), vec3(4.2, TOWER_H*0.5, 4.2)));
  return d;
}

// ---- grid-walk tracer: buildings are extrusions, so walk the 2D block grid and only test what the ray crosses ----
vec2 boxHit(vec3 ro, vec3 rd, vec3 bmin, vec3 bmax){
  vec3 inv = 1.0 / rd;
  vec3 t0 = (bmin - ro) * inv, t1 = (bmax - ro) * inv;
  vec3 tm = min(t0, t1), tM = max(t0, t1);
  return vec2(max(max(tm.x, tm.y), tm.z), min(min(tM.x, tM.y), tM.z));
}
// The tracer already knows which face of which primitive it hit, so it records the normal as it
// goes. Rediscovering it afterwards with a four-tap gradient of the exact SDF cost four extra map()
// evaluations per pixel — a third of the whole frame — for a value we had all along, and the
// analytic one is exact where the gradient was only an approximation.
// analytic union of axis-aligned boxes: nearest entry within (tCur, tLim)
float hitBox(vec3 ro, vec3 rd, vec3 bmin, vec3 bmax, float tCur, float tLim){
  vec3 inv = 1.0 / rd;
  vec3 t0 = (bmin - ro) * inv, t1 = (bmax - ro) * inv;
  vec3 tm = min(t0, t1), tM = max(t0, t1);
  float tn = max(max(tm.x, tm.y), tm.z), tf = min(min(tM.x, tM.y), tM.z);
  if (!(tn < tf && tn < tLim && tf > tCur)) return 1e9;
  float t = max(tn, tCur);
  if (t < gHitT){
    gHitT = t;
    vec3 sN = step(vec3(tn - 1e-5), tm) * -sign(rd);    // the slab entered last is the face we are on
    float l = length(sN);
    gHitN = l > 1e-6 ? sN / l : vec3(0.0, 1.0, 0.0);
  }
  return t;
}
float traceDDA(vec3 ro, vec3 rd, float tmax){
  rd.x = abs(rd.x) < 1e-5 ? 1e-5 : rd.x; rd.z = abs(rd.z) < 1e-5 ? 1e-5 : rd.z; rd.y = abs(rd.y) < 1e-6 ? 1e-6 : rd.y;
  float best = tmax;
  gHitT = 1e9; gHitN = vec3(0.0, 1.0, 0.0);
  if (rd.y < 0.0){ float tg = -ro.y / rd.y; if (tg < best){ best = tg; gHitT = tg; gHitN = vec3(0.0, 1.0, 0.0); } }   // ground plane
  { // landmark tower: tiers, spire, beacon
    vec3 T = towerPos();
    float t;
    t = hitBox(ro, rd, T + vec3(-4.2, 0.0, -4.2), T + vec3(4.2, TOWER_H*0.5, 4.2), 0.0, best); best = min(best, t);
    t = hitBox(ro, rd, T + vec3(-3.0, 0.0, -3.0), T + vec3(3.0, TOWER_H*0.72, 3.0), 0.0, best); best = min(best, t);
    t = hitBox(ro, rd, T + vec3(-1.9, 0.0, -1.9), T + vec3(1.9, TOWER_H, 1.9), 0.0, best); best = min(best, t);
    t = hitBox(ro, rd, T + vec3(-0.22, TOWER_H, -0.22), T + vec3(0.22, TOWER_H + 14.0, 0.22), 0.0, best); best = min(best, t);
    t = hitBox(ro, rd, T + vec3(-0.35, TOWER_H + 13.65, -0.35), T + vec3(0.35, TOWER_H + 14.35, 0.35), 0.0, best); best = min(best, t);
  }
  vec2 cell = floor(ro.xz / CELL);
  vec2 stp = sign(rd.xz);
  vec2 tDelta = abs(CELL / rd.xz);
  vec2 tMax = ((cell + max(stp, 0.0)) * CELL - ro.xz) / rd.xz;
  float tCur = 0.0;
  for (int i = 0; i < 96; i++){
    float tExit = min(tMax.x, tMax.y);
    float tLim = min(tExit, best);
    if (tCur < tLim && riverRow(cell.y)){
      float yIn2 = ro.y + rd.y*tCur, yOut2 = ro.y + rd.y*tLim;
      float yLo2 = min(yIn2, yOut2), yHi2 = max(yIn2, yOut2);
      float zcr = (cell.y + 0.5)*CELL;
      if (yLo2 < 1.6){                                             // bridges carrying the streets, and the bank parapet
        for (int k = 0; k < 2; k++){
          float kx = cell.x + float(k), hw = streetHalf(kx);
          best = min(best, hitBox(ro, rd, vec3(kx*CELL - hw, 0.0, zcr - CELL*0.5), vec3(kx*CELL + hw, 0.60, zcr + CELL*0.5), tCur, tLim));
          for (int sg = 0; sg < 2; sg++){
            float xr = kx*CELL + (sg == 0 ? -1.0 : 1.0)*(hw - 0.10);
            best = min(best, hitBox(ro, rd, vec3(xr - 0.10, 0.57, zcr - CELL*0.5), vec3(xr + 0.10, 1.13, zcr + CELL*0.5), tCur, tLim));
          }
        }
        float rowm = mod(cell.y, 7.0);
        float zEdge = (rowm == 3.0 ? cell.y*CELL : (cell.y + 1.0)*CELL);
        best = min(best, hitBox(ro, rd, vec3(cell.x*CELL, 0.0, zEdge - 0.22), vec3((cell.x + 1.0)*CELL, 0.84, zEdge + 0.22), tCur, tLim));
      }
      if (viaductRow(cell.y) && yHi2 > 0.0){
        float cxm = (cell.x + 0.5)*CELL, pxv = cell.x*CELL;
        best = min(best, hitBox(ro, rd, vec3(cxm - CELL*0.5, VIA_Y - VIA_HT, zcr - VIA_HZ), vec3(cxm + CELL*0.5, VIA_Y + VIA_HT, zcr + VIA_HZ), tCur, tLim));
        best = min(best, hitBox(ro, rd, vec3(pxv - 0.55, 0.0, zcr - 0.55), vec3(pxv + 0.55, VIA_Y - VIA_HT, zcr + 0.55), tCur, tLim));
      }
    }
    if (tCur < tLim && !riverRow(cell.y)){
      vec2 c = (cell + 0.5)*CELL;
      float yIn = ro.y + rd.y*tCur, yOut = ro.y + rd.y*tLim;
      float yLo = min(yIn, yOut), yHi = max(yIn, yOut);
      float sh = CELL*0.5 - 1.55, scx, shx; lotSpanX(cell, scx, shx);
      if (plazaAt(cell)){ sh = CELL*0.5 - 0.4; shx += 0.7; }      // the square is paved edge to edge
      if (yLo < 0.13) best = min(best, hitBox(ro, rd, vec3(scx - shx, -0.01, c.y - sh), vec3(scx + shx, 0.12, c.y + sh), tCur, tLim));   // sidewalk slab
      vec2 hs; float ht; cellParams(cell, hs, ht); vec2 off = lotOffset(cell, hs);
      vec2 bc = c + off;
      float h = hash21(cell);
      int arch = archOf(cell);
      // one conservative bound for the whole lot (building + canopy + pipes + roof clutter).
      // Rays travelling down a street pass most blocks without touching them; rejecting those with a
      // single box test instead of a dozen primitive tests is the difference between 120 ms and 15 ms.
      if (stationAt(cell)){                                       // concourse hall
        float cxs, hxs; lotSpanX(cell, cxs, hxs);
        float zcs = (cell.y + 0.5)*CELL;
        best = min(best, hitBox(ro, rd, vec3(cxs - hxs, 0.0, zcs - CELL*0.5 + 1.9), vec3(cxs + hxs, CONC_H, zcs + CELL*0.5 - 1.9), tCur, tLim));
      }
      if (!stationAt(cell) && !plazaAt(cell)){
      vec2 lotB = boxHit(ro, rd, vec3(bc.x - hs.x - 0.85, -0.05, bc.y - hs.y - 0.6), vec3(bc.x + hs.x + 0.85, ht + 8.0, bc.y + hs.y + 0.6));
      if (lotB.x < lotB.y && lotB.x < tLim && lotB.y > tCur){
        if (arch == 5){                                           // setback tower: three nested tiers + antenna + beacon
          best = min(best, hitBox(ro, rd, vec3(bc.x - hs.x, 0.0, bc.y - hs.y), vec3(bc.x + hs.x, ht*0.6, bc.y + hs.y), tCur, tLim));
          best = min(best, hitBox(ro, rd, vec3(bc.x - hs.x*0.72, 0.0, bc.y - hs.y*0.72), vec3(bc.x + hs.x*0.72, ht*0.8, bc.y + hs.y*0.72), tCur, tLim));
          best = min(best, hitBox(ro, rd, vec3(bc.x - hs.x*0.46, 0.0, bc.y - hs.y*0.46), vec3(bc.x + hs.x*0.46, ht, bc.y + hs.y*0.46), tCur, tLim));
          if (yHi > ht - 0.5){
            float ah = ht*0.22;
            best = min(best, hitBox(ro, rd, vec3(bc.x - 0.08, ht, bc.y - 0.08), vec3(bc.x + 0.08, ht + ah, bc.y + 0.08), tCur, tLim));
            if (h > 0.98) best = min(best, hitBox(ro, rd, vec3(bc.x - 0.10, ht + ah - 0.10, bc.y - 0.10), vec3(bc.x + 0.10, ht + ah + 0.10, bc.y + 0.10), tCur, tLim));
          }
        } else if (arch == 1){                                    // podium + shaft
          float pod = min(ht*0.28, 5.0);
          best = min(best, hitBox(ro, rd, vec3(bc.x - hs.x, 0.0, bc.y - hs.y), vec3(bc.x + hs.x, pod, bc.y + hs.y), tCur, tLim));
          vec2 ss = hs * (0.55 + 0.15*hash21(cell + 12.7));
          best = min(best, hitBox(ro, rd, vec3(bc.x - ss.x, 0.0, bc.y - ss.y), vec3(bc.x + ss.x, ht, bc.y + ss.y), tCur, tLim));
        } else if (arch == 2){                                    // ziggurat
          for (int k = 0; k < 3; k++){
            float f = 1.0 - 0.24*float(k);
            float top = ht * (0.45 + 0.275*float(k));
            best = min(best, hitBox(ro, rd, vec3(bc.x - hs.x*f, 0.0, bc.y - hs.y*f), vec3(bc.x + hs.x*f, top, bc.y + hs.y*f), tCur, tLim));
          }
        } else if (arch == 3){                                    // round tower + drum
          float r = min(hs.x, hs.y);
          best = min(best, hitCylY(ro, rd, bc, r, 0.0, ht, tCur, tLim));
          best = min(best, hitCylY(ro, rd, bc, r*0.55, ht, ht + 1.2 + 2.0*hash21(cell + 17.3), tCur, tLim));
        } else if (arch == 4){                                    // stepped crown
          best = min(best, hitBox(ro, rd, vec3(bc.x - hs.x, 0.0, bc.y - hs.y), vec3(bc.x + hs.x, ht, bc.y + hs.y), tCur, tLim));
          if (yHi > ht - 0.5){
            for (int k = 1; k <= 3; k++){
              float f = 1.0 - 0.22*float(k);
              best = min(best, hitBox(ro, rd, vec3(bc.x - hs.x*f, ht + 0.55*float(k - 1), bc.y - hs.y*f), vec3(bc.x + hs.x*f, ht + 0.55*float(k), bc.y + hs.y*f), tCur, tLim));
            }
          }
        } else {                                                  // plain slab
          best = min(best, hitBox(ro, rd, vec3(bc.x - hs.x, 0.0, bc.y - hs.y), vec3(bc.x + hs.x, ht, bc.y + hs.y), tCur, tLim));
        }
        if (yLo < 12.0){                                          // 袖看板 projecting from the facade
          for (int k = 0; k < 3; k++){ vec3 sc, se; float ai;
            if (signOf(cell, k, sc, se, ai)) best = min(best, hitBox(ro, rd, sc - se, sc + se, tCur, tLim)); }
        }
        { vec3 sc, se; float ai;                                  // rooftop board and flush wall panels
          if (yHi > ht - 1.0 && roofSignOf(cell, sc, se, ai)) best = min(best, hitBox(ro, rd, sc - se, sc + se, tCur, tLim));
          if (yLo < 14.0) for (int k = 0; k < 2; k++)
            if (wallSignOf(cell, k, sc, se, ai)) best = min(best, hitBox(ro, rd, sc - se, sc + se, tCur, tLim));
        }
        if (yLo < 3.6){                                           // the shop-front layer: directory, lanterns, pavement board
          vec3 sc, se; float ai;
          if (aboardOf(cell, sc, se, ai)) best = min(best, hitBox(ro, rd, sc - se, sc + se, tCur, tLim));
          for (int k = 0; k < 2; k++) if (tenantOf(cell, k, sc, se)) best = min(best, hitBox(ro, rd, sc - se, sc + se, tCur, tLim));
          float r; for (int k = 0; k < 4; k++)
            if (lanternOf(cell, k, sc, r)) best = min(best, hitCylY(ro, rd, sc.xz, r, sc.y - 0.14, sc.y + 0.14, tCur, tLim));
        }
        if (hash21(cell + 33.1) < 0.45){                          // external pipe bundle up one face
          float side = hash21(cell + 34.7);
          float pt = ht * (0.55 + 0.35*hash21(cell + 35.9));
          for (int k = 0; k < 3; k++){
            vec2 pc = side < 0.5 ? vec2((side < 0.25 ? -1.0 : 1.0) * (hs.x + 0.10), (float(k) - 1.0) * 0.26 + (hash21(cell + 36.0) - 0.5))
                                 : vec2((float(k) - 1.0) * 0.26 + (hash21(cell + 36.0) - 0.5), (side < 0.75 ? -1.0 : 1.0) * (hs.y + 0.10));
            best = min(best, hitCylY(ro, rd, bc + pc, 0.055 + 0.02*float(k), 0.6, pt, tCur, tLim));
          }
        }
        if (arch != 5 && yHi > ht - 0.5){                          // roof clutter
          if (hash21(cell + 9.1) < 0.20){
            for (int k = 0; k < 3; k++){
              vec2 o = (hash22(cell + 2.2 + float(k)*3.7) - 0.5) * (hs - 0.35) * 1.6;
              float rh = 0.35 + 0.6*hash21(cell + 5.5 + float(k));
              best = min(best, hitCylY(ro, rd, bc + o, 0.24 + 0.10*float(k), ht, ht + rh, tCur, tLim));
            }
          } else {
            vec2 rs = hs*0.35; float rh = 0.5 + 1.2*hash21(cell + 9.1);
            vec2 ro2 = (hash22(cell + 2.2) - 0.5)*(hs - rs)*1.6;
            best = min(best, hitBox(ro, rd, vec3(bc.x + ro2.x - rs.x, ht, bc.y + ro2.y - rs.y), vec3(bc.x + ro2.x + rs.x, ht + rh, bc.y + ro2.y + rs.y), tCur, tLim));
            best = min(best, hitCylY(ro, rd, bc + ro2 + vec2(rs.x*0.6, 0.0), 0.09, ht + rh, ht + rh + 1.1, tCur, tLim));
          }
        }
        if (yLo < 1.4 && yHi > 1.2 && hash21(cell + 3.9) < 0.6){   // canopy ring (its hole is the building itself)
          float tr = hitBox(ro, rd, vec3(bc.x - hs.x - 0.45, 1.27, bc.y - hs.y - 0.45), vec3(bc.x + hs.x + 0.45, 1.33, bc.y + hs.y + 0.45), tCur, tLim);
          if (tr < 1e8){ vec3 pr = ro + rd*tr; if (abs(pr.x - bc.x) > hs.x - 0.02 || abs(pr.z - bc.y) > hs.y - 0.02) best = min(best, tr); }
        }
      }
      if (yLo < 42.0 && yHi > 3.0) for (int k = 0; k < 4; k++){     // skybridges reaching into this cell
        int axis = k & 1;
        vec2 src = cell - ((k < 2) ? vec2(0.0) : (axis == 0 ? vec2(1.0, 0.0) : vec2(0.0, 1.0)));
        float by, hw, s0, s1, perp;
        if (!bridgeOf(src, axis, by, hw, s0, s1, perp)) continue;
        vec3 lo = axis == 0 ? vec3(s0, by - hw, perp - hw) : vec3(perp - hw, by - hw, s0);
        vec3 hi = axis == 0 ? vec3(s1, by + hw, perp + hw) : vec3(perp + hw, by + hw, s1);
        best = min(best, hitBox(ro, rd, lo, hi, tCur, tLim));
      }
      if (stationAt(cell) && yHi > 6.0){                          // station: canopy, columns, platforms
        float cxs = (cell.x + 0.5)*CELL, zcs = (cell.y + 0.5)*CELL;
        best = min(best, hitBox(ro, rd, vec3(cxs - CELL*0.5, 9.29, zcs - 3.2), vec3(cxs + CELL*0.5, 9.61, zcs + 3.2), tCur, tLim));
        for (int k = 0; k < 4; k++){
          float sx = (k < 2 ? -1.0 : 1.0) * (CELL*0.5 - 0.9), sz = ((k & 1) == 0 ? -1.0 : 1.0) * 2.9;
          best = min(best, hitBox(ro, rd, vec3(cxs + sx - 0.14, 7.55, zcs + sz - 0.14), vec3(cxs + sx + 0.14, 9.45, zcs + sz + 0.14), tCur, tLim));
        }
        for (int k = 0; k < 2; k++){
          float pz = zcs + (k == 0 ? -2.35 : 2.35);
          best = min(best, hitBox(ro, rd, vec3(cxs - CELL*0.5, 7.52, pz - 0.80), vec3(cxs + CELL*0.5, 7.72, pz + 0.80), tCur, tLim));
        }
      }
      if (plazaAt(cell) && yLo < 3.4){                            // kiosk on the square
        float kx = (cell.x + 0.5)*CELL + 2.1, kz = (cell.y + 0.5)*CELL - 1.8;
        best = min(best, hitBox(ro, rd, vec3(kx - 0.95, 0.0, kz - 0.85), vec3(kx + 0.95, 2.5, kz + 0.85), tCur, tLim));
      }
      if (viaductRow(cell.y) && yHi > 0.0){                       // elevated railway: deck and pier
        float zcv = (cell.y + 0.5)*CELL, cxm = (cell.x + 0.5)*CELL, pxv = cell.x*CELL;
        best = min(best, hitBox(ro, rd, vec3(cxm - CELL*0.5, VIA_Y - VIA_HT, zcv - VIA_HZ), vec3(cxm + CELL*0.5, VIA_Y + VIA_HT, zcv + VIA_HZ), tCur, tLim));
        best = min(best, hitBox(ro, rd, vec3(pxv - 0.55, 0.0, zcv - 0.55), vec3(pxv + 0.55, VIA_Y - VIA_HT, zcv + 0.55), tCur, tLim));
      }
      }
      if (yLo < 2.7){                                              // street furniture and traffic, all inside the kerb band
        for (int k = 0; k < 2; k++){ vec3 c, e;
          if (vendOf(cell, k, c, e)) best = min(best, hitBox(ro, rd, c - e, c + e, tCur, tLim)); }
        for (int k = 0; k < 2; k++){ vec3 b0; float bob, sc;
          if (pedOf(cell, k, b0, bob, sc)){
            best = min(best, hitCylY(ro, rd, b0.xz, 0.115*sc, b0.y + 0.05, b0.y + (0.78 + bob)*sc, tCur, tLim));
            best = min(best, hitCylY(ro, rd, b0.xz, 0.185*sc, b0.y + (0.70 + bob)*sc, b0.y + (1.32 + bob)*sc, tCur, tLim));
            best = min(best, hitSphere(ro, rd, b0 + vec3(0.0, (1.44 + bob)*sc, 0.0), 0.125*sc, tCur, tLim));
          } }
        for (int k = 0; k < 2; k++){ vec3 c, e; float dr;
          if (carOf(cell, k, c, e, dr)){
            best = min(best, hitBox(ro, rd, c - e, c + e, max(tCur - 4.0, 0.0), tLim + 4.0));
            vec3 cc = c + vec3(0.0, e.y*0.85, -0.15*dr), ce = vec3(e.x*0.78, e.y*0.55, e.z*0.48);
            best = min(best, hitBox(ro, rd, cc - ce, cc + ce, max(tCur - 4.0, 0.0), tLim + 4.0));
          } }
      }
      if (yLo < 3.3){                                              // the two street lamps of this cell (post as a thin box, head box)
        for (int k = 0; k < 2; k++){
          float px = k == 0 ? cell.x*CELL + streetHalf(cell.x) - 0.3 : (cell.x + 1.0)*CELL - streetHalf(cell.x + 1.0) + 0.3;
          best = min(best, hitBox(ro, rd, vec3(px - 0.06, 0.0, c.y - 0.06), vec3(px + 0.06, 3.2, c.y + 0.06), tCur, tLim));
          best = min(best, hitBox(ro, rd, vec3(px - 0.13, 3.18, c.y - 0.13), vec3(px + 0.13, 3.26, c.y + 0.13), tCur, tLim));
        }
      }
    }
    if (tExit >= best) break;
    if (rd.y > 0.0 && ro.y + rd.y*tExit > 40.0) break;                                          // above every rooftop (tower already done)
    if (tMax.x < tMax.y){ cell.x += stp.x; tCur = tMax.x; tMax.x += tDelta.x; } else { cell.y += stp.y; tCur = tMax.y; tMax.y += tDelta.y; }
  }
  return best < tmax ? best : -1.0;
}

vec2 raymarch(vec3 ro, vec3 rd){
  if (uPath > 0.5){ float t = traceDDA(ro, rd, MAXD); if (t > 0.0) map(ro + rd*t); return vec2(t, 1.0); }
  float t = 0.0;
  for (int i = 0; i < 72; i++){
    vec3 p = ro + rd*t;
    float d = map(p);
    float eps = 0.002*t + 0.0005;
    if (d < eps) return vec2(t, float(i));
    t += d;
    if (t > MAXD) return vec2(-1.0, float(i));
  }
  return vec2(-1.0, 72.0);
}

vec3 calcNormal(vec3 p){
  const float e = 0.0015; const vec2 k = vec2(1.0, -1.0);
  vec3 n = k.xyy*map(p + k.xyy*e) + k.yyx*map(p + k.yyx*e) + k.yxy*map(p + k.yxy*e) + k.xxx*map(p + k.xxx*e);
  float l = length(n);
  return l > 1e-6 ? n / l : vec3(0.0, 1.0, 0.0);
}

float calcAO(vec3 p, vec3 n){
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 3; i++){
    float h = 0.06 + 0.5*float(i)/2.0;
    float d = mapCoarse(p + n*h);
    occ += (h - d)*sca; sca *= 0.65;
  }
  return clamp(1.0 - 1.2*occ, 0.0, 1.0);
}

// The moon's direction. It is also the key light, so what the sky shows and what lights the city are
// the same thing. 19 deg up, 36 deg to the left of travel: measured, not guessed — on a 2.39:1 frame
// an off-axis direction is foreshortened upward, and at 35 deg the moon sat above the top edge of
// every rig while its own light was still falling on the city.
#define MOON_DIR normalize(vec3(0.556, 0.326, 0.765))
#define MOON_R   0.018                                   // angular radius: about three times life size, which is what a
                                                       // long lens does to it and what every night sky in a film looks like
vec3 skyBase(vec3 rd){
  float y = clamp(rd.y, 0.0, 1.0);
  vec3 top = vec3(0.0006, 0.0012, 0.0035);
  vec3 hor = vec3(0.014, 0.032, 0.064);
  return mix(hor, top, pow(y, 0.5));
}

// Searchlight on the landmark tower: slow sweep, tilted down so the beam falls between the buildings.
// Mounted on the roof beside the mast, not on it: sitting inside the spire made the occlusion test
// treat the lamp itself as blocked, so the one direction the lamp is in had no haze at all.
vec3 searchOrigin(){ return towerPos() + vec3(1.45, TOWER_H + 1.2, 1.45); }
vec3 searchDir(){ float a = uSearch; float ct = cos(0.44), st = sin(0.44); return normalize(vec3(cos(a)*ct, -st, sin(a)*ct)); }   // 25 deg down: lands near the camera
// beam intensity at a point (cone, soft edge, distance falloff)
float beamAt(vec3 p){
  vec3 S = searchOrigin(), D = searchDir();
  vec3 v = p - S; float s = dot(v, D);
  if (s < 0.0) return 0.0;
  float dist = length(v - D*s);
  float rad = 1.2 + 0.035*s;
  return smoothstep(rad, rad*0.35, dist) / (1.0 + 0.00012*s*s);
}
// Street lamps: one per block on each side of every N-S street, 3.2 high, tungsten. Nearest four light the scene.
vec3 lampLight(vec3 p, vec3 n){
  vec2 idc = floor(p.xz / CELL);
  float rm = mod(idc.y, 7.0);
  if (rm == 3.0 || rm == 4.0) return vec3(0.0);
  float kx = floor(p.x / CELL + 0.5) * CELL;
  float zc = (idc.y + 0.5) * CELL;
  float zn = p.z > zc ? zc + CELL : zc - CELL;
  vec3 acc = vec3(0.0);
  for (int i = 0; i < 4; i++){
    float lh = streetHalf(kx / CELL) - 0.3;
    vec3 lp = vec3(kx + ((i & 1) == 0 ? -lh : lh), 3.1, (i < 2) ? zc : zn);
    vec3 v = lp - p; float d2 = dot(v, v); vec3 l = v * inversesqrt(d2 + 1e-4);
    float spot = smoothstep(0.10, 0.55, l.y);                      // shines downward
    float nl = n.y > 1.5 ? 1.0 : max(dot(n, l), 0.0);
    acc += spot * nl / (1.0 + 0.6*d2);
  }
  return vec3(1.0, 0.72, 0.45) * 0.7 * acc;
}
// analytic in-scatter from the lamps along the camera's own street (no map calls)
vec3 lampGlow(vec3 ro, vec3 rd, float tmax){
  vec3 acc = vec3(0.0);
  float z0 = (floor(ro.z / CELL) - 1.0 + 0.5) * CELL;
  for (int i = 0; i < 12; i++){
    float z = z0 + float(i >> 1) * CELL;
    float rmz = mod(floor(z / CELL), 7.0);
    if (rmz == 3.0 || rmz == 4.0) continue;
    float lh0 = streetHalf(0.0) - 0.3;
    vec3 lp = vec3(((i & 1) == 0 ? -lh0 : lh0), 3.1, z);
    vec3 a = ro - lp; float b = dot(rd, a); float c = dot(a, a);
    float h = sqrt(max(c - b*b, 0.04));
    acc += vec3(1.0, 0.72, 0.45) * (atan((tmax + b) / h) - atan(b / h)) / h;
  }
  return acc * 0.0008;
}

// Low cloud deck at y = 60, lit from below by the city; the searchlight paints it when it sweeps up.
// One layer of cloud, projected onto a plane at height h. Two of these at different heights and
// drift speeds give the sky parallax, which is what stops it reading as a flat backdrop.
float cloudLayer(vec3 rd, float h, vec2 drift, float sc, float lo, float hi, out vec3 cpos, out float dist){
  dist = (h - gRo.y) / max(rd.y, 1e-4);
  vec2 cp = gRo.xz + rd.xz * dist;
  cpos = vec3(cp.x, h, cp.y);
  if (dist <= 0.0) return 0.0;                  // camera already above this deck: looking up, it is not there
  cp += drift * iTime;
  float nz = 0.5*vnoise(cp*sc) + 0.28*vnoise(cp*sc*2.3 + 7.3) + 0.14*vnoise(cp*sc*5.3 + 3.1);
  return smoothstep(lo, hi, nz);
}
// The moon sits exactly where the key light comes from, so the sky and the lighting agree with each
// other. Drawn near life size: the first version was two degrees across and clipped to white, which
// reads as a lamp, not a moon. Limb darkening, a gibbous terminator and a little maria keep the disc
// from being a flat hole, and they only survive because the disc no longer saturates.
vec3 moonDisc(vec3 rd){
  if (dot(rd, MOON_DIR) < 0.9997) return vec3(0.0);          // outside 1.4 deg there is only halo
  vec3 mx = normalize(cross(vec3(0.0, 1.0, 0.0), MOON_DIR));
  vec3 my = cross(MOON_DIR, mx);
  vec2 p = vec2(dot(rd, mx), dot(rd, my)) / MOON_R;          // disc coordinates, 1.0 at the limb
  float r2 = dot(p, p);
  if (r2 > 1.0) return vec3(0.0);
  float z = sqrt(1.0 - r2);                                  // the sphere, seen flat
  float limb  = 0.40 + 0.60*pow(z, 0.50);
  float phase = smoothstep(-0.10, 0.30, p.x*0.62 + z*0.78);  // gibbous, lit from the right
  float maria = mix(0.62, 1.0, smoothstep(0.36, 0.66, vnoise(p*2.3 + 40.0))) * mix(0.86, 1.0, vnoise(p*6.1 + 12.0));
  float edge  = 1.0 - smoothstep(0.965, 1.0, sqrt(r2));      // a soft pixel at the limb, so it never aliases
  // Peak sits just over the bloom threshold on purpose. At 1.55 the whole disc clipped to flat white
  // and every bit of the surface above was thrown away; the moon has to stay under the clip to be a moon.
  return vec3(0.96, 0.96, 0.98) * (0.92 * limb * maria * max(phase, 0.05) * edge);
}
// The aureole humid air puts around it: tight, then wide, then a general lift of that quarter of sky.
vec3 moonHalo(vec3 rd){
  float c = max(dot(rd, MOON_DIR), 0.0);
  float g = pow(c, 1500.0)*0.055 + pow(c, 120.0)*0.020 + pow(c, 18.0)*0.0035;
  return vec3(0.80, 0.87, 1.0) * g;
}
// Stars, thinned by the city's own light. A grid on the cube face holds at most one star per cell,
// placed inside the middle half of it so one cell lookup covers the whole star; the magnitudes are
// skewed hard, so a handful read as stars and the rest as dust.
vec3 starsAt(vec3 rd){
  vec3 a = abs(rd);
  vec2 uv; float face;
  if (a.y >= a.x && a.y >= a.z)  { uv = rd.xz / a.y; face =  0.0; }
  else if (a.x >= a.z)           { uv = rd.zy / a.x; face =  7.0; }
  else                           { uv = rd.xy / a.z; face = 19.0; }
  vec2 g = uv * 64.0 + face;
  vec2 id = floor(g), f = g - id;
  if (hash21(id + 13.3) > 0.13) return vec3(0.0);            // most cells are empty sky
  float h1 = hash21(id + 0.5), h2 = hash21(id + 91.7);
  float d2 = dot(f - vec2(0.25 + 0.5*h1, 0.25 + 0.5*h2), f - vec2(0.25 + 0.5*h1, 0.25 + 0.5*h2));
  float mag = pow(hash21(id + 45.1), 5.0);                   // a few bright, many faint
  float tw  = 0.82 + 0.18*sin(iTime*2.3 + h1*31.0);          // scintillation
  return mix(vec3(1.0, 0.88, 0.76), vec3(0.78, 0.86, 1.0), h2) * (exp(-d2*600.0) * mag * tw * 1.25);
}
float flash(){ float a = uFlashAge; return a > 0.30 ? 0.0 : exp(-a*10.0) * (0.7 + 0.3*cos(a*70.0)); }   // a strike flickers and dies
vec3 skyColor(vec3 rd){
  // The far city burning into the haze. It belongs to the sky and not to skyBase, because skyBase is
  // also the fog colour: put it there and every distant surface in the city gets a warm lift with it.
  vec3 base = skyBase(rd) + vec3(0.020, 0.013, 0.008) * exp(-max(rd.y, 0.0) * 26.0);
  if (rd.y < 0.004) return base;
  vec3 cposHi; float distHi;
  float densHi = cloudLayer(rd, 150.0, vec2(0.35, 0.15), 0.0062, 0.47, 0.74, cposHi, distHi);   // thin high cirrus
  vec3 cposLo; float distLo;
  float densLo = cloudLayer(rd, 60.0, vec2(1.2, 0.5), 0.018, 0.44, 0.70, cposLo, distLo);        // the low deck, with real breaks
  float fadeHi = smoothstep(0.004, 0.16, rd.y) * exp(-distHi*0.0011);
  float fadeLo = smoothstep(0.010, 0.20, rd.y) * exp(-distLo*0.0026);
  float aHi = densHi * fadeHi * 0.55, aLo = densLo * fadeLo * 0.92;

  // What the underside of a cloud shows is the district beneath it, so the glow varies across the sky.
  int dz = districtOf(floor(cposLo.xz / CELL));
  float amt = dz == 1 ? 1.9 : (dz == 0 ? 1.35 : (dz == 4 ? 0.45 : 0.85));
  vec3 tint = dz == 1 ? vec3(1.0, 0.80, 0.86) : (dz == 4 ? vec3(0.85, 0.92, 1.0) : vec3(1.0, 0.94, 0.88));
  float md = max(dot(rd, MOON_DIR), 0.0);
  vec3 cloudLo = vec3(0.022, 0.019, 0.017) * amt * tint * (1.0 + 1.2*(1.0 - rd.y));
  cloudLo += vec3(0.55, 0.72, 1.0) * 0.5 * beamAt(cposLo);
  cloudLo += vec3(0.62, 0.68, 0.80) * pow(md, 40.0) * 0.22 * (1.0 - smoothstep(0.15, 0.85, densLo));  // silver lining
  vec3 cloudHi = vec3(0.016, 0.017, 0.021) * (0.8 + 0.9*(1.0 - rd.y));
  cloudHi += vec3(0.55, 0.60, 0.72) * pow(md, 40.0) * 0.09;
  float fl = flash();                                   // the lightning already lit the fog; it has to come from somewhere
  cloudLo += vec3(0.78, 0.85, 1.0) * fl * (0.03 + 0.18*densLo);
  cloudHi += vec3(0.78, 0.85, 1.0) * fl * (0.02 + 0.13*densHi);

  // Cloud first, both decks, in the order they sit. The moon and the stars are behind them, so they
  // are attenuated by what is in front rather than punched out of it: mixing cloud over a saturated
  // moon cut it into crescents that looked like a second object in the sky.
  vec3 c = mix(base, cloudHi, aHi);
  c = mix(c, cloudLo, aLo);
  float veil = clamp(aLo*0.96 + aHi*0.40, 0.0, 1.0);
  c += starsAt(rd) * smoothstep(0.05, 0.40, rd.y) * (1.0 - veil);
  c += moonDisc(rd) * (1.0 - veil);
  c += moonHalo(rd) * (1.0 - 0.6*veil);                 // the aureole is in the air in front, so some survives
  return c;
}

// Distant traffic: headlight pools moving along the lanes of every street except the camera's own (warm only, no tail lights)
vec3 carLights(vec3 p){
  vec3 acc = vec3(0.0);
  for (int axis = 0; axis < 2; axis++){
    float along = axis == 0 ? p.z : p.x;                       // N-S streets run along z, E-W along x
    float across = axis == 0 ? p.x : p.z;
    float k = floor(across / CELL + 0.5);
    if (axis == 0 && k == 0.0) continue;                       // never on the camera's street
    float rowOf = axis == 0 ? floor(p.z / CELL) : k;           // no traffic on the river rows
    float rmr = mod(rowOf, 7.0);
    if (rmr == 3.0 || rmr == 4.0 || (axis == 1 && mod(k - 1.0, 7.0) == 4.0)) continue;
    float s = across - k*CELL;
    if (abs(s) > 2.0) continue;
    for (int lane = 0; lane < 2; lane++){
      float dir = lane == 0 ? 1.0 : -1.0;
      vec2 seed = vec2(k*1.7 + float(axis)*31.0, float(lane));
      float P  = 11.0 + 9.0*hash21(seed);
      float sp = 8.0 + 6.0*hash21(seed + 4.0);
      float c0 = dir*iTime*sp + 100.0*hash21(seed + 8.0);
      float n  = floor((along - c0) / P + 0.5);
      if (hash21(seed + n*0.31 + 12.0) > 0.72) continue;          // empty slot
      float cpos = c0 + n*P;
      float lw = axis == 0 ? streetHalf(k)*0.45 : 0.9;
      vec2 hl2 = axis == 0 ? vec2(k*CELL + dir*lw, cpos) : vec2(cpos, k*CELL + dir*lw);
      vec3 v = p - vec3(hl2.x, 0.45, hl2.y);
      float d2 = dot(v, v);
      float ahead = axis == 0 ? v.z : v.x;
      float fwd = smoothstep(-0.3, 0.8, dir * ahead * inversesqrt(d2 + 1e-3));
      acc += vec3(1.0, 0.82, 0.60) * fwd / (1.0 + 1.5*d2);
    }
  }
  return acc;
}

bool neonDistrict(vec2 id){ return districtOf(id) == 1; }                              // the entertainment quarter
vec3 neonPalette(vec2 id){
  float c = hash21(id + 71.0);
  return c < 0.35 ? vec3(1.0, 0.15, 0.55) : (c < 0.65 ? vec3(0.15, 0.85, 1.0) : (c < 0.85 ? vec3(1.0, 0.58, 0.12) : vec3(0.55, 0.25, 1.0)));   // magenta / cyan / amber / violet
}
// holographic billboard: a big panel of scrolling procedural glyphs on tall buildings in neon districts; hi-hat shimmer, beat glitch
vec3 holoBoard(vec2 id, float u, float y, float hw, float ht, out float mask){
  mask = 0.0;
  if (!neonDistrict(id) || hash21(id + 91.0) > 0.3 || ht < 9.0) return vec3(0.0);
  float bw = min(hw * 0.8, 3.0), bh = min(ht * 0.28, 4.0);
  float y0 = ht * (0.35 + 0.3*hash21(id + 92.0));
  vec2 q = vec2(u, y - y0);
  if (abs(q.x) > bw || abs(q.y) > bh) return vec3(0.0);
  float glitch = step(0.7, uBeat) * step(0.5, hash21(vec2(floor(y*4.0), floor(iTime*20.0))));
  q.x += glitch * 0.6 * (hash21(vec2(floor(y*4.0) + 3.0, floor(iTime*20.0))) - 0.5);
  vec2 g = vec2(q.x, q.y + iTime*0.6*(hash21(id + 93.0) > 0.5 ? 1.0 : -1.0)) / 0.32;   // glyph grid scrolls
  vec2 gc = floor(g), gf = fract(g);
  float h1 = hash21(gc + id*2.3), h2 = hash21(gc + id*2.3 + 7.0), h3 = hash21(gc + id*2.3 + 13.0);
  float stroke = step(abs(gf.x - 0.5), 0.08 + 0.3*h1) * step(abs(gf.y - 0.5), 0.35) * step(0.25, h2)    // vertical bars
               + step(abs(gf.y - (0.3 + 0.4*h3)), 0.07) * step(abs(gf.x - 0.5), 0.38) * step(0.5, h1);    // horizontal bars
  stroke = clamp(stroke, 0.0, 1.0);
  float edge = smoothstep(0.0, 0.15, bw - abs(q.x)) * smoothstep(0.0, 0.15, bh - abs(q.y));
  mask = edge;
  vec3 col = mix(neonPalette(id), vec3(1.0), 0.25);
  float shimmer = 0.8 + 0.2*sin(y*40.0 + iTime*30.0) * uAudio.z;
  return col * (0.12 + 1.6*stroke) * edge * shimmer;
}
// neon as a light source: for the 3x3 cells around p, if a building has a strip, treat it as a coloured point light
// Irradiance from a uniform emissive segment, three-point Gauss-Legendre. A neon tube is metres long
// and the wall it lights is metres away, so a point light gets both the shape wrong (a round spot
// instead of a stripe running down the wall) and the falloff wrong (1/d^2 instead of nearer 1/d).
// n.y > 1.5 is the caller's sentinel for "no surface, take it from every direction".
float segIrr(vec3 p, vec3 n, vec3 A, vec3 B, vec3 en){
  vec3 m = 0.5*(A + B), h = 0.5*(B - A);
  bool omni = n.y > 1.5;
  float s = 0.0;
  for (int k = 0; k < 3; k++){
    float x = k == 0 ? -0.774597 : (k == 1 ? 0.0 : 0.774597);
    float w = k == 1 ? 0.444444 : 0.277778;
    vec3 v = m + h*x - p; float d2 = dot(v, v);
    vec3 l = v * inversesqrt(d2 + 1e-4);
    float nl = omni ? 1.0 : max(dot(n, l), 0.0);
    // The emitter has a facing too. A tube lies flat on its facade and throws light out into the
    // street, not sideways along the wall it is bolted to — without this term one tube washes the
    // whole block it is on, which is a filter over the picture rather than a light in it.
    // A tube stands proud of its wall, so it is not a flat panel: straight down onto the pavement it
    // still throws light, it only stops behind the wall it is bolted to. A wrap of a quarter.
    float el = clamp((dot(-l, en) + 0.25) / 1.25, 0.0, 1.0);
    s += w * nl * el / (1.0 + 0.80*d2);
  }
  return s;
}
// What the signs on the surrounding blocks actually put on this surface. Each tube is the segment it
// really is — vertical ones hang down the facade, horizontal ones run across it — placed on whichever
// face of its block looks at the shaded point, and tested for something in the way: without that, a
// magenta tube lights the far side of its own building and the street behind it.
vec3 neonLight(vec3 p, vec3 n, float shadow){
  vec3 acc = vec3(0.0);
  vec2 idc = floor(p.xz / CELL);
  bool omni = n.y > 1.5;
  vec3 pOff = omni ? p : p + n * 0.06;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec2 id = idc + vec2(float(i), float(j));
    if (riverRow(id.y)) continue;
    float dens = neonDistrict(id) ? 0.45 : 0.03;
    for (int f = 0; f < 2; f++){                               // the two face families (x-facing / z-facing)
      float face = f == 0 ? 0.37 : 0.0;
      if (hash21(id + face + 21.0) >= dens) continue;
      vec2 hs; float ht; cellParams(id, hs, ht);
      vec2 ctr = (id + 0.5)*CELL + lotOffset(id, hs);
      float hw3 = f == 0 ? hs.y : hs.x;
      bool vert = hash21(id + 31.0) < 0.6;
      float u0 = (hash21(id + face + 41.0) - 0.5) * hw3 * 1.2;
      float y0 = 1.8 + 4.0*hash21(id + face + 51.0), len = 2.5 + 4.0*hash21(id + 61.0);
      float sg = f == 0 ? (p.x > ctr.x ? 1.0 : -1.0) : (p.z > ctr.y ? 1.0 : -1.0);
      // A tube hangs off brackets, a good 20 cm clear of the wall, which is why there is always a glow
      // on the wall behind a neon sign. At 5 cm it was effectively coplanar and lit nothing of its own.
      vec3 base = f == 0 ? vec3(ctr.x + sg*(hs.x + 0.20), 0.0, ctr.y)
                         : vec3(ctr.x, 0.0, ctr.y + sg*(hs.y + 0.20));
      vec3 tang = f == 0 ? vec3(0.0, 0.0, 1.0) : vec3(1.0, 0.0, 0.0);
      vec3 A, B;
      if (vert){ vec3 c0 = base + tang*u0; A = c0 + vec3(0.0, y0, 0.0); B = c0 + vec3(0.0, y0 + len, 0.0); }
      else { float hl = min(hw3*0.8, len); vec3 c0 = base + vec3(0.0, y0 + 0.16, 0.0); A = c0 - tang*hl; B = c0 + tang*hl; }
      vec3 en = f == 0 ? vec3(sg, 0.0, 0.0) : vec3(0.0, 0.0, sg);       // the face the tube is bolted to
      float g = segIrr(pOff, n, A, B, en);
      if (g <= 0.0) continue;
      float vis = 1.0;
      if (shadow > 0.0){
        // Two samples along the way, not one. A single midpoint probe walks straight through a thin
        // wall, and a thin wall between a tube and a facade is the normal case in a street grid.
        vec3 m = 0.5*(A + B);
        float o1 = mapCoarse(mix(pOff, m, 0.34)), o2 = mapCoarse(mix(pOff, m, 0.68));
        vis = mix(1.0, clamp(min(o1, o2) / 0.55, 0.0, 1.0), shadow);
      }
      acc += neonPalette(id) * g * 1.2 * vis;
    }
  }
  return acc;
}

// neon haze: the strips around the camera scatter in the rain (analytic point-glow, no map calls)
vec3 neonGlow(vec3 ro, vec3 rd, float tmax){
  vec3 acc = vec3(0.0);
  vec2 idc = floor(ro.xz / CELL);
  for (int j = -1; j <= 2; j++) for (int i = -1; i <= 1; i++){
    vec2 id = idc + vec2(float(i), float(j));
    if (riverRow(id.y)) continue;
    float dens = neonDistrict(id) ? 0.45 : 0.03;
    for (int f = 0; f < 2; f++){
      float face = f == 0 ? 0.37 : 0.0;
      if (hash21(id + face + 21.0) >= dens) continue;
      vec2 hs; float ht; cellParams(id, hs, ht);
      vec2 ctr = (id + 0.5)*CELL + lotOffset(id, hs);
      float y0 = 1.8 + 4.0*hash21(id + face + 51.0), len = 2.5 + 4.0*hash21(id + 61.0);
      float u0 = (hash21(id + face + 41.0) - 0.5) * (f == 0 ? hs.y : hs.x) * 1.2;
      vec3 lp = f == 0 ? vec3(ctr.x + (ro.x > ctr.x ? hs.x : -hs.x), y0 + len*0.5, ctr.y + u0) : vec3(ctr.x + u0, y0 + len*0.5, ctr.y + (ro.z > ctr.y ? hs.y : -hs.y));
      vec3 a = ro - lp; float b = dot(rd, a); float c = dot(a, a);
      float hh = sqrt(max(c - b*b, 0.09));
      vec3 neonCol = neonPalette(id);
      acc += neonCol * (atan((tmax + b) / hh) - atan(b / hh)) / hh;
    }
  }
  return acc * 0.0025 * (0.5 + uMood.x);                    // more rain, more haze
}

// light arriving at a point in the air (for rain drops): city glow + lamps + neon + searchlight
vec3 lightAtPoint(vec3 P){
  vec3 L = vec3(0.9, 0.72, 0.52) * 0.012;
  L += vec3(1.0, 0.72, 0.45) * lampLight(P, vec3(0.0, 2.0, 0.0)) / vec3(1.0, 0.72, 0.45) * 1.0;
  L += neonLight(P, vec3(0.0, 2.0, 0.0), 0.0) * 0.8;
  L += beamAt(P) * vec3(0.55, 0.72, 1.0) * 5.0;
  return L;
}
// world-space rain: three sheets at fixed distances from the camera, each a 3D field of falling streaks lit by the lights around them.
// Rain against the dark sky stays dark; rain in a lamp cone or next to neon lights up.
vec3 rainLayers(vec3 ro, vec3 rd, float tmax, vec3 col, vec2 frag){
  float wind = 0.06 + 0.10*sin(iTime / 9.0);
  float dens = uMood.x;
  float rigK = length(ro.xz - vec2(-0.9, uCamZ)) > 8.0 ? 0.3 : 1.0;      // aerial / river rigs: rain is far below the lens
  for (int k = 0; k < 3; k++){
    float d = k == 0 ? 2.4 : (k == 1 ? 5.5 : 12.0);
    if (d > tmax) break;
    vec3 P = ro + rd*d;
    float sc = 1.0 + 0.7*float(k);
    vec2 cs = vec2(0.17, 0.22) * sc;                              // column spacing
    float len = 0.22 * sc;                                        // streak length (fall + motion blur)
    vec3 Q = P; Q.x += P.y * wind * 0.8;
    vec2 cid = floor(Q.xz / cs), cf = fract(Q.xz / cs);
    float ph = hash21(cid + float(k)*17.0);
    float yy = fract((Q.y + iTime * (8.0 + 4.0*ph)) / (len*5.0) + ph);
    float streak = smoothstep(0.0, 0.04, yy) * (1.0 - smoothstep(0.10, 0.16, yy));
    float xw = smoothstep(0.06, 0.0, abs(cf.x - 0.5) - 0.01) * smoothstep(0.5, 0.25, abs(cf.y - 0.5));
    float on = step(hash21(cid + 3.0 + float(k)*5.0), dens * 0.85);
    float r = streak * xw * on;
    if (r > 0.002){
      vec3 L = min(lightAtPoint(P), vec3(1.2));
      col += r * L * (k == 0 ? 0.45 : (k == 1 ? 0.35 : 0.3)) * exp(-0.03*d) * rigK;
    }
  }
  return col;
}

// heterogeneous fog + steam, marched: fog banks drift between the blocks; the open air of a street scatters the city glow while
// walls block it (god rays through the gaps); steam rises from manholes at the block centres and is lit by the lamps.
vec3 fogScatter(vec3 ro, vec3 rd, float tmax, vec2 frag){
  float tEnd = min(tmax, 70.0);
  if (tEnd < 1.0) return vec3(0.0);
  float dt = tEnd / 16.0;
  float t = dt * ign(frag + 23.7);
  vec3 acc = vec3(0.0);
  float open = 1.0;
  for (int i = 0; i < 16; i++){
    vec3 P = ro + rd*t;
    float bank = 0.55 + 0.9*vnoise((P.xz + vec2(iTime*0.6, iTime*0.25)) * 0.025);
    float dens = 0.010 * bank * exp(-0.06*max(P.y, 0.0)) * uParams.y;
    // mapCoarse is the expensive part of this loop and `open` is a smooth field, so it is sampled on
    // every other step and held. A half-step lag in a quantity that varies over metres is invisible.
    if ((i & 1) == 0) open = clamp(mapCoarse(P) / 2.5, 0.0, 1.0);
    vec3 L = vec3(0.75, 0.72, 0.62) * 0.02 * open;
    vec2 idf = floor(P.xz / CELL);
    if (neonDistrict(idf)) L += neonPalette(floor(idf / 3.0)) * 0.04 * open;
    // steam: one manhole per block on the camera's street side, puffs rising and dissolving
    {
      float kx = floor(P.x / CELL + 0.5) * CELL;
      float zc = (floor(P.z / CELL) + 0.5) * CELL + 2.0;
      float ph = fract(iTime * 0.12 + hash21(vec2(kx, zc)));
      vec3 c = vec3(kx + 0.6, 0.3 + 2.2*ph, zc);
      float rr = 0.6 + 1.6*ph;
      float dd = length((P - c) * vec3(1.0, 0.7, 1.0)) / rr;
      float puff = smoothstep(1.0, 0.2, dd) * (1.0 - ph) * (0.6 + 0.6*vnoise(P.xz*3.0 + P.y*2.0 + iTime));
      if (puff > 0.001 && !riverRow(floor(P.z / CELL))){
        dens += 0.25 * puff;
        L += (vec3(1.0, 0.72, 0.45) * lampLight(P, vec3(0.0, 2.0, 0.0)) * 0.8 + vec3(0.9, 0.72, 0.52) * 0.04) * puff * 2.0;
      }
    }
    acc += L * dens * dt;
    t += dt;
  }
  return acc * 1.2;
}

// Signature move: on every beat a ring expands from the camera at 40 u/s; windows it passes flare x2.5 for 0.4 s, then fade.
float ringBoost(vec3 p, float j){                                   // j: per-window jitter 0..1 (delay + decay rate)
  float dist = length(p.xz - uCamRo.xz);
  float best = 0.0;
  for (int k = 0; k < 2; k++){
    float f = (k == 0 ? uBeatAge.x : uBeatAge.y) - dist / 40.0 - 0.15*j;   // time since the ring passed this window
    // The ring passes; it does not stay. The first version held full strength for 0.4 s and decayed
    // slowly after that, so with beats half a second apart the city never came back down — a third of
    // the street footage was clipped white, and no still frame in the suite could see it.
    float b = f < 0.0 ? 0.0 : exp(-f * (7.0 + 6.0*j));
    b *= smoothstep(-0.05, 0.03, f);                                  // soft leading edge
    best = max(best, b);
  }
  return best * uParams.x;
}

// Windows: per-building type, clustered 4-class brightness, mid floors densest, warm leak onto the wall.
// Returns emission; `leak` receives warm light spilling onto the surrounding wall (0..1).
vec3 windowLight(vec3 p, vec3 n, vec3 rd, float t, out float leak, out float facade, out vec3 neonSpill, out vec3 nrel){
  leak = 0.0; facade = 1.0; neonSpill = vec3(0.0); nrel = n;
  if (n.y > 0.5) return vec3(0.0);
  vec2 id = floor(p.xz / CELL);
  vec2 hs; float ht; cellParams(id, hs, ht);
  vec3 tp = p - towerPos();
  if (max(abs(tp.x), abs(tp.z)) < 4.5){ id = vec2(777.0, 313.0); ht = TOWER_H; }   // landmark uses its own id/height
  int cls = matClassOf(id);
  float type = hash21(id + 41.3);
  // A curtain wall reads as continuous horizontal ribbons with whole floors lit at once; masonry reads as
  // individual punched openings. That contrast is what makes the cladding legible at a glance.
  vec2 ws = cls == 1 ? vec2(1.15, 0.40)
          : (type < 0.33 ? vec2(0.34, 0.74) : (type < 0.66 ? vec2(0.78, 0.44) : vec2(0.50, 0.50)));
  float face = abs(n.x) > 0.5 ? 0.37 : 0.0;
  float u = abs(n.x) > 0.5 ? p.z : p.x;
  vec2 g = vec2(u, p.y) / ws;
  vec2 c = floor(g), f = fract(g);
  float fy = clamp(p.y / max(ht, 1.0), 0.0, 1.0);
  float prof = smoothstep(0.0, 0.22, fy) * (1.0 - smoothstep(0.72, 1.0, fy));   // ground + top floors mostly dark
  float gRing = ringBoost(p, 0.0);
  float occ = (0.25 + 0.25*hash21(id + 77.7)) * (0.6 + 0.4*uMood.y);   // quiet music: the city dims
  if (stationAt(id) && cls != 1) occ = 0.88;                                      // a concourse is lit all the way across                                       // per-building occupancy
  // fade the window grid out by its projected size, not by raw distance: once a window is around a pixel
  // wide it can only alias, and a fixed distance threshold gets this wrong at other resolutions
  float px = t * 2.0 / max(iResolution.y * uFocal, 1.0);              // world units per pixel here
  float lod = 1.0 - smoothstep(1.4, 4.0, min(ws.x, ws.y) / max(px, 1e-5));
  vec3 emit = vec3(0.0);
  for (int k = 0; k < 5; k++){                                          // centre + 4 neighbours (cross)
    int i = (k == 1) ? -1 : (k == 2 ? 1 : 0), j = (k == 3) ? -1 : (k == 4 ? 1 : 0);
    vec2 cc = c + vec2(float(i), float(j));
    float cl = hash21(floor(cc / 3.0) + id*7.7 + face);          // 3x3 cluster value
    float hw = hash21(cc + id*13.17 + face);
    float floorV = hash21(vec2(cc.y, 0.0) + id*5.1);                // ribbon glazing: a whole floor tends to be lit together
    float v  = cls == 1 ? mix(hw, floorV, 0.66) : mix(hw, cl, 0.55);   // clustered, not uniform
    float offT = cls == 1 ? 0.58 : 0.30;                            // a ribbon covers far more area than a punched window, so fewer are lit
    float b  = v < offT ? 0.0 : (v < 0.70 ? 0.10 : (v < 0.86 ? 1.6 : 6.0));   // off / dim / bright / near-white
    if (cls == 1) b = min(b, 2.4) * 0.38;                           // a ribbon spans a whole floor: it needs far less intensity than a punched window to read
    float elig = step(hash21(cc*2.3 + id + 9.0), prof * occ);
    b *= elig;
    float rw = ringBoost(p, hash21(cc*0.71 + id + 1.7));                  // per-window timing: the wave front gets texture
    b = max(b, 1.2 * rw * step(hash21(cc*1.3 + id + 4.0), prof * 0.22));   // the passing ring lights some dark windows, then they fade
    b *= 1.0 + 1.5*rw;
    vec2 d = f - vec2(float(i), float(j)) - 0.5;                   // pixel -> neighbour window centre, cell units
