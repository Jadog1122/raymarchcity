<style>

<script id="vert" type="x-shader/x-vertex">
precision highp float;
in vec3 position;
void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
out vec4 fragColor;

uniform float iTime;
uniform vec2  iResolution;   // render target size in pixels
uniform vec4  uAudio;        // bass, mid, high, energy  (0..1)
uniform float uBeat;         // 1 on beat, exp decay
uniform float uScale;        // renderScale (for debug)
uniform float uCamZ;         // camera travel along the street (integrated in JS)
uniform vec4  uParams;       // response, fog multiplier, speed multiplier, reserved
uniform float uSearch;       // searchlight azimuth (integrated in JS)
uniform vec2  uBeatAge;      // seconds since the last two beats (99 = none)
uniform float uFlashAge;     // seconds since the last lightning (rare: every 8th beat or an energy peak)
uniform vec4  uMood;         // rain, quiet(0..1 slow energy), beam strength at the camera, fade

// ---------- hashes ----------
// integer hashes: exact and identical across shader compiles (fract(sin) / fract(big product) are not)
uint uhash(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float hash21(vec2 p){ uvec2 q = uvec2(ivec2(floor(p * 64.0))); uint h = uhash(q.x ^ uhash(q.y + 0x9e3779b9u)); return float(h) * (1.0 / 4294967296.0); }
float hash11(float n){ return hash21(vec2(n, 17.0)); }
vec2  hash22(vec2 p){ float h = hash21(p); return vec2(h, hash21(p + h + 7.1)); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);
  return mix(mix(hash21(i), hash21(i + vec2(1, 0)), f.x), mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), f.x), f.y); }

// ---------- scene ----------
#define CELL   8.0     // block pitch (street to street)
#define STREET 2.0     // half street width
#define MAXD   320.0
int gMat = 0;          // 1 building, 2 ground
float gDepth = 0.0;    // hit distance of the primary ray (MAXD if sky)
vec3  gRo = vec3(0.0);  // camera position (for cloud projection)

float sdBox(vec3 p, vec3 b){ vec3 d = abs(p) - b; return length(max(d, 0.0)) + min(max(d.x, max(d.y, d.z)), 0.0); }

// per-block parameters from the integer cell id
void cellParams(vec2 id, out vec2 hs, out float ht){
  vec2 r = hash22(id + 5.3);
  hs = vec2(1.0) + 1.0*r;                       // half size 1.0..2.0  (cell half 4.0 - street 2.0 = 2.0 max)
  float h = hash21(id);
  ht = 2.0 + 28.0*pow(h, 4.0);                  // power law: many low, few tall
  if (hash21(id + 17.3) < 0.10) ht = 0.35;      // a few empty lots
}

#define TOWER_H 90.0
vec3 towerPos(){ return vec3(14.0, 0.0, uCamZ + 200.0); }   // landmark: always 200 ahead, a little to the right
float blink(){ return 1.0 - step(0.5, fract(iTime)); }        // 1 Hz aviation light

float map(vec3 p){
  float ground = p.y;
  vec2 id = floor(p.xz / CELL);
  vec2 q  = p.xz - (id + 0.5)*CELL;
  float d = 1e5;
  int mat = 1;
  float rowm = mod(id.y, 7.0);
  bool river = rowm == 3.0 || rowm == 4.0;                      // two empty rows every 7 blocks: water, only reflections
  if (!river){
    // sidewalk slab (kerb 0.12 high) and street lamps on both sides of every N-S street
    if (p.y < 0.6){ d = sdBox(vec3(q.x, p.y - 0.06, q.y), vec3(CELL*0.5 - 1.55, 0.06, CELL*0.5 - 1.55)); mat = 2; }
    float sx = p.x - (floor(p.x / CELL + 0.5))*CELL;            // street-local x, street centre at 0
    if (abs(sx) < 2.0 && p.y < 3.6 && abs(q.y) < 1.5){
      float lx = abs(sx) - 1.75, lz = q.y;
      float post = max(length(vec2(lx, lz)) - 0.06, abs(p.y - 1.6) - 1.6);
      float head = sdBox(vec3(lx, p.y - 3.22, lz), vec3(0.13, 0.04, 0.13));
      if (post < d){ d = post; mat = 1; }
      if (head < d){ d = head; mat = 6; }
    }
    vec2 hs; float ht; cellParams(id, hs, ht);
    float h = hash21(id);
    q -= (hash22(id + 11.9) - 0.5) * 2.0 * (CELL*0.5 - STREET - hs);   // slide inside the lot, never into the street
    float b;
    if (h > 0.95){                                              // tallest 5 %: three setbacks + antenna + red beacon
      b = sdBox(vec3(q.x, p.y - ht*0.30, q.y), vec3(hs.x, ht*0.30, hs.y));
      if (p.y > ht*0.55){                                       // upper tiers only matter above the first one
        b = min(b, sdBox(vec3(q.x, p.y - ht*0.40, q.y), vec3(hs.x*0.72, ht*0.40, hs.y*0.72)));
        b = min(b, sdBox(vec3(q.x, p.y - ht*0.50, q.y), vec3(hs.x*0.46, ht*0.50, hs.y*0.46)));
      }
      if (p.y > ht - 1.0){
        float ah = ht*0.22;
        b = min(b, sdBox(vec3(q.x, p.y - ht - ah*0.5, q.y), vec3(0.08, ah*0.5, 0.08)));
        float beacon = sdBox(vec3(q.x, p.y - ht - ah, q.y), vec3(0.10));
        if (beacon < b){ b = beacon; if (beacon < d) mat = 3; }
      }
    } else {
      b = sdBox(vec3(q.x, p.y - ht*0.5, q.y), vec3(hs.x, ht*0.5, hs.y));
      if (p.y < ht - 0.5){ }                                    // below the roof the main box is always closer
      else if (hash21(id + 9.1) < 0.20){                             // 20 %: cluster of water tanks / plant rooms
        for (int k = 0; k < 3; k++){
          vec2 o = (hash22(id + 2.2 + float(k)*3.7) - 0.5) * (hs - 0.35) * 1.6;
          float rh = 0.35 + 0.6*hash21(id + 5.5 + float(k));
          b = min(b, sdBox(vec3(q.x - o.x, p.y - ht - rh*0.5, q.y - o.y), vec3(0.28 + 0.12*float(k), rh*0.5, 0.28)));
        }
      } else {
        vec2 rs = hs*0.35; float rh = 0.5 + 1.2*hash21(id + 9.1);
        vec2 ro2 = (hash22(id + 2.2) - 0.5)*(hs - rs)*1.6;
        b = min(b, sdBox(vec3(q.x - ro2.x, p.y - ht - rh*0.5, q.y - ro2.y), vec3(rs.x, rh*0.5, rs.y)));
      }
    }
    if (b < d){ d = b; if (mat != 3) mat = 1; }
  }
  // domain repetition safety: never step past the neighbouring cell's building
  float bound = min(CELL*0.5 - abs(q.x), CELL*0.5 - abs(q.y)) + (CELL*0.5 - 2.0);
  d = min(d, bound);
  // landmark tower (world space): 3 tiers, spire, beacon
  vec3 tp = p - towerPos();
  float tw = sdBox(vec3(tp.x, tp.y - TOWER_H*0.5 - 8.0, tp.z), vec3(4.2, TOWER_H*0.5 + 8.0, 4.2));   // coarse bound
  if (tw < 2.0){
    tw = sdBox(vec3(tp.x, tp.y - TOWER_H*0.25, tp.z), vec3(4.2, TOWER_H*0.25, 4.2));
    tw = min(tw, sdBox(vec3(tp.x, tp.y - TOWER_H*0.36, tp.z), vec3(3.0, TOWER_H*0.36, 3.0)));
    tw = min(tw, sdBox(vec3(tp.x, tp.y - TOWER_H*0.50, tp.z), vec3(1.9, TOWER_H*0.50, 1.9)));
    tw = min(tw, sdBox(vec3(tp.x, tp.y - TOWER_H - 7.0, tp.z), vec3(0.22, 7.0, 0.22)));
    float tb = sdBox(vec3(tp.x, tp.y - TOWER_H - 14.0, tp.z), vec3(0.35));
    if (tb < tw){ tw = tb; if (tb < d) mat = 3; } else if (tw < d) mat = 5;
  }
  d = min(d, tw);
  gMat = (d < ground) ? mat : 2;
  return min(d, ground);
}

vec2 raymarch(vec3 ro, vec3 rd){
  float t = 0.0;
  for (int i = 0; i < 72; i++){
    vec3 p = ro + rd*t;
    float d = map(p);
    float eps = 0.002*t + 0.0005;
    if (d < eps) return vec2(t, float(i));
    t += d;
    if (t > MAXD) return vec2(-1.0, float(i));
  }
  return vec2(-1.0, 72.0);
}

vec3 calcNormal(vec3 p){
  const float e = 0.0015; const vec2 k = vec2(1.0, -1.0);
  vec3 n = k.xyy*map(p + k.xyy*e) + k.yyx*map(p + k.yyx*e) + k.yxy*map(p + k.yxy*e) + k.xxx*map(p + k.xxx*e);
  float l = length(n);
  return l > 1e-6 ? n / l : vec3(0.0, 1.0, 0.0);
}

float calcAO(vec3 p, vec3 n){
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 3; i++){
    float h = 0.06 + 0.5*float(i)/2.0;
    float d = map(p + n*h);
    occ += (h - d)*sca; sca *= 0.65;
  }
  return clamp(1.0 - 1.2*occ, 0.0, 1.0);
}

vec3 skyBase(vec3 rd){
  float y = clamp(rd.y, 0.0, 1.0);
  vec3 top = vec3(0.0006, 0.0012, 0.0035);
  vec3 hor = vec3(0.014, 0.032, 0.064);
  return mix(hor, top, pow(y, 0.5));
}

// Searchlight on the landmark tower: slow sweep, tilted down so the beam falls between the buildings.
vec3 searchOrigin(){ return towerPos() + vec3(0.0, TOWER_H + 2.0, 0.0); }
vec3 searchDir(){ float a = uSearch; float ct = cos(0.44), st = sin(0.44); return normalize(vec3(cos(a)*ct, -st, sin(a)*ct)); }   // 25 deg down: lands near the camera
// beam intensity at a point (cone, soft edge, distance falloff)
float beamAt(vec3 p){
  vec3 S = searchOrigin(), D = searchDir();
  vec3 v = p - S; float s = dot(v, D);
  if (s < 0.0) return 0.0;
  float dist = length(v - D*s);
  float rad = 1.2 + 0.035*s;
  return smoothstep(rad, rad*0.35, dist) / (1.0 + 0.00012*s*s);
}
// Street lamps: one per block on each side of every N-S street, 3.2 high, tungsten. Nearest four light the scene.
vec3 lampLight(vec3 p, vec3 n){
  vec2 idc = floor(p.xz / CELL);
  float rm = mod(idc.y, 7.0);
  if (rm == 3.0 || rm == 4.0) return vec3(0.0);
  float kx = floor(p.x / CELL + 0.5) * CELL;
  float zc = (idc.y + 0.5) * CELL;
  float zn = p.z > zc ? zc + CELL : zc - CELL;
  vec3 acc = vec3(0.0);
  for (int i = 0; i < 4; i++){
    vec3 lp = vec3(kx + ((i & 1) == 0 ? -1.75 : 1.75), 3.1, (i < 2) ? zc : zn);
    vec3 v = lp - p; float d2 = dot(v, v); vec3 l = v * inversesqrt(d2 + 1e-4);
    float spot = smoothstep(0.10, 0.55, l.y);                      // shines downward
    acc += spot * max(dot(n, l), 0.0) / (1.0 + 0.6*d2);
  }
  return vec3(1.0, 0.72, 0.45) * 0.7 * acc;
}
// analytic in-scatter from the lamps along the camera's own street (no map calls)
vec3 lampGlow(vec3 ro, vec3 rd, float tmax){
  vec3 acc = vec3(0.0);
  float z0 = (floor(ro.z / CELL) - 1.0 + 0.5) * CELL;
  for (int i = 0; i < 12; i++){
    float z = z0 + float(i >> 1) * CELL;
    float rmz = mod(floor(z / CELL), 7.0);
    if (rmz == 3.0 || rmz == 4.0) continue;
    vec3 lp = vec3(((i & 1) == 0 ? -1.75 : 1.75), 3.1, z);
    vec3 a = ro - lp; float b = dot(rd, a); float c = dot(a, a);
    float h = sqrt(max(c - b*b, 0.04));
    acc += vec3(1.0, 0.72, 0.45) * (atan((tmax + b) / h) - atan(b / h)) / h;
  }
  return acc * 0.0008;
}

// Low cloud deck at y = 60, lit from below by the city; the searchlight paints it when it sweeps up.
vec3 skyColor(vec3 rd){
  vec3 base = skyBase(rd);
  if (rd.y < 0.02) return base;
  float dist = (60.0 - gRo.y) / rd.y;
  vec2 cp = gRo.xz + rd.xz * dist;
  vec3 cpos = vec3(cp.x, 60.0, cp.y);
  cp += vec2(iTime*1.2, iTime*0.5);
  float nz = 0.5*vnoise(cp*0.018) + 0.28*vnoise(cp*0.041 + 7.3) + 0.14*vnoise(cp*0.095 + 3.1);
  float dens = smoothstep(0.40, 0.66, nz);
  float fade = smoothstep(0.02, 0.22, rd.y) * exp(-dist*0.0025);       // thins toward the horizon, far clouds dissolve
  vec3 cloud = vec3(0.024, 0.021, 0.019) * (1.0 + 1.2*(1.0 - rd.y));   // city light pollution on the underside
  cloud += vec3(0.55, 0.72, 1.0) * 0.5 * beamAt(cpos);
  return mix(base, cloud, dens * fade * 0.9);
}

// Distant traffic: headlight pools moving along the lanes of every street except the camera's own (warm only, no tail lights)
vec3 carLights(vec3 p){
  vec3 acc = vec3(0.0);
  for (int axis = 0; axis < 2; axis++){
    float along = axis == 0 ? p.z : p.x;                       // N-S streets run along z, E-W along x
    float across = axis == 0 ? p.x : p.z;
    float k = floor(across / CELL + 0.5);
    if (axis == 0 && k == 0.0) continue;                       // never on the camera's street
    float rowOf = axis == 0 ? floor(p.z / CELL) : k;           // no traffic on the river rows
    float rmr = mod(rowOf, 7.0);
    if (rmr == 3.0 || rmr == 4.0 || (axis == 1 && mod(k - 1.0, 7.0) == 4.0)) continue;
    float s = across - k*CELL;
    if (abs(s) > 2.0) continue;
    for (int lane = 0; lane < 2; lane++){
      float dir = lane == 0 ? 1.0 : -1.0;
      vec2 seed = vec2(k*1.7 + float(axis)*31.0, float(lane));
      float P  = 26.0 + 12.0*hash21(seed);
      float sp = 8.0 + 6.0*hash21(seed + 4.0);
      float c0 = dir*iTime*sp + 100.0*hash21(seed + 8.0);
      float n  = floor((along - c0) / P + 0.5);
      if (hash21(seed + n*0.31 + 12.0) > 0.5) continue;          // empty slot
      float cpos = c0 + n*P;
      vec2 hl2 = axis == 0 ? vec2(k*CELL + dir*0.7, cpos) : vec2(cpos, k*CELL + dir*0.7);
      vec3 v = p - vec3(hl2.x, 0.45, hl2.y);
      float d2 = dot(v, v);
      float ahead = axis == 0 ? v.z : v.x;
      float fwd = smoothstep(-0.3, 0.8, dir * ahead * inversesqrt(d2 + 1e-3));
      acc += vec3(1.0, 0.82, 0.60) * fwd / (1.0 + 1.5*d2);
    }
  }
  return acc;
}

// Signature move: on every beat a ring expands from the camera at 40 u/s; windows it passes flare x2.5 for 0.4 s, then fade.
float ringBoost(vec3 p, float j){                                   // j: per-window jitter 0..1 (delay + decay rate)
  float dist = length(p.xz - vec2(0.0, uCamZ));
  float best = 0.0;
  for (int k = 0; k < 2; k++){
    float f = (k == 0 ? uBeatAge.x : uBeatAge.y) - dist / 40.0 - 0.15*j;   // time since the ring passed this window
    float b = f < 0.0 ? 0.0 : (f < 0.4 ? 1.0 : exp(-(f - 0.4)*(4.0 + 4.0*j)));
    b *= smoothstep(-0.06, 0.02, f);                                  // soft leading edge
    best = max(best, b);
  }
  return best * uParams.x;
}
float flash(){ return uFlashAge < 0.1 ? 1.0 : 0.0; }               // 0.1 s lightning: the whole skyline in silhouette

// Windows: per-building type, clustered 4-class brightness, mid floors densest, warm leak onto the wall.
// Returns emission; `leak` receives warm light spilling onto the surrounding wall (0..1).
vec3 windowLight(vec3 p, vec3 n, float t, out float leak, out float facade){
  leak = 0.0; facade = 1.0;
  if (n.y > 0.5) return vec3(0.0);
  vec2 id = floor(p.xz / CELL);
  vec2 hs; float ht; cellParams(id, hs, ht);
  vec3 tp = p - towerPos();
  if (max(abs(tp.x), abs(tp.z)) < 4.5){ id = vec2(777.0, 313.0); ht = TOWER_H; }   // landmark uses its own id/height
  float type = hash21(id + 41.3);
  vec2 ws = type < 0.33 ? vec2(0.34, 0.74) : (type < 0.66 ? vec2(0.78, 0.44) : vec2(0.50, 0.50));   // tall / wide / square
  float face = abs(n.x) > 0.5 ? 0.37 : 0.0;
  float u = abs(n.x) > 0.5 ? p.z : p.x;
  vec2 g = vec2(u, p.y) / ws;
  vec2 c = floor(g), f = fract(g);
  float fy = clamp(p.y / max(ht, 1.0), 0.0, 1.0);
  float prof = smoothstep(0.0, 0.22, fy) * (1.0 - smoothstep(0.72, 1.0, fy));   // ground + top floors mostly dark
  float gRing = ringBoost(p, 0.0);
  float occ = 0.25 + 0.25*hash21(id + 77.7);                                       // per-building occupancy
  vec3 emit = vec3(0.0);
  for (int k = 0; k < 5; k++){                                          // centre + 4 neighbours (cross)
    int i = (k == 1) ? -1 : (k == 2 ? 1 : 0), j = (k == 3) ? -1 : (k == 4 ? 1 : 0);
    vec2 cc = c + vec2(float(i), float(j));
    float cl = hash21(floor(cc / 3.0) + id*7.7 + face);          // 3x3 cluster value
    float hw = hash21(cc + id*13.17 + face);
    float v  = mix(hw, cl, 0.55);                                   // clustered, not uniform
    float b  = v < 0.30 ? 0.0 : (v < 0.70 ? 0.10 : (v < 0.86 ? 1.6 : 6.0));   // off / dim / bright / near-white
    float elig = step(hash21(cc*2.3 + id + 9.0), prof * occ);
    b *= elig;
    float rw = ringBoost(p, hash21(cc*0.71 + id + 1.7));                  // per-window timing: the wave front gets texture
    b = max(b, 1.2 * rw * step(hash21(cc*1.3 + id + 4.0), prof * 0.45));   // the passing ring lights some dark windows, then they fade
    b *= 1.0 + 1.5*rw;
    vec2 d = f - vec2(float(i), float(j)) - 0.5;                   // pixel -> neighbour window centre, cell units
    if (i == 0 && j == 0){
      vec2 rect = smoothstep(0.04, 0.0, abs(d) - vec2(0.25, 0.30));
      vec3 tint = mix(vec3(1.0, 0.70, 0.42), vec3(1.0, 0.82, 0.60), hash21(cc*0.37 + id*2.1));
      tint = mix(tint, vec3(1.0, 0.92, 0.80), step(2.0, b));       // the rare very-bright ones go near white
      emit = tint * b * rect.x * rect.y;
    }
    leak += b * smoothstep(1.1, 0.25, length(d * vec2(1.0, ws.y / ws.x)));
  }
  float lod = smoothstep(15.0, 60.0, t);                            // far: average, no sparkle
  // facade relief: floor slabs, mullions between window columns, a lighter parapet at the top
  float slab = smoothstep(0.0, 0.09, f.y) * smoothstep(1.0, 0.91, f.y);
  float mull = smoothstep(0.0, 0.06, f.x) * smoothstep(1.0, 0.94, f.x);
  float parapet = 1.0 + 0.6*smoothstep(0.7, 0.0, ht - p.y);
  facade = mix(mix(0.5, 1.0, slab*mull) * parapet, 0.9, lod);
  float ring = 1.0 + 1.5*gRing;
  leak = mix(leak * 0.22, 0.04 * prof * occ * ring, lod);
  return mix(emit, vec3(1.0, 0.76, 0.52) * 0.10 * prof * occ * ring, lod) * 2.2;
}

vec3 shade(vec3 p, vec3 n, vec3 rd, float t, int mat, bool cheap){
  if (mat == 3) return vec3(1.0, 0.10, 0.06) * 5.0 * blink();        // aviation beacon
  if (mat == 6) return vec3(1.0, 0.76, 0.50) * (n.y > 0.3 ? 0.10 : 2.5);   // lamp head: emits sideways/down, dark from above
  vec3 alb = (mat == 2) ? vec3(0.010, 0.012, 0.015) : vec3(0.040, 0.055, 0.075);   // wet asphalt is black; facades deep teal-blue
  if (mat == 5) alb *= 0.8;
  vec3 wEmit = vec3(0.0); float leak = 0.0;
  if (mat == 1 || mat == 5){
    vec2 bid = floor(p.xz / CELL);
    alb *= (0.75 + 0.5*hash21(bid + 3.3)) * mix(vec3(0.92, 1.0, 1.10), vec3(1.06, 1.0, 0.94), hash21(bid + 6.1));   // per-building value + hue drift
    float facade;
    wEmit = windowLight(p, n, t, leak, facade);
    alb *= facade;
  }
  vec3 L = normalize(vec3(0.45, 0.65, -0.35));
  float hl = 0.5 + 0.5*dot(n, L);
  float dif = mix(hl*hl, max(dot(n, L), 0.0), 0.7);
  vec3 keyCol = vec3(0.45, 0.62, 0.90)*0.25;                                  // moon: dim, cool
  vec3 skyAmb = vec3(0.02, 0.035, 0.06) * (0.55 + 0.45*n.y);
  float ao = cheap ? 0.8 : calcAO(p, n);
  vec3 col = alb * (keyCol*dif + skyAmb) * mix(0.15, 1.0, ao);
  col += alb * lampLight(p, n);
  if (mat == 2) col += carLights(p) * 0.03;
  if (mat != 2) col += vec3(1.0, 0.70, 0.42) * 0.015 * ringBoost(p, 0.0);
  float bm = beamAt(p);
  if (bm > 0.001){ vec3 toL = normalize(searchOrigin() - p); col += alb * vec3(0.55, 0.72, 1.0) * 6.0 * bm * max(dot(n, toL), 0.0); }
  col += alb * vec3(1.0, 0.70, 0.42) * leak * 1.8;                           // warm spill on the wall next to lit windows
  col += wEmit;
  float roY = p.y - rd.y*t;
  float midY = max(0.5*(roY + p.y), 0.0);
  float bank = 0.55 + 0.9*vnoise((p.xz + vec2(iTime*0.6, iTime*0.25)) * 0.025);   // drifting fog banks between the blocks
  float dens = 0.009 * uParams.y * bank * exp(-0.06*midY);
  float fog = 1.0 - exp(-dens*t);
  vec3 fogCol = skyBase(rd) * vec3(0.75, 0.95, 1.2) * (1.0 + 5.0*flash());  // fog colder than the sky; lightning lifts it
  col = mix(col, vec3(dot(col, vec3(0.3, 0.5, 0.2))), 0.5*fog);              // distance desaturation
  return mix(col, fogCol, fog);
}

// single scattering of the searchlight along the view ray, sampled where the ray passes the beam
vec3 volumetric(vec3 ro, vec3 rd, float tmax, vec2 frag){
  vec3 S = searchOrigin(), D = searchDir();
  vec3 w = ro - S;
  float b = dot(rd, D), d1 = dot(rd, w), d2 = dot(D, w);
  float den = 1.0 - b*b;
  float tc = abs(den) > 1e-4 ? (b*d2 - d1) / den : 0.5*tmax;      // closest approach along the view ray
  float t0 = clamp(tc - 26.0, 0.0, tmax), t1 = clamp(tc + 26.0, 0.0, tmax);
  if (t1 - t0 < 1.0) return vec3(0.0);
  float dt = (t1 - t0) / 6.0;
  float t = t0 + dt * hash21(frag);
  float acc = 0.0;
  for (int i = 0; i < 6; i++){
    vec3 p = ro + rd*t;
    float bm = beamAt(p);
    if (bm > 0.002){
      vec3 toL = normalize(S - p);
      float sh = clamp(map(p) / 1.5, 0.0, 1.0) * clamp(map(p + toL*6.0) / 3.0, 0.0, 1.0);   // crude shadowing by buildings
      acc += bm * sh * exp(-0.04*max(p.y, 0.0)) * dt;
    }
    t += dt;
  }
  return vec3(0.55, 0.72, 1.0) * min(acc, 30.0) * 0.03 * uParams.y;
}

vec3 render(vec3 ro, vec3 rd, vec2 uv){
  vec2 h = raymarch(ro, rd);
  gDepth = h.x > 0.0 ? h.x : MAXD;
  vec3 col = skyColor(rd) * (1.0 + 5.0*flash());
  if (h.x > 0.0){
    float t = h.x;
    vec3 p = ro + rd*t;
    int mat = gMat;                       // read before calcNormal() overwrites it
    vec3 n = calcNormal(p);
    col = shade(p, n, rd, t, mat, false);
    if (mat == 2){                        // wet ground: one bounce, no AO / volumetrics
      float rmw = mod(floor(p.z / CELL), 7.0);
      bool water = (rmw == 3.0 || rmw == 4.0);
      float puddle = water ? 1.0 : smoothstep(0.52, 0.62, 0.65*vnoise(p.xz*0.35) + 0.35*vnoise(p.xz*0.9 + 3.1));   // puddles: mirror; elsewhere: damp
      vec3 nr = n;                        // rain ripples
      if (water){                         // river: long waves along the view direction -> lights stretch into vertical streaks
        nr.z += 0.09*sin(p.x*1.3 + p.z*2.9 + iTime*1.1) + 0.05*sin(p.x*3.7 - p.z*5.1 + iTime*1.9) + 0.03*sin(p.z*9.0 + iTime*2.7);
        nr.x += 0.015*sin(p.z*4.0 + p.x*2.0 + iTime*1.5);
        col *= 0.4;
      }
      nr.xz += (0.003 + 0.016*puddle*uMood.x) * vec2(sin(p.x*6.1 + iTime*2.3) + sin(p.z*4.7 - iTime*1.9), sin(p.z*5.3 + iTime*2.1) + sin(p.x*3.9 - iTime*1.6));
      n = normalize(nr);
      vec3 rr = reflect(rd, n);
      vec3 rp = p + n*0.02;
      float t2 = 0.0, hit = -1.0;
      for (int i = 0; i < 10; i++){
        float d = map(rp + rr*t2);
        if (d < 0.002*t2 + 0.001){ hit = t2; break; }
        t2 += d;
        if (t2 > 160.0) break;
      }
      vec3 refl = skyColor(rr);
      if (hit > 0.0){
        int m2 = gMat;
        vec3 q = rp + rr*hit;
        refl = shade(q, calcNormal(q), rr, hit + t, m2, true);
      }
      float c = max(dot(-rd, n), 0.0);
      float fres = 0.04 + 0.96*pow(1.0 - c, 5.0);
      col = mix(col, refl, fres * mix(0.35, 0.95, puddle));
    }
  }
  col += volumetric(ro, rd, h.x > 0.0 ? h.x : MAXD, gl_FragCoord.xy);
  col += lampGlow(ro, rd, h.x > 0.0 ? h.x : MAXD);
  return col;
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = (2.0*frag - iResolution) / iResolution.y;
  // low, slow dolly down the street, aimed a little toward the landmark; every 12 s a 3 deg tilt up and back
  float ph = fract(iTime / 12.0);
  float e  = ph < 0.5 ? ph*2.0 : 2.0 - ph*2.0;  e = e*e*(3.0 - 2.0*e);
  // narrative keyframes on the river period (56): canyon low -> rise and turn to the landmark over the water -> settle
  float u = mod(uCamZ - 32.0 + 28.0, 56.0) - 28.0;       // distance to the river centre line (z = 56k+32), -28..28
  float rise = smoothstep(-26.0, -14.0, u) * (1.0 - smoothstep(-6.0, 8.0, u));
  rise = rise*rise*(3.0 - 2.0*rise);
  float pitch = radians(4.5 + 3.0*e + 3.0*rise);        // horizon on the lower third
  float yaw   = radians(6.0 + 4.0*rise);                // look across the street, vanishing point off-centre
  float roll  = radians(0.5) * sin(iTime*0.35);
  float focal = mix(1.7, 2.4, rise);                    // wide in the canyon, longer over the river
  vec3 ro = vec3(-0.9, 1.5 + 2.5*rise, uCamZ);           // off the centre line
  vec3 fw = normalize(vec3(sin(yaw)*cos(pitch), sin(pitch), cos(yaw)*cos(pitch)));
  vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(rt, fw);
  vec3 rt2 = rt*cos(roll) + up*sin(roll);
  up = -rt*sin(roll) + up*cos(roll); rt = rt2;
  vec3 rd = normalize(uv.x*rt + uv.y*up + focal*fw);
  gRo = ro;
  vec3 col = render(ro, rd, uv);
  // NaN / Inf guard -> pure magenta. Output is linear HDR; alpha carries depth for the post pass.
  if (any(isnan(col)) || any(isinf(col))) col = vec3(1.0, 0.0, 1.0);
  fragColor = vec4(max(col, 0.0), gDepth / MAXD);
}
</script>

<script id="post" type="x-shader/x-fragment">
precision highp float;
out vec4 fragColor;
uniform sampler2D tScene, tBright;
uniform vec2  uRes, uBrightRes;
uniform int   uMode;                 // 0 bright extraction, 1 composite
uniform float uTime, uFrame, uBloomThr, uBloomStr, uRain, uExposure, uAA;
uniform vec4  uMood;

uint uhash(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float hash21(vec2 p){ uvec2 q = uvec2(ivec2(floor(p * 64.0))); uint h = uhash(q.x ^ uhash(q.y + 0x9e3779b9u)); return float(h) * (1.0 / 4294967296.0); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x + 0.03)) / (x*(2.43*x + 0.59) + 0.14), 0.0, 1.0); }

uniform vec2 uSceneRes;
float lumaTM(vec3 c){ c = aces(c * uExposure); return dot(c, vec3(0.299, 0.587, 0.114)); }
// FXAA (compact 3.11 variant) on the HDR scene, edges detected on tonemapped luma
vec4 fxaa(vec2 uv){
  vec2 inv = 1.0 / uSceneRes;
  vec4 cM = texture(tScene, uv);
  vec3 cNW = texture(tScene, uv + vec2(-1.0, -1.0)*inv).rgb, cNE = texture(tScene, uv + vec2(1.0, -1.0)*inv).rgb;
  vec3 cSW = texture(tScene, uv + vec2(-1.0,  1.0)*inv).rgb, cSE = texture(tScene, uv + vec2(1.0,  1.0)*inv).rgb;
  float lNW = lumaTM(cNW), lNE = lumaTM(cNE), lSW = lumaTM(cSW), lSE = lumaTM(cSE), lM = lumaTM(cM.rgb);
  float lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE))), lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));
  if (lMax - lMin < 0.04 || uAA < 0.5) return cM;                    // flat: nothing to do
  vec2 dir = vec2(-((lNW + lNE) - (lSW + lSE)), ((lNW + lSW) - (lNE + lSE)));
  float dirReduce = max((lNW + lNE + lSW + lSE) * (0.25 * 0.125), 1.0 / 128.0);
  float rcp = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);
  dir = clamp(dir * rcp, vec2(-8.0), vec2(8.0)) * inv;
  vec3 rgbA = 0.5 * (texture(tScene, uv + dir*(1.0/3.0 - 0.5)).rgb + texture(tScene, uv + dir*(2.0/3.0 - 0.5)).rgb);
  vec3 rgbB = rgbA*0.5 + 0.25 * (texture(tScene, uv - dir*0.5).rgb + texture(tScene, uv + dir*0.5).rgb);
  float lB = lumaTM(rgbB);
  return vec4((lB < lMin || lB > lMax) ? rgbA : rgbB, cM.a);
}
// scene fetch with 2 px far-depth blur (cheap DOF); the centre tap is anti-aliased
vec3 fetchScene(vec2 uv){
  vec4 c = fxaa(uv);
  float r = 2.0 * smoothstep(0.25, 0.75, c.a);
  if (r < 0.2) return c.rgb;
  vec2 o = r / uRes;
  vec3 s = c.rgb * 2.0;
  s += texture(tScene, uv + o).rgb + texture(tScene, uv - o).rgb
     + texture(tScene, uv + vec2(o.x, -o.y)).rgb + texture(tScene, uv + vec2(-o.x, o.y)).rgb;
  return s / 6.0;
}
vec3 tent(vec2 uv, float lod){
  vec2 ts = exp2(lod) / uBrightRes;
  vec3 s = textureLod(tBright, uv, lod).rgb * 4.0;
  s += (textureLod(tBright, uv + vec2(ts.x, 0.0), lod).rgb + textureLod(tBright, uv - vec2(ts.x, 0.0), lod).rgb
      + textureLod(tBright, uv + vec2(0.0, ts.y), lod).rgb + textureLod(tBright, uv - vec2(0.0, ts.y), lod).rgb) * 2.0;
  s += textureLod(tBright, uv + ts, lod).rgb + textureLod(tBright, uv - ts, lod).rgb
     + textureLod(tBright, uv + vec2(ts.x, -ts.y), lod).rgb + textureLod(tBright, uv + vec2(-ts.x, ts.y), lod).rgb;
  return s / 16.0;
}

// screen-space rain: two layers of slanted streaks
float rain(vec2 frag, float t){
  float wind = 0.06 + 0.10*sin(t / 9.0);                                   // gusts change the slant
  vec2 p = vec2(frag.x - frag.y*wind, frag.y);
  float acc = 0.0;
  for (int l = 0; l < 2; l++){
    float sc = l == 0 ? 1.0 : 1.8;
    vec2 q = p / sc;
    float colW = 3.0;
    float cx = floor(q.x / colW);
    float ph = hash21(vec2(cx, float(l)));
    float y = q.y + t*(700.0 + 500.0*ph) + ph*1000.0;
    float period = 260.0 + 600.0*hash21(vec2(cx, 7.0 + float(l)));
    float len = 30.0 + 40.0*ph;
    float f = mod(y, period);
    float streak = smoothstep(0.0, len*0.35, f) * (1.0 - smoothstep(len*0.35, len, f));
    float xw = 1.0 - smoothstep(0.25, 0.9, abs(fract(q.x/colW) - 0.5)*colW);
    float on = step(hash21(vec2(cx, floor(y/period) + float(l)*3.0)), uRain*0.7);
    acc += streak * xw * on * (l == 0 ? 0.30 : 0.16);
  }
  return acc;
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  if (uMode == 0){
    vec3 c = texture(tScene, uv).rgb;
    float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
    float k = max(l - uBloomThr, 0.0) / max(l, 1e-4);
    fragColor = vec4(c * k, 1.0);
    return;
  }
  vec2 cv = uv - 0.5;
  float r = length(cv) / 0.7071;
  vec2 off = cv * r * (1.5 / uRes);                          // chromatic aberration, 1.5 px at the corners
  vec3 col = fetchScene(uv);
  float fr = smoothstep(0.3, 1.0, r);                         // fringe only toward the edges: one AA pass, two cheap taps
  col.r = mix(col.r, texture(tScene, uv + off).r, fr);
  col.b = mix(col.b, texture(tScene, uv - off).b, fr);
  // bloom: 4 mip levels, 9-tap tent each
  vec3 bloom = (tent(uv, 1.0) + tent(uv, 2.0) + tent(uv, 3.0) + tent(uv, 4.0)) * 0.25;
  col += bloom * uBloomStr;
  // anamorphic streak: horizontal, 6 % of the width, cold
  vec3 streak = vec3(0.0); float wsum = 0.0;
  for (int i = -4; i <= 4; i++){
    float f = float(i) / 4.0, w = 1.0 - abs(f);
    streak += textureLod(tBright, uv + vec2(f*0.03, 0.0), 3.0).rgb * w; wsum += w;
  }
  col += streak / wsum * vec3(0.5, 0.68, 1.0) * 0.3;
  col += rain(gl_FragCoord.xy, uTime) * vec3(0.45, 0.60, 0.85) * 0.10 * (0.4 + 2.0*bloom.g + 8.0*uMood.z);   // rain, brighter near lights and inside the searchlight
  // a few raindrops on the lens: tiny inverted refractions that slide down and are replaced every 4 s
  {
    float aspect = uRes.x / uRes.y;
    float slot = floor(uTime / 4.0), ph = fract(uTime / 4.0);
    for (int i = 0; i < 4; i++){
      vec2 c = vec2(hash21(vec2(slot, float(i)*3.1)) * aspect, hash21(vec2(slot + 7.0, float(i)*1.7)));
      c.y -= ph * 0.05 * (0.5 + hash21(vec2(slot, float(i) + 9.0)));
      float rad = 0.010 + 0.012*hash21(vec2(float(i), slot + 2.0));
      vec2 q = vec2(uv.x * aspect, uv.y) - c;
      float d = length(q) / rad;
      if (d < 1.0){
        vec2 ruv = uv - q * (0.9 / rad) * rad * 1.6;                 // refraction: sample the flipped surroundings
        vec3 through = texture(tScene, clamp(ruv, 0.0, 1.0)).rgb;
        float rim = smoothstep(0.55, 1.0, d) * 0.06;
        col = mix(col, through + rim, smoothstep(1.0, 0.85, d) * 0.85);
      }
    }
  }
  // vignette in linear light (highlights survive, shadows sink), then tonemap + display transform
  col *= 1.0 - 0.55 * pow(r, 2.2);
  {
    vec3 c = col * uExposure;
    float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
    vec3 perChannel = aces(c);
    vec3 hueKeep = c * (aces(vec3(l)).x / max(l, 1e-4));       // tonemap luminance, keep the tungsten hue in highlights
    float keep = 0.65 * (1.0 - smoothstep(2.0, 4.5, l));          // very bright cores still clip to white, like film
    col = mix(perChannel, clamp(hueKeep, 0.0, 1.0), keep);
  }
  col = pow(col, vec3(1.0/2.2));
  col = max(col - 0.022, 0.0) / (1.0 - 0.022);                 // crush the blacks (film toe)
  // grain: per frame, stronger in the shadows
  float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
  float g = hash21(gl_FragCoord.xy + vec2(uFrame*7.31, uFrame*3.17)) - 0.5;
  col += g * 0.04 * mix(1.0, 0.4, lum);
  // vignette
  // 2.39:1 letterbox
  float barH = max(0.0, (uRes.y - uRes.x / 2.39) * 0.5);
  if (gl_FragCoord.y < barH || gl_FragCoord.y > uRes.y - barH) col = vec3(0.0);
  col *= uMood.w;                                                     // fade in / out
  if (any(isnan(col)) || any(isinf(col))) col = vec3(1.0, 0.0, 1.0);
  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
</script>

<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const TEST = params.get('test') === '1';
const REC = params.has('rec');
const FIXED_TIME = 8.0;

// ---------- stats ----------
const stats = window.__stats = {
  fps: 0, frameMs: 0, shaderError: '', renderScale: 0.75,
  rtW: 0, rtH: 0, dpr: window.devicePixelRatio, gpu: '', test: TEST, frames: 0
};

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(1);            // canvas = CSS pixels; renderScale never multiplies DPR
renderer.autoClear = false;
renderer.debug.onShaderError = (gl, program, vs, fs) => {
  const log = [gl.getShaderInfoLog(vs), gl.getShaderInfoLog(fs), gl.getProgramInfoLog(program)].filter(Boolean).join('\n');
  stats.shaderError = (stats.shaderError + '\n' + log).trim();
  console.error('SHADER ERROR', log);
};
document.body.appendChild(renderer.domElement);
{
  const gl = renderer.getContext();
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  stats.gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
}

let renderScale = 0.75;
const rt = new THREE.WebGLRenderTarget(2, 2, {                    // linear HDR scene, alpha = depth
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  depthBuffer: false, stencilBuffer: false, type: THREE.HalfFloatType
});
const rtBright = new THREE.WebGLRenderTarget(2, 2, {              // half-res bright pass, mip chain = 4-level downsample
  minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter,
  depthBuffer: false, stencilBuffer: false, type: THREE.HalfFloatType, generateMipmaps: true
});

const uniforms = {
  iTime:       { value: 0 },
  iResolution: { value: new THREE.Vector2(1, 1) },
  uAudio:      { value: new THREE.Vector4(0, 0, 0, 0) },
  uBeat:       { value: 0 },
  uScale:      { value: renderScale },
  uCamZ:       { value: 0 },
  uParams:     { value: new THREE.Vector4(1, 1, 1, 0) },
  uSearch:     { value: 0 },
  uBeatAge:    { value: new THREE.Vector2(99, 99) },
  uFlashAge:   { value: 99 },
  uMood:       { value: new THREE.Vector4(0.5, 1, 0, 1) }
};
const beatTimes = [-99, -99];
let beatCount = 0, flashTime = -99, slowEnergy = 0.5;
let fadeInAt = -99, fadeOutAt = 1e9;           // seconds (page time)
const titleEl = document.getElementById('title');
function cueOpening(t){ fadeInAt = t; fadeOutAt = 1e9; setTimeout(() => titleEl.style.opacity = 1, 1000); setTimeout(() => titleEl.style.opacity = 0, 5000); }
let searchAngle = -1.75;
const ctl = { response: 1, fog: 1, speed: 1 };
window.__ctl = ctl; window.__u = uniforms;
let camZ = 0;
const vert = document.getElementById('vert').textContent;
const mainMat = new THREE.RawShaderMaterial({
  glslVersion: THREE.GLSL3, uniforms,
  vertexShader: vert, fragmentShader: document.getElementById('frag').textContent,
  depthTest: false, depthWrite: false
});
const postU = {
  tScene: { value: rt.texture }, tBright: { value: rtBright.texture },
  uRes: { value: new THREE.Vector2(1, 1) }, uBrightRes: { value: new THREE.Vector2(1, 1) }, uSceneRes: { value: new THREE.Vector2(1, 1) },
  uMode: { value: 0 }, uTime: { value: 0 }, uFrame: { value: 0 },
  uBloomThr: { value: 0.8 }, uBloomStr: { value: 0.35 }, uRain: { value: 0.5 }, uExposure: { value: 1.25 }, uAA: { value: params.get('noaa') ? 0 : 1 }, uMood: uniforms.uMood
};
window.__p = postU;
const postMat = new THREE.RawShaderMaterial({
  glslVersion: THREE.GLSL3, uniforms: postU,
  vertexShader: vert, fragmentShader: document.getElementById('post').textContent,
  depthTest: false, depthWrite: false
});
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quad = new THREE.PlaneGeometry(2, 2);
const sceneRT = new THREE.Scene(); sceneRT.add(new THREE.Mesh(quad, mainMat));
const scenePost = new THREE.Scene(); scenePost.add(new THREE.Mesh(quad, postMat));

function resize(){
  const w = window.innerWidth, h = window.innerHeight;   // CSS pixels
  renderer.setSize(w, h, false);
  const rw = Math.max(2, Math.round(w * renderScale)), rh = Math.max(2, Math.round(h * renderScale));
  rt.setSize(rw, rh);
  const bw = Math.max(2, rw >> 1), bh = Math.max(2, rh >> 1);
  rtBright.setSize(bw, bh);
  uniforms.iResolution.value.set(rw, rh);
  postU.uBrightRes.value.set(bw, bh);
  postU.uSceneRes.value.set(rw, rh);
  stats.rtW = rw; stats.rtH = rh; stats.renderScale = renderScale; uniforms.uScale.value = renderScale;
}
window.addEventListener('resize', resize);
resize();
window.__setRenderScale = (s) => { renderScale = Math.min(1, Math.max(0.4, s)); resize(); };
const statLine = document.getElementById('statLine');
// adaptive: 2 s below 55 -> -0.1 (min 0.4); 5 s above 59 -> +0.05 (max 1.0). Off in test mode.
let lowSec = 0, highSec = 0;
function adaptScale(fps){
  if (TEST) return;
  lowSec  = fps < 55 ? lowSec + 1 : 0;
  highSec = fps > 59 ? highSec + 1 : 0;
  if (lowSec >= 2 && renderScale > 0.4){ window.__setRenderScale(renderScale - 0.1); lowSec = 0; highSec = 0; }
  else if (highSec >= 5 && renderScale < 1.0){ window.__setRenderScale(renderScale + 0.05); highSec = 0; }
}

// ---------- audio ----------
function syntheticAudio(t){
  return {
    bass:   0.5 + 0.5*Math.sin(t*1.3),
    mid:    0.5 + 0.5*Math.sin(t*0.7 + 1.0),
    high:   0.5 + 0.5*Math.sin(t*2.1 + 2.0),
    energy: 0.5 + 0.5*Math.sin(t*0.9 + 3.0),
    beat:   Math.pow(Math.max(0, Math.sin(t*2.0)), 4)
  };
}

const audio = {
  ctx: null, analyser: null, source: null, kind: 'none',
  freq: null, time: null,
  raw:  { bass: 0, mid: 0, high: 0, energy: 0 },
  max:  { bass: 1e-3, mid: 1e-3, high: 1e-3, energy: 1e-3 },
  val:  { bass: 0, mid: 0, high: 0, energy: 0 },
  beat: 0, beatThreshold: 1.4, lastBeat: -1e9, bassHist: [], bassHistT: [],
  bins: null
};
window.__audio = audio;

function bandBins(){
  const sr = audio.ctx.sampleRate, n = audio.analyser.frequencyBinCount, hz = sr / audio.analyser.fftSize;
  const b = (lo, hi) => [Math.max(1, Math.round(lo/hz)), Math.min(n-1, Math.round(hi/hz))];
  audio.bins = { bass: b(20, 150), mid: b(150, 2000), high: b(2000, 12000) };
}
function bandAmp(range){
  // log-band compression: average amplitude weighted by 1/bin (so each octave counts equally)
  let sum = 0, wsum = 0;
  for (let i = range[0]; i <= range[1]; i++){
    const a = Math.pow(10, audio.freq[i] / 20);   // dB -> linear
    const w = 1 / i; sum += a*w; wsum += w;
  }
  return wsum > 0 ? sum / wsum : 0;
}
function ensureCtx(){
  if (audio.ctx) return;
  audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
  audio.analyser = audio.ctx.createAnalyser();
  audio.analyser.fftSize = 2048;
  audio.analyser.smoothingTimeConstant = 0.0;   // we do our own smoothing
  audio.freq = new Float32Array(audio.analyser.frequencyBinCount);
  audio.time = new Float32Array(audio.analyser.fftSize);
  bandBins();
}
function disconnectSource(){
  if (audio.source){ try { audio.source.disconnect(); } catch(e){} audio.source = null; }
  if (audio.stream){ audio.stream.getTracks().forEach(t => t.stop()); audio.stream = null; }
  player.pause();
}
async function useMic(){
  ensureCtx(); await audio.ctx.resume();
  disconnectSource();
  try {
    audio.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch(e){ srcName.textContent = '麦克风被拒绝: ' + e.message; return; }
  audio.source = audio.ctx.createMediaStreamSource(audio.stream);
  audio.source.connect(audio.analyser);          // not to destination: no feedback
  audio.kind = 'mic'; srcName.textContent = 'mic'; markSrc();
}
let elementSource = null;
async function useFile(file){
  ensureCtx(); await audio.ctx.resume();
  disconnectSource();
  player.src = URL.createObjectURL(file);
  if (!elementSource){ elementSource = audio.ctx.createMediaElementSource(player); }
  audio.source = elementSource;
  audio.source.connect(audio.analyser);
  audio.analyser.connect(audio.ctx.destination);
  await player.play();
  audio.kind = 'file'; srcName.textContent = file.name; markSrc();
}
function markSrc(){ btnMic.classList.toggle('on', audio.kind === 'mic'); btnFile.classList.toggle('on', audio.kind === 'file'); }

function liveAudio(dt, nowSec){
  const an = audio.analyser;
  an.getFloatFrequencyData(audio.freq);
  an.getFloatTimeDomainData(audio.time);
  let rms = 0; for (let i = 0; i < audio.time.length; i++) rms += audio.time[i]*audio.time[i];
  rms = Math.sqrt(rms / audio.time.length);
  const raw = audio.raw;
  raw.bass = bandAmp(audio.bins.bass); raw.mid = bandAmp(audio.bins.mid); raw.high = bandAmp(audio.bins.high); raw.energy = rms;
  // beat: raw bass vs its 1 s sliding mean
  audio.bassHist.push(raw.bass); audio.bassHistT.push(nowSec);
  while (audio.bassHistT.length && nowSec - audio.bassHistT[0] > 1.0){ audio.bassHist.shift(); audio.bassHistT.shift(); }
  const mean = audio.bassHist.reduce((a, b) => a + b, 0) / audio.bassHist.length;
  if (raw.bass > audio.beatThreshold*mean && raw.bass > 1e-4 && nowSec - audio.lastBeat > 0.2){ audio.beat = 1; audio.lastBeat = nowSec; beatTimes.unshift(nowSec); beatTimes.length = 2;
    beatCount++;
    if (beatCount % 8 === 0 || (audio.val.energy > 0.85 && nowSec - flashTime > 4)) flashTime = nowSec;   // lightning is rare
  }
  audio.beat *= Math.exp(-8*dt);
  // adaptive gain (sliding max with slow decay) + asymmetric smoothing
  for (const k of ['bass', 'mid', 'high', 'energy']){
    audio.max[k] = Math.max(raw[k], audio.max[k]*Math.pow(0.5, dt/2.5), 1e-4);   // half-life 2.5 s
    const n = Math.min(1, raw[k] / audio.max[k]);
    const a = n > audio.val[k] ? 0.4 : 0.08;
    audio.val[k] += (n - audio.val[k]) * a;
  }
  return { ...audio.val, beat: audio.beat };
}
function currentAudio(t, dt){
  if (TEST) return syntheticAudio(t);
  if (audio.analyser && audio.kind !== 'none') return liveAudio(dt, t);
  const s = syntheticAudio(t*0.5);   // idle: gentle breathing before any input
  return { bass: s.bass*0.25, mid: s.mid*0.25, high: s.high*0.2, energy: s.energy*0.25, beat: 0 };
}

// ---------- UI wiring ----------
const overlay = document.getElementById('overlay'), srcBox = document.getElementById('panel'), bars = document.getElementById('bars');
const btnMic = document.getElementById('btnMic'), btnFile = document.getElementById('btnFile'), fileIn = document.getElementById('fileIn');
const srcName = document.getElementById('srcName'), player = document.getElementById('player');
const barEls = [...bars.querySelectorAll('i')];
let barsVisible = true;
function start(){
  ensureCtx(); audio.ctx.resume();
  cueOpening((performance.now() - t0) / 1000);
  overlay.classList.add('hidden'); srcBox.classList.remove('hidden'); bars.classList.remove('hidden');
}
// R: record the canvas for 30 s -> webm (VP9, 8 Mbps)
let rec = null, recTimer = 0;
const recSeconds = parseFloat(params.get('rec') ?? '30');
function toggleRecord(){
  if (rec){ clearTimeout(recTimer); rec.stop(); return; }
  const stream = renderer.domElement.captureStream(30);
  if (audio.kind === 'file' && audio.ctx){ const dst = audio.ctx.createMediaStreamDestination(); audio.analyser.connect(dst); stream.addTrack(dst.stream.getAudioTracks()[0]); }
  const mime = ['video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const chunks = [];
  rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = 'nightcity-' + Date.now() + '.webm'; a.click();
    rec = null; srcName.textContent = srcName.textContent.replace(' ● REC', ''); fadeInAt = (performance.now() - t0) / 1000 - 2; fadeOutAt = 1e9;
  };
  rec.start(1000);
  { const nowS = (performance.now() - t0) / 1000; cueOpening(nowS); fadeOutAt = nowS + recSeconds - 1.5; }
  srcName.textContent += ' ● REC';
  recTimer = setTimeout(() => rec && rec.stop(), recSeconds*1000);
}

if (TEST && REC){ setTimeout(() => toggleRecord(), 1500); }   // ?test=1&rec=N: auto-record N seconds
if (TEST){ overlay.classList.add('hidden'); }
else {
  overlay.addEventListener('click', start);
  btnMic.addEventListener('click', useMic);
  btnFile.addEventListener('click', () => fileIn.click());
  fileIn.addEventListener('change', () => { if (fileIn.files[0]) useFile(fileIn.files[0]); });
  window.addEventListener('dragover', e => { e.preventDefault(); overlay.classList.add('drag'); });
  window.addEventListener('dragleave', () => overlay.classList.remove('drag'));
  window.addEventListener('drop', e => {
    e.preventDefault(); overlay.classList.remove('drag');
    const f = [...e.dataTransfer.files].find(f => /audio|mp3|wav/i.test(f.type + f.name));
    if (!f) return;
    if (!audio.ctx) start();
    useFile(f);
  });
  const bind = (id, vid, fn) => { const el = document.getElementById(id), v = document.getElementById(vid);
    el.addEventListener('input', () => { fn(+el.value); v.textContent = (+el.value).toFixed(2); }); };
  bind('sResp', 'vResp', x => ctl.response = x);
  bind('sSpeed', 'vSpeed', x => ctl.speed = x);
  bind('sFog', 'vFog', x => ctl.fog = x);
  bind('sBeat', 'vBeat', x => audio.beatThreshold = x);
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    const k = e.key.toLowerCase();
    if (k === 'h'){ barsVisible = !barsVisible; bars.classList.toggle('hidden', !barsVisible); srcBox.classList.toggle('hidden', !barsVisible); }
    if (k === 'f'){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
    if (k === 'r'){ toggleRecord(); }
    if (k === 's'){ renderer.domElement.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'nightcity-' + Date.now() + '.png'; a.click(); }); }
  });
  // hide cursor after 3 s idle while fullscreen
  let cursorTimer = 0;
  const wake = () => { document.body.classList.remove('nocursor'); clearTimeout(cursorTimer);
    if (document.fullscreenElement) cursorTimer = setTimeout(() => document.body.classList.add('nocursor'), 3000); };
  window.addEventListener('mousemove', wake); document.addEventListener('fullscreenchange', wake);
  window.__toggleRecord = toggleRecord;
}
function drawBars(a){
  if (!barsVisible) return;
  const v = [a.bass, a.mid, a.high, a.energy, a.beat];
  for (let i = 0; i < 5; i++) barEls[i].style.height = (2 + 58*Math.min(1, v[i])) + 'px';
}

// ---------- loop: 60 fps cap, pause when hidden / unfocused ----------
let paused = false;
const setPaused = (p) => { paused = p; };
document.addEventListener('visibilitychange', () => setPaused(document.hidden));
if (!TEST) {
  window.addEventListener('blur',  () => setPaused(true));
  window.addEventListener('focus', () => setPaused(false));
}

const t0 = performance.now();
let lastRender = 0, fpsCount = 0, fpsT = performance.now(), msAcc = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (paused) return;
  if (now - lastRender < 1000/60 - 2.5) return;   // 60 fps cap
  const dt = lastRender ? now - lastRender : 16.7;
  lastRender = now;

  const t = TEST ? FIXED_TIME : (now - t0) / 1000;
  uniforms.iTime.value = t;
  const a = currentAudio(t, dt/1000);
  uniforms.uAudio.value.set(a.bass, a.mid, a.high, a.energy);
  uniforms.uBeat.value = a.beat;
  drawBars(a);
  const baseSpeed = 3.0;
  camZ = TEST ? parseFloat(params.get('camz') ?? '44') : camZ + (dt/1000) * baseSpeed * ctl.speed * (0.6 + 0.8*a.energy);
  uniforms.uCamZ.value = camZ;
  uniforms.uParams.value.set(ctl.response, ctl.fog, ctl.speed, 0);
  searchAngle = TEST ? parseFloat(params.get('search') ?? '-1.75') : searchAngle + (dt/1000) * (2*Math.PI/20) * (0.6 + 1.2*a.bass);
  uniforms.uSearch.value = searchAngle;
  {
    const tp = (now - t0) / 1000;
    const fi = Math.min(1, Math.max(0, (tp - fadeInAt) / 2.0)), fo = Math.min(1, Math.max(0, (fadeOutAt - tp) / 1.5));
    const f = Math.min(fi, fo); uniforms.uMood.value.w = TEST ? 1 : f*f*(3 - 2*f);
  }
  { // searchlight strength at the camera (same maths as beamAt in GLSL), drives the lit rain in post
    const S = [14, 92, camZ + 200], ct = Math.cos(0.44), st = Math.sin(0.44);
    const D = [Math.cos(searchAngle)*ct, -st, Math.sin(searchAngle)*ct];
    const v = [-0.9 - S[0], 1.5 - S[1], camZ - S[2]]; const s = v[0]*D[0] + v[1]*D[1] + v[2]*D[2];
    let bm = 0;
    if (s > 0){ const px = v[0]-D[0]*s, py = v[1]-D[1]*s, pz = v[2]-D[2]*s; const dist = Math.hypot(px, py, pz); const rad = 1.2 + 0.035*s;
      const k = Math.min(1, Math.max(0, (rad - dist) / (rad*0.65))); bm = k*k*(3-2*k) / (1 + 0.00012*s*s); }
    uniforms.uMood.value.z = bm;
  }
  if (TEST){ const ba = parseFloat(params.get('beat') ?? '99'); uniforms.uBeatAge.value.set(ba, 99); uniforms.uFlashAge.value = parseFloat(params.get('flash') ?? '99'); }
  else { uniforms.uBeatAge.value.set(t - beatTimes[0], t - beatTimes[1]); uniforms.uFlashAge.value = t - flashTime; }
  postU.uBloomThr.value = 0.8 - 0.4*a.bass;   // heavy bass: bigger halos
  const rainEnv = TEST ? 0.5 : (0.15 + 0.85*Math.pow(Math.sin(t/17), 2)) * (0.5 + 0.5*a.high);   // drizzle -> downpour -> drizzle, highs on top
  postU.uRain.value = rainEnv;
  uniforms.uMood.value.x = rainEnv;
  slowEnergy += ((a.energy) - slowEnergy) * (dt/1000) / 3.0;   // ~3 s follower
  uniforms.uMood.value.y = TEST ? 1 : Math.min(1, Math.max(0, slowEnergy*1.6));

  renderer.setRenderTarget(rt);
  renderer.render(sceneRT, cam);
  postU.uTime.value = t; postU.uFrame.value = (TEST && !REC) ? 0 : stats.frames;
  postU.uMode.value = 0; postU.uRes.value.set(rtBright.width, rtBright.height);
  renderer.setRenderTarget(rtBright);
  renderer.render(scenePost, cam);                 // bright extraction (+ auto mipmaps)
  postU.uMode.value = 1; postU.uRes.value.set(window.innerWidth, window.innerHeight);
  renderer.setRenderTarget(null);
  renderer.render(scenePost, cam);                 // composite to screen

  fpsCount++; msAcc += dt; stats.frames++;
  if (now - fpsT >= 1000) {
    stats.fps = Math.round(fpsCount * 1000 / (now - fpsT));
    stats.frameMs = +(msAcc / fpsCount).toFixed(2);
    fpsCount = 0; msAcc = 0; fpsT = now;
    adaptScale(stats.fps);
    statLine.textContent = `fps ${stats.fps} · scale ${renderScale.toFixed(2)} · ${stats.rtW}x${stats.rtH}`;
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
