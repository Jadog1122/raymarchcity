<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>night city</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font:12px/1.4 -apple-system,Helvetica,Arial,sans-serif;color:#cfd3d8}
  canvas{display:block;width:100vw;height:100vh}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<script id="vert" type="x-shader/x-vertex">
precision highp float;
in vec3 position;
void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
out vec4 fragColor;

uniform float iTime;
uniform vec2  iResolution;   // render target size in pixels
uniform vec4  uAudio;        // bass, mid, high, energy  (0..1)
uniform float uBeat;         // 1 on beat, exp decay
uniform float uScale;        // renderScale (for debug)

// ---------- hashes ----------
float hash11(float n){ return fract(sin(n)*43758.5453123); }
float hash21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
vec2  hash22(vec2 p){ float h = hash21(p); return vec2(h, hash21(p + h + 7.1)); }

// ---------- scene (stubs, filled in M1) ----------
float map(vec3 p){
  return 1e5;
}
vec2 raymarch(vec3 ro, vec3 rd){
  return vec2(-1.0, 0.0);
}
vec3 calcNormal(vec3 p){
  return vec3(0.0, 1.0, 0.0);
}
vec3 render(vec3 ro, vec3 rd, vec2 uv){
  // M0: slow gradient so the verify loop has something to look at
  float t = iTime * 0.1;
  vec3 top = vec3(0.02, 0.03, 0.06);
  vec3 hor = vec3(0.35, 0.28, 0.24);
  vec3 col = mix(hor, top, smoothstep(-0.2, 0.9, uv.y + 0.15*sin(t)));
  col += 0.08 * vec3(0.9, 0.8, 0.7) * exp(-6.0*abs(uv.y + 0.1)) * (0.6 + 0.4*uAudio.w);
  col += 0.05 * uBeat;
  return col;
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = (2.0*frag - iResolution) / iResolution.y;
  vec3 ro = vec3(0.0);
  vec3 rd = normalize(vec3(uv, 1.6));
  vec3 col = render(ro, rd, uv);
  // NaN / Inf guard -> pure magenta
  if (any(isnan(col)) || any(isinf(col))) col = vec3(1.0, 0.0, 1.0);
  else col = pow(clamp(col, 0.0, 1.0), vec3(1.0/2.2));
  fragColor = vec4(col, 1.0);
}
</script>

<script id="blit" type="x-shader/x-fragment">
precision highp float;
out vec4 fragColor;
uniform sampler2D tex;
uniform vec2 uScreen;
void main(){ fragColor = texture(tex, gl_FragCoord.xy / uScreen); }
</script>

<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const TEST = params.get('test') === '1';
const FIXED_TIME = 8.0;

// ---------- stats ----------
const stats = window.__stats = {
  fps: 0, frameMs: 0, shaderError: '', renderScale: 0.75,
  rtW: 0, rtH: 0, dpr: window.devicePixelRatio, gpu: '', test: TEST, frames: 0
};

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(1);            // canvas = CSS pixels; renderScale never multiplies DPR
renderer.autoClear = false;
renderer.debug.onShaderError = (gl, program, vs, fs) => {
  const log = [gl.getShaderInfoLog(vs), gl.getShaderInfoLog(fs), gl.getProgramInfoLog(program)].filter(Boolean).join('\n');
  stats.shaderError = (stats.shaderError + '\n' + log).trim();
  console.error('SHADER ERROR', log);
};
document.body.appendChild(renderer.domElement);
{
  const gl = renderer.getContext();
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  stats.gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
}

let renderScale = 0.75;
const rt = new THREE.WebGLRenderTarget(2, 2, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  depthBuffer: false, stencilBuffer: false, type: THREE.UnsignedByteType
});

const uniforms = {
  iTime:       { value: 0 },
  iResolution: { value: new THREE.Vector2(1, 1) },
  uAudio:      { value: new THREE.Vector4(0, 0, 0, 0) },
  uBeat:       { value: 0 },
  uScale:      { value: renderScale }
};
const vert = document.getElementById('vert').textContent;
const mainMat = new THREE.RawShaderMaterial({
  glslVersion: THREE.GLSL3, uniforms,
  vertexShader: vert, fragmentShader: document.getElementById('frag').textContent,
  depthTest: false, depthWrite: false
});
const blitUniforms = { tex: { value: rt.texture }, uScreen: { value: new THREE.Vector2(1, 1) } };
const blitMat = new THREE.RawShaderMaterial({
  glslVersion: THREE.GLSL3, uniforms: blitUniforms,
  vertexShader: vert, fragmentShader: document.getElementById('blit').textContent,
  depthTest: false, depthWrite: false
});
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quad = new THREE.PlaneGeometry(2, 2);
const sceneRT = new THREE.Scene(); sceneRT.add(new THREE.Mesh(quad, mainMat));
const sceneScreen = new THREE.Scene(); sceneScreen.add(new THREE.Mesh(quad, blitMat));

function resize(){
  const w = window.innerWidth, h = window.innerHeight;   // CSS pixels
  renderer.setSize(w, h, false);
  const rw = Math.max(2, Math.round(w * renderScale)), rh = Math.max(2, Math.round(h * renderScale));
  rt.setSize(rw, rh);
  uniforms.iResolution.value.set(rw, rh);
  blitUniforms.uScreen.value.set(w, h);
  stats.rtW = rw; stats.rtH = rh; stats.renderScale = renderScale; uniforms.uScale.value = renderScale;
}
window.addEventListener('resize', resize);
resize();
window.__setRenderScale = (s) => { renderScale = Math.min(1, Math.max(0.4, s)); resize(); };

// ---------- audio uniforms (M2 replaces the live path; test path stays) ----------
function syntheticAudio(t){
  return {
    bass:   0.5 + 0.5*Math.sin(t*1.3),
    mid:    0.5 + 0.5*Math.sin(t*0.7 + 1.0),
    high:   0.5 + 0.5*Math.sin(t*2.1 + 2.0),
    energy: 0.5 + 0.5*Math.sin(t*0.9 + 3.0),
    beat:   Math.pow(Math.max(0, Math.sin(t*2.0)), 4)
  };
}
function currentAudio(t){ return syntheticAudio(t); }   // live analyser plugs in here (M2)

// ---------- loop: 60 fps cap, pause when hidden / unfocused ----------
let paused = false;
const setPaused = (p) => { paused = p; };
document.addEventListener('visibilitychange', () => setPaused(document.hidden));
if (!TEST) {
  window.addEventListener('blur',  () => setPaused(true));
  window.addEventListener('focus', () => setPaused(false));
}

const t0 = performance.now();
let lastRender = 0, fpsCount = 0, fpsT = performance.now(), msAcc = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (paused) return;
  if (now - lastRender < 1000/60 - 2.5) return;   // 60 fps cap
  const dt = lastRender ? now - lastRender : 16.7;
  lastRender = now;

  const t = TEST ? FIXED_TIME : (now - t0) / 1000;
  uniforms.iTime.value = t;
  const a = currentAudio(t);
  uniforms.uAudio.value.set(a.bass, a.mid, a.high, a.energy);
  uniforms.uBeat.value = a.beat;

  renderer.setRenderTarget(rt);
  renderer.render(sceneRT, cam);
  renderer.setRenderTarget(null);
  renderer.render(sceneScreen, cam);

  fpsCount++; msAcc += dt; stats.frames++;
  if (now - fpsT >= 1000) {
    stats.fps = Math.round(fpsCount * 1000 / (now - fpsT));
    stats.frameMs = +(msAcc / fpsCount).toFixed(2);
    fpsCount = 0; msAcc = 0; fpsT = now;
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
