    if (i == 0 && j == 0){
      // A ribbon needs its mullions. At 0.44 the dark gap between bays was 6% of the cell, which bloom
      // closes completely, and a lit floor came out as one flat cream slab running the length of the
      // building — the brightest thing in the frame with nothing in it. The mullion is a real interval
      // now, and each bay carries its own brightness, because a floor is offices, not a light box.
      vec2 rect = cls == 1 ? smoothstep(0.05, 0.0, abs(d) - vec2(0.40, 0.30))
                           : smoothstep(0.04, 0.0, abs(d) - vec2(0.25, 0.30));
      if (cls == 1) b *= mix(0.40, 1.30, hash21(cc + id*3.31 + face));   // some bays brighter than the floor, not only dimmer
      // interior mapping: a shallow room behind the glass (back wall, ceiling lamp, dark floor) that parallaxes with the view
      float room = 1.0;
      if (b > 0.0 && t < 28.0){
        float du = (abs(n.x) > 0.5 ? rd.z : rd.x) / ws.x, dv = rd.y / ws.y, dw = max(-dot(rd, n), 0.02) / 1.1;   // room depth 1.1
        float tw = 1.0 / dw;                                                   // back wall
        float tu = ((du > 0.0 ? 0.5 : -0.5) - d.x) / (abs(du) > 1e-4 ? du : 1e-4);
        float tv = ((dv > 0.0 ? 0.5 : -0.5) - d.y) / (abs(dv) > 1e-4 ? dv : 1e-4);
        float tm = min(tw, min(tu, tv));
        float hv = hash21(cc*3.3 + id + 0.7);
        if (tm == tw){ float bv = d.y + dv*tm; room = mix(0.55, 1.0, bv + 0.5) * (0.7 + 0.6*hv); }         // back wall, lit from above
        else if (tm == tv){ room = dv > 0.0 ? 1.35 : 0.30; }                                                // ceiling (lamp) / floor
        else { room = 0.55; }
        float curtain = step(0.75, hash21(cc*1.9 + id + 5.5));                                              // some windows have blinds
        room = mix(room, 0.8, curtain);
        room = mix(room, 1.0, smoothstep(10.0, 28.0, t));                                                    // far away: flat, no hollow outlines
      }
      float sodium = hash21(floor(id / 6.0) + 0.5);                                              // per district: older blocks lean sodium-orange
      vec3 tint = mix(vec3(1.0, 0.70, 0.42), vec3(1.0, 0.82, 0.60), hash21(cc*0.37 + id*2.1));
      tint = mix(tint, vec3(1.0, 0.62, 0.30), 0.5*sodium);
      tint = mix(tint, vec3(1.0, 0.92, 0.80), step(2.0, b));       // the rare very-bright ones go near white
      emit = tint * b * room * rect.x * rect.y;
    }
    // Two-part spill. The original halo died inside its own window cell, so a lit window lit nothing
    // but itself and the wall between windows stayed pure black — which is most of a facade. The wide
    // tail is what actually paints the wall, and because it comes from the windows it is local: a
    // building with nothing switched on stays as black as it was.
    float Ld = length(d * vec2(1.0, ws.y / ws.x));
    leak += b * (0.80*smoothstep(1.1, 0.25, Ld) + 0.35*smoothstep(2.8, 0.7, Ld) * (1.0 - lod));
  }
  // 袖看板 glow: a blade hangs 34 cm off the facade, so the wall behind it wears its colour. Same
  // reasoning as the tube halo — this is the sign and not light transport, so it belongs to the sign,
  // and it is what makes a street of blades read as lit rather than as decals on a black wall.
  if (abs(n.x) > 0.5 && ht >= 6.0 && t < 95.0){
    float bFade = 1.0 - smoothstep(34.0, 92.0, t);      // a blade is sub-pixel long before 95 m; fade, do not cut
    float fs = n.x > 0.0 ? 1.0 : -1.0;
    float dnsB = districtOf(id) == 1 ? 0.85 : 0.18;
    vec2 ctrB = (id + 0.5)*CELL + lotOffset(id, hs);
    for (int k = 0; k < 3; k++){
      if (hash21(id + 140.0 + float(k)*11.0) >= dnsB) continue;
      float by = 2.9 + 2.5*float(k);
      if (by + 1.20 > ht) continue;
      if ((hash21(id + 151.0 + float(k)*3.0) < 0.5 ? -1.0 : 1.0) != fs) continue;
      float bz = (hash21(id + 163.0 + float(k)*5.0) - 0.5) * max(hs.y - 0.4, 0.0) * 1.4;
      float gl = smoothstep(0.60, 0.14, abs(p.z - ctrB.y - bz)) * smoothstep(2.0, 0.42, abs(p.y - by));
      if (gl <= 0.0) continue;
      float aiB = floor(hash21(id + 177.0 + float(k)*7.0) * 47.999);
      vec2 clB = vec2(mod(aiB, uSignGrid.x), floor(aiB / uSignGrid.x));
      vec3 bcB = max(mix(vec3(0.5), textureLod(tSigns, (clB + 0.5) / uSignGrid, 5.0).rgb, 1.6), vec3(0.0));
      emit += bcB * 0.26 * gl * bFade;
      leak += 0.30 * gl * bFade;
    }
  }
  // neon (cyberpunk districts): one vertical or horizontal strip per building, magenta or cyan, in a few districts only
  {
    float neonDensity = neonDistrict(id) ? 0.45 : 0.03;
    float nh = hash21(id + face + 21.0);
    float neonFade = 1.0 - smoothstep(60.0, 95.0, t);          // fade out; a hard cut-off draws a visible iso-distance arc
    if (nh < neonDensity && neonFade > 0.001){
      vec2 ctr = (id + 0.5)*CELL + lotOffset(id, hs);
      float uc = abs(n.x) > 0.5 ? p.z - ctr.y : p.x - ctr.x;
      float hw3 = abs(n.x) > 0.5 ? hs.y : hs.x;
      bool vert = hash21(id + 31.0) < 0.6;
      float u0 = (hash21(id + face + 41.0) - 0.5) * hw3 * 1.2;
      float y0 = 1.8 + 4.0*hash21(id + face + 51.0), len = 2.5 + 4.0*hash21(id + 61.0);
      float sx = vert ? smoothstep(0.16, 0.10, abs(uc - u0)) : smoothstep(0.0, 0.2, min(hw3*0.8 - abs(uc), len - abs(uc)));
      float sy = vert ? smoothstep(0.0, 0.2, min(p.y - y0, y0 + len - p.y)) : smoothstep(0.16, 0.10, abs(p.y - y0));
      float strip = sx * sy * step(0.0, min(hw3 - abs(uc), 1.0));
      // The glow a tube leaves on the wall it is bolted to. It cannot come from the area light — a
      // surface and an emitter lying in the same plane see each other edge-on — but it is there in
      // every photograph of a neon sign, so it belongs to the sign: the same mask, wider and dimmer.
      float halo = 0.0;
      {
        float hx = vert ? smoothstep(0.52, 0.09, abs(uc - u0)) : smoothstep(0.0, 0.42, min(hw3*0.8 - abs(uc) + 0.34, len - abs(uc) + 0.34));
        float hy = vert ? smoothstep(0.0, 0.42, min(p.y - y0 + 0.34, y0 + len - p.y + 0.34)) : smoothstep(0.52, 0.09, abs(p.y - y0));
        halo = max(hx * hy * step(0.0, min(hw3 - abs(uc), 1.0)) - strip, 0.0);
      }
      vec3 neonCol = neonPalette(id);
      float flick = 0.85 + 0.15*step(0.5, hash21(vec2(floor(iTime*13.0), id.x + id.y)));     // cheap tube flicker
      flick *= 1.0 + 0.35*uAudio.z*step(0.6, hash21(id + 81.0));                            // some tubes pulse with the hi-hats
      emit += neonCol * (4.5 * strip + 0.24 * halo) * flick * neonFade;
      leak += 0.5 * strip * neonFade;
      neonSpill += neonCol * (strip + 0.5*halo) * neonFade;
    }
  }
  {                                                                   // holographic billboard on tall neon-district buildings
    vec2 ctr = (id + 0.5)*CELL + lotOffset(id, hs);
    float uc = abs(n.x) > 0.5 ? p.z - ctr.y : p.x - ctr.x;
    float hw4 = abs(n.x) > 0.5 ? hs.y : hs.x;
    float holoFade = 1.0 - smoothstep(85.0, 125.0, t);
    if (hash21(id + face + 94.0) < 0.5 && holoFade > 0.001){ float mk; vec3 hb = holoBoard(id, uc, p.y, hw4, ht, mk); emit += hb * holoFade; leak += 0.4*mk*holoFade; neonSpill += neonPalette(id) * mk * holoFade; }
  }
  // ground floor: a wide, dim shop front on some faces (the only light at street level besides the lamps)
  float shopFade = 1.0 - smoothstep(55.0, 85.0, t);
  if (p.y > 0.4 && p.y < 1.15 && shopFade > 0.001 && hash21(id + face + 8.8) < 0.4){
    vec2 ctr = (id + 0.5)*CELL + lotOffset(id, hs);
    float uc = abs(n.x) > 0.5 ? p.z - ctr.y : p.x - ctr.x;
    float hw2 = abs(n.x) > 0.5 ? hs.y : hs.x;
    float win = smoothstep(0.0, 0.15, hw2*0.45 - abs(uc)) * smoothstep(0.45, 0.55, p.y) * smoothstep(1.15, 1.05, p.y);
    emit += vec3(1.0, 0.72, 0.45) * 0.12 * win * shopFade * (0.6 + 0.4*hash21(floor(vec2(uc*2.0, 0.0)) + id));
    leak += 0.25 * win * shopFade;
  }
  // facade relief: floor slabs, mullions between window columns, a lighter parapet at the top
  float slab = smoothstep(0.0, 0.09, f.y) * smoothstep(1.0, 0.91, f.y);
  float mull = smoothstep(0.0, 0.06, f.x) * smoothstep(1.0, 0.94, f.x);
  float parapet = 1.0 + 0.6*smoothstep(0.7, 0.0, ht - p.y);
  facade = mix(mix(0.36, 1.0, slab*mull) * parapet, 0.9, lod);   // joints read as dark lines, which costs no light
  // The joints have to bend the light, not just darken the paint: a wall this dark multiplied by 0.5
  // is still the same black, which is why the facades read as flat cut-outs with windows floating on
  // them. Tilting the normal on each side of a joint gives every slab line and every mullion a lit
  // edge and a shaded one, and that is the whole of what makes a night facade look like concrete.
  {
    vec3 T = abs(n.x) > 0.5 ? vec3(0.0, 0.0, 1.0) : vec3(1.0, 0.0, 0.0);          // along the wall
    float dU = smoothstep(0.88, 1.0, f.x) - smoothstep(0.12, 0.0, f.x);           // the two cheeks of a mullion
    float dV = smoothstep(0.90, 1.0, f.y) - smoothstep(0.10, 0.0, f.y);           // and of a floor-slab groove
    vec2 fq = fract(vec2(u, p.y) / (ws * 0.5) + 0.5);                             // a finer joint: precast panels
    dU += 0.5 * (smoothstep(0.94, 1.0, fq.x) - smoothstep(0.06, 0.0, fq.x));
    dV += 0.5 * (smoothstep(0.94, 1.0, fq.y) - smoothstep(0.06, 0.0, fq.y));
    // Every window is a hole in a wall, not a sticker on one. A dark reveal around each pane, with its
    // two sides tilted opposite ways so they catch light from opposite directions — without it the
    // panes read as lit rectangles pasted onto the facade, which is exactly what they looked like.
    vec2 inw = cls == 1 ? vec2(0.40, 0.30) : vec2(0.25, 0.30);
    vec2 dc = f - 0.5, e0 = abs(dc) - inw, e1 = e0 - 0.085;
    float pane  = min(smoothstep(0.015, 0.0, e0.x), smoothstep(0.015, 0.0, e0.y));
    float outer = min(smoothstep(0.015, 0.0, e1.x), smoothstep(0.015, 0.0, e1.y));
    float reveal = clamp(outer - pane, 0.0, 1.0);
    dU += reveal * sign(dc.x) * 0.9;
    dV += reveal * sign(dc.y) * 0.9;
    facade *= 1.0 - 0.45 * reveal * (1.0 - lod);
    float rs = (cls == 1 ? 0.09 : 0.52) * (1.0 - lod);                            // glass is flat; masonry is not
    nrel = normalize(n - (T*dU + vec3(0.0, 1.0, 0.0)*dV) * rs);
  }
  float ring = 1.0 + 1.5*gRing;
  leak = mix(leak * 0.22, 0.04 * prof * occ * ring, lod);
  float far = 0.45 + 2.2*pow(hash21(id + 88.3), 2.0);            // some towers read bright from a distance, most do not
  return mix(emit, vec3(1.0, 0.76, 0.52) * 0.10 * prof * occ * ring * far, lod) * 2.2;
}

// What a vertical window sees when it is not worth tracing: sky above the horizon, and below it the
// dark mass of the city opposite with a little warm light in it.
vec3 envReflect(vec3 rr){
  vec3 c = skyColor(rr);
  float below = smoothstep(0.06, -0.30, rr.y);
  vec3 city = vec3(0.020, 0.026, 0.038) + vec3(1.0, 0.72, 0.45) * 0.030;   // the lit city opposite is what a glass tower mostly shows at night
  return mix(c, city, below);
}
// Compact shading for what a mirror sees. GLSL has no recursion, so this cannot call shade():
// key light, ambient, lit windows and fog are enough to read as a reflection.
vec3 shadeReflected(vec3 p, vec3 n, vec3 rd, float t, int mat){
  vec3 alb = (mat == 2) ? vec3(0.010, 0.012, 0.015) : vec3(0.044, 0.052, 0.064);
  if (mat == 7) alb = vec3(0.055, 0.058, 0.062);
  vec3 emit = vec3(0.0);
  if (mat == 1 || mat == 5){
    vec2 bid = floor(p.xz / CELL);
    int cls = matClassOf(bid);
    if (cls == 1) alb = vec3(0.018, 0.024, 0.036); else if (cls == 2) alb = vec3(0.060, 0.052, 0.046);
    float lk, fc; vec3 ns, nr;
    emit = windowLight(p, n, rd, t, lk, fc, ns, nr);
    alb *= fc;
  }
  vec3 L = MOON_DIR;
  float dif = mix(pow(0.5 + 0.5*dot(n, L), 2.0), max(dot(n, L), 0.0), 0.7);
  vec3 col = alb * (vec3(0.45, 0.62, 0.90)*0.25*dif + vec3(0.02, 0.035, 0.06)*(0.55 + 0.45*n.y));
  col += alb * lampLight(p, n) + alb * neonLight(p, n, 0.0) * 14.0 + emit;
  float dens = 0.009 * uParams.y * (0.55 + 0.9*vnoise((p.xz + vec2(iTime*0.6, iTime*0.25)) * 0.025)) * exp(-0.06*max(p.y, 0.0));
  return mix(col, skyBase(rd) * vec3(0.75, 0.95, 1.2), 1.0 - exp(-dens*t));
}
vec3 shade(vec3 p, vec3 n, vec3 rd, float t, int mat, bool cheap){
  if (mat == 3) return vec3(1.0, 0.10, 0.06) * 5.0 * blink();        // aviation beacon
  if (mat == 6) return vec3(1.0, 0.76, 0.50) * (n.y > 0.3 ? 0.10 : 2.5);   // lamp head: emits sideways/down, dark from above
  vec3 alb = (mat == 2) ? vec3(0.010, 0.012, 0.015) : vec3(0.040, 0.055, 0.075);   // wet asphalt is black; facades deep teal-blue
  if (mat == 5) alb *= 0.8;
  float rough = 1.0, glassy = 0.0, facadeRelief = 1.0;
  vec3 wEmit = vec3(0.0), neon = vec3(0.0); float leak = 0.0;
  if (mat == 7){ alb = vec3(0.055, 0.058, 0.062); rough = 0.45; glassy = 0.25; }   // galvanised metal: pipes, tanks, bridges
  if (mat == 9){                                                                  // vending machine: a lit box on the pavement
    vec2 bid = floor(p.xz / CELL);
    float panel = step(0.5, abs(n.x)) * step(0.28, p.y - 0.12) * step(p.y, 1.52);
    vec3 lit = mix(vec3(0.95, 0.98, 1.0), vec3(1.0, 0.58, 0.30), step(0.5, hash21(bid + 244.0)));
    float slot = 1.0 - 0.45*step(0.86, fract(p.y * 3.1));                          // product shelves banding the front
    vec3 outc = mix(vec3(0.05, 0.052, 0.056), lit * 1.15 * slot, panel) + vec3(0.015);
    float fd = 0.009 * uParams.y * exp(-0.06*max(p.y, 0.0));
    return mix(outc, skyBase(rd) * vec3(0.75, 0.95, 1.2), 1.0 - exp(-fd*t));
  }
  if (mat == 11){ alb = vec3(0.034, 0.032, 0.036); rough = 0.85; glassy = 0.0; }   // a person: almost a silhouette at night
  if (mat == 10){                                                                 // car: dark glossy shell with its lamps lit
    alb = vec3(0.048, 0.050, 0.058); rough = 0.22; glassy = 0.55;
    if (abs(n.z) > 0.5){
      vec2 bid0 = floor(p.xz / CELL);
      for (int j = 0; j < 6; j++){
        vec2 bid = bid0 + vec2(0.0, float(j / 2) - 1.0);
        int k = j & 1;
        vec3 cc, ce; float dr;
        if (!carOf(bid, k, cc, ce, dr)) continue;
        vec3 q = abs(p - cc) - ce;
        if (max(q.x, max(q.y, q.z)) > 0.06) continue;
        float band = step(0.30, p.y - (cc.y - ce.y)) * step(p.y, cc.y + ce.y*0.25);
        float outer = step(0.42, abs(p.x - cc.x) / ce.x);                          // lamps sit at the corners
        float head = step(0.0, n.z * dr), tail = 1.0 - head;
        wEmit += (vec3(1.0, 0.94, 0.84) * 3.4 * head + vec3(1.0, 0.07, 0.03) * 1.1 * tail) * band * outer;
        break;
      }
    }
  }
  if (mat == 12){                                                                 // rooftop board, wall panel or pavement board
    vec2 uvp; float ai = hsignSample(p, n, uvp);
    vec3 frame = vec3(0.09, 0.095, 0.10);
    if (ai < 0.0) return frame * 0.4;
    float ci = mod(ai, uHSignGrid.x), ri = floor(ai / uHSignGrid.x);
    vec2 auv = (vec2(ci, ri) + clamp(uvp, 0.012, 0.988)) / uHSignGrid;
    vec3 sc = texture(tHSigns, auv).rgb;
    float printed = step(0.35, max(abs(n.z), abs(n.x)) * (1.0 - abs(n.y)));
    float lit = hash21(floor(p.xz / CELL) + 391.0 + ai) < 0.16 ? 0.12 : 1.0;
    vec3 outc = mix(frame * 0.5, sc * 0.92 * lit, printed);
    float fd = 0.009 * uParams.y * exp(-0.06*max(p.y, 0.0));
    return mix(outc, skyBase(rd) * vec3(0.75, 0.95, 1.2), 1.0 - exp(-fd*t));
  }
  if (mat == 13){                                                                 // tenant directory: one lit row per floor
    vec2 bid = floor(p.xz / CELL);
    vec3 c, e; int tk = 0;
    for (int k = 0; k < 2; k++){ vec3 cc, ee; if (tenantOf(bid, k, cc, ee)){ vec3 q = abs(p - cc) - ee; if (max(q.x, max(q.y, q.z)) < 0.04){ c = cc; e = ee; tk = k; break; } } }
    vec2 uvp = panelUV(p, c, e, n);
    float rows = 5.0, row = floor(clamp(uvp.y, 0.0, 0.999) * rows);
    float vin = fract(uvp.y * rows);
    vec3 outc = vec3(0.055, 0.058, 0.062);
    float gap = smoothstep(0.06, 0.14, vin) * smoothstep(0.94, 0.86, vin);        // a dark rule between rows
    float printed = step(0.35, abs(n.x));
    if (printed > 0.5 && gap > 0.0){
      float ai = floor(hash21(bid + 393.0 + row * 7.0) * 47.999);
      float ci = mod(ai, uHSignGrid.x), ri = floor(ai / uHSignGrid.x);
      vec2 auv = (vec2(ci, ri) + clamp(vec2(uvp.x, vin), 0.02, 0.98)) / uHSignGrid;
      float on = hash21(bid + 395.0 + row * 3.0) < 0.78 ? 1.0 : 0.10;             // a floor or two is vacant
      outc = mix(outc, texture(tHSigns, auv).rgb * 0.70 * on, gap);
    }
    float fd = 0.009 * uParams.y * exp(-0.06*max(p.y, 0.0));
    return mix(outc, skyBase(rd) * vec3(0.75, 0.95, 1.2), 1.0 - exp(-fd*t));
  }
  if (mat == 14){                                                                 // 提灯: paper glowing from inside
    float cap = step(0.5, abs(n.y));
    vec3 paper = vec3(1.0, 0.20, 0.12) * 1.15;
    float ribs = 0.85 + 0.15*sin(p.y * 90.0);                                     // bamboo ribs banding the paper
    vec3 outc = mix(paper * ribs, vec3(0.05, 0.04, 0.04), cap);
    float fd = 0.009 * uParams.y * exp(-0.06*max(p.y, 0.0));
    return mix(outc, skyBase(rd) * vec3(0.75, 0.95, 1.2), 1.0 - exp(-fd*t));
  }
  if (mat == 8){                                                                  // shop sign: printed faces glow, edges are frame
    vec2 suv; float ai = signSample(p, n, suv);
    vec3 frame = vec3(0.10, 0.105, 0.11);
    if (ai < 0.0) return frame * 0.4;
    float ci = mod(ai, uSignGrid.x), ri = floor(ai / uSignGrid.x);
    vec2 auv = (vec2(ci, ri) + clamp(suv, 0.012, 0.988)) / uSignGrid;
    vec3 sc = texture(tSigns, auv).rgb;
    float printed = step(0.5, abs(n.z));
    float lit = hash21(floor(p.xz / CELL) + 191.0 + ai) < 0.14 ? 0.10 : 1.0;       // a few are dark
    float flick = 1.0 - 0.10*step(0.88, hash21(vec2(floor(iTime*9.0), ai)));
    vec3 outc = mix(frame * 0.5, sc * 1.3 * lit * flick, printed);
    float fogd = 0.009 * uParams.y * exp(-0.06*max(p.y, 0.0));
    return mix(outc, skyBase(rd) * vec3(0.75, 0.95, 1.2), 1.0 - exp(-fogd*t));
  }
  // The relief normal below is for diffuse light only. A mirror and a 320-exponent highlight magnify
  // any tilt several times over, so feeding them the joints turns a neon sign opposite into speckle.
  vec3 nGeo = n;
  if (mat == 1 || mat == 5){
    vec2 bid = floor(p.xz / CELL);
    int cls = matClassOf(bid);
    if (cls == 1){ alb = vec3(0.030, 0.038, 0.052); rough = 0.10; glassy = 1.0; }        // glass curtain wall: dark, and lives off what it reflects
    else if (cls == 2){ alb = vec3(0.060, 0.052, 0.046); rough = 1.0; glassy = 0.0; }    // brick / stone: warmer, matte
    else { alb = vec3(0.044, 0.052, 0.064); rough = 0.9; glassy = 0.03; }                 // concrete
    alb *= (0.75 + 0.5*hash21(bid + 3.3)) * mix(vec3(0.92, 1.0, 1.10), vec3(1.06, 1.0, 0.94), hash21(bid + 6.1));   // per-building value + hue drift
    if (cls != 1 && n.y < 0.5 && t < 70.0){                                   // weathering: grime washes down masonry from every ledge
      float uu = abs(n.x) > 0.5 ? p.z : p.x;
      float cols = vnoise(vec2(uu * 2.4 + bid.x * 3.7, bid.y * 1.9));         // which bays are dirty
      float drip = fract(p.y / 2.4);
      float grime = smoothstep(0.52, 0.95, cols) * smoothstep(0.0, 0.45, drip) * (1.0 - smoothstep(0.55, 1.0, drip));
      grime += 0.35 * smoothstep(14.0, 1.0, p.y) * smoothstep(0.45, 0.9, cols);   // heavier near the street
      alb *= 1.0 - 0.34 * clamp(grime, 0.0, 1.0);
      alb *= mix(vec3(1.0), vec3(1.04, 0.99, 0.93), 0.5*clamp(grime, 0.0, 1.0));  // grime is warmer than the stone
    }
    if (cls != 1){
      // Precast concrete, tile and brick are never one value, and a wall of one value has nothing for
      // the relief to sit on. One hash per panel, plus the vertical pilaster rhythm of a masonry block.
      float uu2 = abs(n.x) > 0.5 ? p.z : p.x;
      alb *= 0.76 + 0.48*hash21(floor(vec2(uu2 * 0.6, p.y * 0.87)) + bid*17.0);
      if (cls == 2) alb *= 0.90 + 0.20*smoothstep(0.35, 0.65, fract(uu2 * 0.34 + hash21(bid + 5.5)));
    }
    float facade; vec3 nrel;
    wEmit = windowLight(p, n, rd, t, leak, facade, neon, nrel);
    alb *= facade;
    facadeRelief = facade;
    n = nrel;
  }
  vec3 L = MOON_DIR;
  float hl = 0.5 + 0.5*dot(n, L);
  float dif = mix(hl*hl, max(dot(n, L), 0.0), 0.7);
  vec3 keyCol = vec3(0.45, 0.62, 0.90)*0.25;                                  // moon: dim, cool
  // Urban ambient, and the reason the facades used to read as flat cut-outs. A night wall is lit by two
  // very different things: the street below — shopfronts, signs, sodium, warm, and dying with height —
  // and the sky above, cold. It is the *difference* between them that makes relief legible, because the
  // top cheek of every slab groove takes one and the underside takes the other. A single directionless
  // ambient leaves the wall flat no matter what geometry is carved into it.
  // The ambient stays where it was: a uniform street glow lights every facade in the city equally,
  // which both flattens them again and leaves the frame with no true black in it. What reveals the
  // relief has to be *local* — the lamps, the signs and the lit windows on that particular wall — so
  // a block with nothing on it stays as black as it should be. Only the split matters here: sky from
  // above, a little warm from below, so the two cheeks of a groove are never the same colour.
  vec3 skyAmb = vec3(0.020, 0.034, 0.058) * (0.55 + 0.45*n.y);            // a downward face sees no sky
  vec3 bounce = vec3(1.0, 0.82, 0.66) * 0.030 * exp(-max(p.y - 1.0, 0.0) * 0.13) * clamp(0.45 - 0.7*n.y, 0.0, 0.85);
  float ao = cheap ? 0.8 : calcAO(p, n);
  // The bounce takes ao squared rather than the shared soft occlusion: it is light that has already
  // reflected once, so an alley or the underside of an elevated deck should get almost none of it,
  // while an open facade across the street gets all of it.
  vec3 col = alb * (keyCol*dif + skyAmb) * mix(0.15, 1.0, ao) + alb * bounce * ao * ao;
  col += alb * lampLight(p, n);
  if (mat == 2) col += carLights(p) * 0.03;
  // The gain belongs here, on surfaces, and not inside neonLight: the volumetric in-scatter calls the
  // same function, and putting it there lit every raindrop in the quarter along with the walls.
  col += alb * neonLight(p, n, cheap ? 0.0 : 1.0) * 14.0;                        // what the signs opposite put on this wall
  if (mat != 2) col += vec3(1.0, 0.70, 0.42) * 0.015 * ringBoost(p, 0.0);
  if (mat == 11){                                                              // a figure without an edge is a hole in the picture
    float rim = pow(1.0 - abs(dot(n, rd)), 3.0);
    col += rim * (lampLight(p, n) + neonLight(p, n, 0.0) * 1.2) * 0.10;
  }
  col += alb * vec3(0.9, 0.72, 0.52) * 0.02 * (0.55 + 0.45*n.y) * smoothstep(80.0, 0.0, p.y);   // city glow: the sky itself is a warm, dim light source
  float bm = beamAt(p);
  if (bm > 0.001){
    vec3 toL = normalize(searchOrigin() - p);
    float occ = 1.0;
    if (!cheap) for (int k = 1; k <= 4; k++){ float dk = mapCoarse(p + n*0.05 + toL * (0.6*float(k*k))); occ *= clamp(dk / 0.4, 0.0, 1.0); }   // real shadowing by the buildings
    col += alb * vec3(0.55, 0.72, 1.0) * 6.0 * bm * occ * max(dot(n, toL), 0.0);
  }
  {
    float shin = mix(6.0, 320.0, 1.0 - rough), sw = (1.0 - rough) * (0.25 + 0.75*glassy);
    if (sw > 0.01){
      vec3 H = normalize(L - rd);
      col += keyCol * pow(max(dot(nGeo, H), 0.0), shin) * sw * 2.2;                    // moon glint
      if (bm > 0.001){                                                                  // the searchlight sweeping across glass
        vec3 Hs = normalize(normalize(searchOrigin() - p) - rd);
        col += vec3(0.55, 0.72, 1.0) * pow(max(dot(nGeo, Hs), 0.0), shin) * sw * bm * 14.0;
      }
      col += neon * sw * 0.5;                                                           // neon glints back off the cladding
    }
    if (mat == 1 || mat == 5){                                                          // mullions break up a mirror and catch light themselves
      col += vec3(0.45, 0.55, 0.75) * 0.012 * glassy * clamp(1.0 - facadeRelief, 0.0, 1.0);
    }
  }
  col += alb * mix(vec3(1.0, 0.70, 0.42), neon, clamp(length(neon)*2.0, 0.0, 1.0)) * leak * 1.8;   // spill: every lit window paints its own patch of wall
  // Reflective cladding. Glass mirrors the sky and, close up, the building across the street;
  // metal takes a duller version of the same. Windows still glow through, so emission is added after.
  if (glassy > 0.01){
    vec3 rr = reflect(rd, nGeo);
    vec3 refl = envReflect(rr);
    if (!cheap && glassy > 0.5 && t < 45.0 && uPath > 0.5){       // near glass: one real bounce
      float th = traceDDA(p + n*0.03, rr, 55.0);
      vec3 rn = gHitN;                                            // consume it before map() runs
      if (th > 0.0){ vec3 q = p + n*0.03 + rr*th; map(q); int m2 = gMat; refl = shadeReflected(q, rn, rr, th + t, m2); }
    }
    float cosI = max(dot(-rd, n), 0.0);
    float F0 = mix(0.04, 0.09, glassy);                                    // coated architectural glass is more reflective than plain
    float F = (F0 + (1.0 - F0)*pow(1.0 - cosI, 5.0)) * mix(0.35, 1.0, 1.0 - rough);
    col = mix(col, refl * mix(0.6, 1.0, facadeRelief), clamp(F * glassy, 0.0, 0.9));
  }
  col += wEmit;
  float roY = p.y - rd.y*t;
  float midY = max(0.5*(roY + p.y), 0.0);
  float bank = 0.55 + 0.9*vnoise((p.xz + vec2(iTime*0.6, iTime*0.25)) * 0.025);   // drifting fog banks between the blocks
  float dens = 0.009 * uParams.y * bank * exp(-0.06*midY);
  float fog = 1.0 - exp(-dens*t);
  // The fog used to go up x6 on a strike, which washed the whole distant city pale grey: it read as an
  // overcast afternoon, not lightning. The sky behind the skyline is what should jump, so that the
  // buildings go to silhouette instead of dissolving.
  vec3 fogCol = skyBase(rd) * vec3(0.75, 0.95, 1.2) * (1.0 + 0.9*flash());
  { vec2 idf = floor(p.xz / CELL); if (neonDistrict(idf)) fogCol += neonPalette(floor(idf / 3.0)) * 0.012; }   // neon districts tint their own haze
  col = mix(col, vec3(dot(col, vec3(0.3, 0.5, 0.2))), 0.5*fog);              // distance desaturation
  return mix(col, fogCol, fog);
}

// single scattering of the searchlight along the view ray, sampled where the ray passes the beam
vec3 volumetric(vec3 ro, vec3 rd, float tmax, vec2 frag){
  // A uniform march. The old version integrated a window around the ray's closest approach to the beam
  // axis, which degenerates when you look straight up the beam: every branch guarding that case drew its
  // own hard-edged circle around the lamp. Marching the whole visible span has no such boundaries.
  vec3 S = searchOrigin();
  float tEnd = min(tmax, 300.0);
  float dt = tEnd / 12.0;
  float t = dt * ign(frag);
  float acc = 0.0;
  for (int i = 0; i < 12; i++){
    vec3 p = ro + rd*t;
    float bm = beamAt(p);
    if (bm > 0.002){
      vec3 toL = normalize(S - p);
      float sh = distance(p, S) < 5.0 ? 1.0                                                  // never shadow the lamp with itself
               : clamp(mapCoarse(p) / 1.5, 0.0, 1.0) * clamp(mapCoarse(p + toL*6.0) / 3.0, 0.0, 1.0);
      acc += bm * sh * exp(-0.04*max(p.y, 0.0)) * dt;
    }
    t += dt;
  }
  vec3 vS = S - ro; float dS = max(length(vS), 1e-3);                                        // the housing glows through the rain
  float ca = dot(rd, vS / dS);
  if (ca > 0.0) acc += 4.0 * exp(-0.004*dS) / (1.0 + 900.0*max(0.0, 1.0 - ca*ca));
  return vec3(0.55, 0.72, 1.0) * min(acc, 7.0) * 0.019 * uParams.y;
}


vec3 render(vec3 ro, vec3 rd, vec2 uv){
  vec2 h = raymarch(ro, rd);
  gDepth = h.x > 0.0 ? h.x : MAXD;
  vec3 col = skyColor(rd) * (1.0 + 1.8*flash());
  if (h.x > 0.0){
    float t = h.x;
    vec3 p = ro + rd*t;
    int mat = gMat;                       // read before anything else touches the globals
    vec3 n = uPath > 0.5 ? gHitN : calcNormal(p);   // the reference sphere-trace has no face to report
    col = shade(p, n, rd, t, mat, false);
    if (mat == 2){                        // wet ground: one bounce, no AO / volumetrics
      float rmw = mod(floor(p.z / CELL), 7.0);
      bool water = (rmw == 3.0 || rmw == 4.0);
      float wet = 0.65*vnoise(p.xz*0.35) + 0.35*vnoise(p.xz*0.9 + 3.1);
      float puddle = water ? 1.0 : smoothstep(0.52, 0.62, wet);            // puddles: mirror
      float dry = water ? 0.0 : smoothstep(0.42, 0.30, wet);               // dry patches: rough, no reflection
      col *= 1.0 + 0.6*dry;                                                // dry asphalt is a little lighter
      vec3 nr = n;                        // rain ripples
      if (water){                         // river: long waves along the view direction -> lights stretch into vertical streaks
        nr.z += 0.09*sin(p.x*1.3 + p.z*2.9 + iTime*1.1) + 0.05*sin(p.x*3.7 - p.z*5.1 + iTime*1.9) + 0.03*sin(p.z*9.0 + iTime*2.7);
        nr.x += 0.015*sin(p.z*4.0 + p.x*2.0 + iTime*1.5);
        col *= 0.4;
      }
      nr.xz += (0.003 + 0.016*puddle*uMood.x) * vec2(sin(p.x*6.1 + iTime*2.3) + sin(p.z*4.7 - iTime*1.9), sin(p.z*5.3 + iTime*2.1) + sin(p.x*3.9 - iTime*1.6));
      { float rough = (1.0 - 0.85*puddle) * (1.0 - dry);                  // damp asphalt: rough reflection, converged by TAA
        float taaOn = step(1e-4, length(uJitter));
        vec2 jr = (hash22(gl_FragCoord.xy + fract(iTime)*17.0) - 0.5) * 0.10 * rough * taaOn; nr.xz += jr; }
      n = normalize(nr);
      vec3 rr = reflect(rd, n);
      vec3 rp = p + n*0.02;
      float t2 = 0.0, hit = -1.0;
      vec3 rn2 = vec3(0.0, 1.0, 0.0);
      if (uPath > 0.5){ hit = traceDDA(rp, rr, 160.0); rn2 = gHitN; if (hit > 0.0) map(rp + rr*hit); }
      else for (int i = 0; i < 10; i++){
        float d = map(rp + rr*t2);
        if (d < 0.002*t2 + 0.001){ hit = t2; break; }
        t2 += d;
        if (t2 > 160.0) break;
      }
      vec3 refl = skyColor(rr);
      if (hit > 0.0){
        int m2 = gMat;
        vec3 q = rp + rr*hit;
        refl = shade(q, uPath > 0.5 ? rn2 : calcNormal(q), rr, hit + t, m2, true);
      }
      float c = max(dot(-rd, n), 0.0);
      float fres = 0.04 + 0.96*pow(1.0 - c, 5.0);
      col = mix(col, refl, fres * mix(0.35, 0.95, puddle) * (1.0 - dry));
    }
  }
  col += volumetric(ro, rd, h.x > 0.0 ? h.x : MAXD, gl_FragCoord.xy);
  col += lampGlow(ro, rd, h.x > 0.0 ? h.x : MAXD);
  col += neonGlow(ro, rd, h.x > 0.0 ? h.x : MAXD);
  col += fogScatter(ro, rd, h.x > 0.0 ? h.x : MAXD, gl_FragCoord.xy);
  { // distant aircraft: a string of lights crossing the skyline now and then, with a blinking red beacon
    float tm = h.x > 0.0 ? h.x : MAXD;
    for (int k = 0; k < 2; k++){
      float off = float(k) * 137.0;
      float sp = 12.0 + 6.0*float(k);
      vec3 A = vec3(-170.0 + mod(iTime*sp + off, 340.0), 48.0 + 8.0*sin(iTime*0.15 + off), uCamZ + 120.0 + 70.0*sin(off));
      vec3 dir = vec3(1.0, 0.0, 0.0);
      for (int j = 0; j < 3; j++){
        vec3 Pj = A + dir * (float(j) - 1.0) * 2.2;
        vec3 v = Pj - ro; float b = dot(rd, v);
        if (b > 1.0 && b < tm){
          float ang = length(v - rd*b) / b;
          float g = 0.85 * exp(-ang*ang * 9.0e5) + 0.018 * exp(-ang*ang * 2.5e3);   // a point plus its haze, never a blob
          vec3 lc = j == 1 ? vec3(1.0, 0.15, 0.1) * step(0.5, fract(iTime*1.3)) : vec3(0.95, 0.95, 1.0);
          col += lc * g * exp(-0.004*b);
        }
      }
    }
  }
  col = rainLayers(ro, rd, h.x > 0.0 ? h.x : MAXD, col, gl_FragCoord.xy);
  return col;
}

void main(){
  vec2 frag = gl_FragCoord.xy + uJitter;                 // sub-pixel jitter for temporal supersampling
  vec2 uv = (2.0*frag - iResolution) / iResolution.y;
  // low, slow dolly down the street, aimed a little toward the landmark; every 12 s a 3 deg tilt up and back
  vec3 ro = uCamRo, rt = uCamRt, up = uCamUp, fw = uCamFw; float focal = uFocal;   // camera: one source of truth (JS), shared with the post pass
  vec3 rd = normalize(uv.x*rt + uv.y*up + focal*fw);
  gRo = ro;
  vec3 col = render(ro, rd, uv);
  // NaN / Inf guard -> pure magenta. Output is linear HDR; alpha carries depth for the post pass.
  if (any(isnan(col)) || any(isinf(col))) col = vec3(1.0, 0.0, 1.0);
  fragColor = vec4(max(col, 0.0), gDepth / MAXD);
}

<script id="post" type="x-shader/x-fragment">
precision highp float;
out vec4 fragColor;
uniform sampler2D tScene, tBright, tHistory, tTaaHist, tText;
uniform vec3  uCamRo, uCamRt, uCamUp, uCamFw, uPrevRo, uPrevRt, uPrevUp, uPrevFw;
uniform float uFocal, uPrevFocal, uTaa;
uniform vec2  uJitter;
uniform vec2  uRes, uBrightRes;
uniform int   uMode;                 // 0 bright extraction, 1 composite
uniform float uTime, uFrame, uBloomThr, uBloomStr, uRain, uExposure, uAA, uBlend, uRig, uFocus, uAperture;
uniform vec4  uMood;

uint uhash(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float hash21(vec2 p){ uvec2 q = uvec2(ivec2(floor(p * 64.0))); uint h = uhash(q.x ^ uhash(q.y + 0x9e3779b9u)); return float(h) * (1.0 / 4294967296.0); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x + 0.03)) / (x*(2.43*x + 0.59) + 0.14), 0.0, 1.0); }

uniform vec2 uSceneRes;
float lumaTM(vec3 c){ c = aces(c * uExposure); return dot(c, vec3(0.299, 0.587, 0.114)); }
// FXAA (compact 3.11 variant) on the HDR scene, edges detected on tonemapped luma
vec4 fxaa(vec2 uv){
  vec2 inv = 1.0 / uSceneRes;
  vec4 cM = texture(tScene, uv);
  vec3 cNW = texture(tScene, uv + vec2(-1.0, -1.0)*inv).rgb, cNE = texture(tScene, uv + vec2(1.0, -1.0)*inv).rgb;
  vec3 cSW = texture(tScene, uv + vec2(-1.0,  1.0)*inv).rgb, cSE = texture(tScene, uv + vec2(1.0,  1.0)*inv).rgb;
  float lNW = lumaTM(cNW), lNE = lumaTM(cNE), lSW = lumaTM(cSW), lSE = lumaTM(cSE), lM = lumaTM(cM.rgb);
  float lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE))), lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));
  if (lMax - lMin < 0.04 || uAA < 0.5 || uTaa > 0.5) return cM;      // flat, disabled, or TAA already supersamples
  vec2 dir = vec2(-((lNW + lNE) - (lSW + lSE)), ((lNW + lSW) - (lNE + lSE)));
  float dirReduce = max((lNW + lNE + lSW + lSE) * (0.25 * 0.125), 1.0 / 128.0);
  float rcp = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);
  dir = clamp(dir * rcp, vec2(-8.0), vec2(8.0)) * inv;
  vec3 rgbA = 0.5 * (texture(tScene, uv + dir*(1.0/3.0 - 0.5)).rgb + texture(tScene, uv + dir*(2.0/3.0 - 0.5)).rgb);
  vec3 rgbB = rgbA*0.5 + 0.25 * (texture(tScene, uv - dir*0.5).rgb + texture(tScene, uv + dir*0.5).rgb);
  float lB = lumaTM(rgbB);
  vec3 out3 = (lB < lMin || lB > lMax) ? rgbA : rgbB;
  vec3 nMin = min(cM.rgb, min(min(cNW, cNE), min(cSW, cSE)));
  vec3 nMax = max(cM.rgb, max(max(cNW, cNE), max(cSW, cSE)));
  return vec4(clamp(out3, nMin, nMax), cM.a);                        // never brighter/darker than the taps it came from
}
// scene fetch with bokeh depth of field: circle of confusion from the distance to the focus plane, 12-tap disc; centre tap anti-aliased
vec3 fetchScene(vec2 uv){
  vec4 c = fxaa(uv);
  float d = c.a * 320.0;
  float coc = d > uFocus ? (1.0 - uFocus / d) * uAperture * 1.6 : (uFocus - d) / max(uFocus, 1.0) * uAperture * 2.0;   // far: gentle; near: stronger
  coc = clamp(coc, 0.0, 3.5);
  if (coc < 0.35) return c.rgb;
  vec3 s = c.rgb; float w = 1.0;
  for (int i = 0; i < 12; i++){
    float a = float(i) * 2.39996 + hash21(gl_FragCoord.xy + float(i)) * 0.3;
    float r = sqrt((float(i) + 0.5) / 12.0) * coc;
    vec2 o = vec2(cos(a), sin(a)) * r / uRes;
    vec4 t = texture(tScene, uv + o);
    float td = t.a * 320.0;
    float tw = (td < d + 2.0 || abs(td - uFocus) > abs(d - uFocus)) ? 1.0 : 0.3;       // don't let sharp background bleed into a blurred foreground
    s += t.rgb * tw; w += tw;
  }
  return mix(c.rgb, s / w, smoothstep(0.35, 1.1, coc));            // fade the blur in, so the threshold leaves no seam
}
vec3 tent(vec2 uv, float lod){
  vec2 ts = exp2(lod) / uBrightRes;
  vec3 s = textureLod(tBright, uv, lod).rgb * 4.0;
  s += (textureLod(tBright, uv + vec2(ts.x, 0.0), lod).rgb + textureLod(tBright, uv - vec2(ts.x, 0.0), lod).rgb
      + textureLod(tBright, uv + vec2(0.0, ts.y), lod).rgb + textureLod(tBright, uv - vec2(0.0, ts.y), lod).rgb) * 2.0;
  s += textureLod(tBright, uv + ts, lod).rgb + textureLod(tBright, uv - ts, lod).rgb
     + textureLod(tBright, uv + vec2(ts.x, -ts.y), lod).rgb + textureLod(tBright, uv + vec2(-ts.x, ts.y), lod).rgb;
  return s / 16.0;
}

// screen-space rain: two layers of slanted streaks
float rain(vec2 frag, float t){
  float wind = 0.06 + 0.10*sin(t / 9.0);                                   // gusts change the slant
  vec2 p = vec2(frag.x - frag.y*wind, frag.y);
  float acc = 0.0;
  for (int l = 0; l < 2; l++){
    float sc = l == 0 ? 1.0 : 1.8;
    vec2 q = p / sc;
    float colW = 3.0;
    float cx = floor(q.x / colW);
    float ph = hash21(vec2(cx, float(l)));
    float y = q.y + t*(700.0 + 500.0*ph) + ph*1000.0;
    float period = 260.0 + 600.0*hash21(vec2(cx, 7.0 + float(l)));
    float len = 30.0 + 40.0*ph;
    float f = mod(y, period);
    float streak = smoothstep(0.0, len*0.35, f) * (1.0 - smoothstep(len*0.35, len, f));
    float xw = 1.0 - smoothstep(0.25, 0.9, abs(fract(q.x/colW) - 0.5)*colW);
    float on = step(hash21(vec2(cx, floor(y/period) + float(l)*3.0)), uRain*0.7);
    acc += streak * xw * on * (l == 0 ? 0.30 : 0.16);
  }
  return acc;
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  if (uMode == 2){
    // Screen-resolution finish. Everything above runs at the render resolution, so dropping renderScale
    // actually buys frame time; only these cheap, resolution-native touches stay at full size.
    vec2 wv = uv + (vec2(hash21(vec2(uFrame, 1.0)), hash21(vec2(uFrame, 2.0))) - 0.5) * 0.7 / uRes;   // gate weave
    vec3 col = texture(tHistory, wv).rgb;
    { vec4 tx = texture(tText, uv); col = mix(col, tx.rgb, tx.a); }    // title and lyrics, printed into the frame
    float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
    vec2 gf = gl_FragCoord.xy + vec2(uFrame*7.31, uFrame*3.17);
    float g1 = hash21(gf) - 0.5, g2 = hash21(floor(gf*0.5) + 11.0) - 0.5, g3 = hash21(floor(gf*0.25) + 23.0) - 0.5;
    float gl = 0.6*g1 + 0.3*g2 + 0.1*g3;
    vec3 gc = vec3(hash21(gf + 31.0), hash21(gf + 47.0), hash21(gf + 59.0)) - 0.5;
    col += (gl + 0.35*gc) * 0.055 * mix(0.9, 0.35, lum);
    col *= 1.0 + 0.012*(hash21(vec2(uFrame, 3.0)) - 0.5);              // gate flicker
    float barH = max(0.0, (uRes.y - uRes.x / 2.39) * 0.5);             // 2.39:1 letterbox
    if (gl_FragCoord.y < barH || gl_FragCoord.y > uRes.y - barH) col = vec3(0.0);
    col *= uMood.w;                                                    // fade in / out
    if (any(isnan(col)) || any(isinf(col))) col = vec3(1.0, 0.0, 1.0);
    fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    return;
  }
  if (uMode == 3){                                                   // TAA: reproject last frame through the previous camera, clamp, blend
    vec4 cur = texture(tScene, uv);
    if (uTaa < 0.5){ fragColor = cur; return; }
    vec2 frag = gl_FragCoord.xy + uJitter;
    vec2 suv = (2.0*frag - uRes) / uRes.y;
    vec3 rd = normalize(suv.x*uCamRt + suv.y*uCamUp + uFocal*uCamFw);
    float depth = cur.a * 320.0;
    vec3 P = uCamRo + rd * depth;
    vec3 v = P - uPrevRo; float z = dot(v, uPrevFw);
    vec3 res = cur.rgb;
    if (z > 0.05){
      vec2 pv = vec2(dot(v, uPrevRt), dot(v, uPrevUp)) / z * uPrevFocal;
      vec2 puv = vec2(0.5 + 0.5*pv.x / (uRes.x / uRes.y), 0.5 + 0.5*pv.y);
      if (all(greaterThan(puv, vec2(0.002))) && all(lessThan(puv, vec2(0.998)))){
        vec4 h = texture(tTaaHist, puv);
        float hd = h.a * 320.0, dl = length(v);
        if (abs(hd - dl) < 0.05*dl + 0.4){                           // same surface as last frame
          vec3 mn = cur.rgb, mx = cur.rgb; vec2 inv = 1.0 / uRes;
          for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
            vec3 sN = texture(tScene, uv + vec2(float(i), float(j)) * inv).rgb; mn = min(mn, sN); mx = max(mx, sN); }
          res = mix(cur.rgb, clamp(h.rgb, mn, mx), 0.75);
        }
      }
    }
    fragColor = vec4(res, cur.a);
    return;
  }
  if (uMode == 0){
    vec3 c = texture(tScene, uv).rgb;
    float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
    float k = max(l - uBloomThr, 0.0) / max(l, 1e-4);
    fragColor = vec4(c * k, 1.0);
    return;
  }
  vec2 cv = uv - 0.5;
  float r = length(cv) / 0.7071;
  vec2 off = cv * r * r * (0.6 / uRes);                      // chromatic aberration, 0.6 px, corners only
  vec3 col = fetchScene(uv);
  float fr = smoothstep(0.3, 1.0, r);                         // fringe only toward the edges: one AA pass, two cheap taps
  { // no CA where depth of field is blurring: sharp R/B against blurred G paints green edges on silhouettes
    float dCA = texture(tScene, uv).a * 320.0;
    float cocCA = dCA > uFocus ? (1.0 - uFocus / dCA) * uAperture * 1.6 : (uFocus - dCA) / max(uFocus, 1.0) * uAperture * 2.0;
    fr *= 1.0 - smoothstep(0.3, 0.8, cocCA);

  col.r = mix(col.r, texture(tScene, uv + off).r, fr);
  col.b = mix(col.b, texture(tScene, uv - off).b, fr);
  // bloom: 4 mip levels, 9-tap tent each
  vec3 bloom = (tent(uv, 1.0) + tent(uv, 2.0) + tent(uv, 3.0) + tent(uv, 4.0)) * 0.25;
  col += bloom * uBloomStr;
  // anamorphic streak: horizontal, 6 % of the width, cold
  vec3 streak = vec3(0.0); float wsum = 0.0;
  for (int i = -4; i <= 4; i++){
    float f = float(i) / 4.0, w = 1.0 - abs(f);
    streak += textureLod(tBright, uv + vec2(f*0.03, 0.0), 3.0).rgb * w; wsum += w;
  }
  col += streak / wsum * vec3(0.5, 0.68, 1.0) * 0.3;
  col += rain(gl_FragCoord.xy, uTime) * vec3(0.45, 0.60, 0.85) * 0.03 * (0.4 + 2.0*bloom.g + 8.0*uMood.z);   // faint far rain; the real rain is world-space, lit by the lights
  // raindrops on the lens (aerial and river shots only): out-of-focus meniscus refractions that only show where light is behind them,
  // a specular rim, and a faint trail as they run down; replaced every 6 s
  if (uRig == 0.0 || uRig == 2.0){
    float aspect = uRes.x / uRes.y;
    float slot = floor(uTime / 6.0), ph = fract(uTime / 6.0);
    for (int i = 0; i < 3; i++){
      float fi = float(i);
      vec2 c = vec2(0.1 + 0.8*hash21(vec2(slot, fi*3.1)) * aspect, 0.3 + 0.6*hash21(vec2(slot + 7.0, fi*1.7)));
      float rad = 0.008 + 0.010*hash21(vec2(fi, slot + 2.0));
      float run = smoothstep(0.35, 1.0, ph) * 0.3 * hash21(vec2(slot, fi + 9.0));
      vec2 q = vec2(uv.x * aspect, uv.y) - (c - vec2(0.0, run));
      float d = length(q) / rad;
      float trail = smoothstep(0.3, 0.0, abs(q.x) / rad) * step(0.0, q.y) * step(q.y, run) * 0.5;
      if (trail > 0.0) col = mix(col, textureLod(tScene, uv, 2.0).rgb, trail * 0.6);
      if (d < 1.0){
        vec3 nrm = vec3(q / rad, sqrt(max(0.0, 1.0 - d*d)));
        vec2 off = -nrm.xy * 0.05 * (1.0 - nrm.z*0.6);
        vec3 through = textureLod(tScene, uv + off, 2.5).rgb;
        float lum = dot(through, vec3(0.3, 0.6, 0.1));
        float rim = pow(max(0.0, dot(nrm, normalize(vec3(-0.5, 0.7, 0.55)))), 28.0) * 0.06;
        float vis = 0.25 + 0.75*smoothstep(0.02, 0.35, lum);          // reads only against light
        float edge = smoothstep(1.0, 0.82, d);
        col = mix(col, through * 0.8 + rim, edge * vis * 0.6);
      }
    }
  }
  // vignette in linear light (highlights survive, shadows sink), then tonemap + display transform
  col *= 1.0 - 0.55 * pow(r, 2.2);
  {
    vec3 c = col * uExposure;
    float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
    vec3 perChannel = aces(c);
    vec3 hueKeep = c * (aces(vec3(l)).x / max(l, 1e-4));       // tonemap luminance, keep the tungsten hue in highlights
    float keep = 0.65 * (1.0 - smoothstep(2.0, 4.5, l));          // very bright cores still clip to white, like film
    col = mix(perChannel, clamp(hueKeep, 0.0, 1.0), keep);
  }
  col = pow(col, vec3(1.0/2.2));
  col = max(col - 0.033, 0.0) / (1.0 - 0.033);                 // crush the blacks (film toe)
  col = pow(col * vec3(1.0, 0.99, 0.97) + vec3(0.0, 0.006, 0.009), vec3(1.0, 0.98, 0.96));   // print-style grade: cyan-green toe, warm highs
  { float l2 = dot(col, vec3(0.2126, 0.7152, 0.0722)); col = mix(vec3(l2), col, 1.0 + 0.3*smoothstep(0.25, 0.8, l2)); }   // lights a little more vivid
  { // split toning per rig: teal shadows, amber highlights; the aerial and river shots lean colder, the tower push warmer
    float k = uRig == 0.0 ? 1.3 : (uRig == 2.0 ? 1.2 : (uRig == 3.0 ? 0.8 : 1.0));
    float l3 = dot(col, vec3(0.2126, 0.7152, 0.0722));
    col += (1.0 - l3) * vec3(-0.012, 0.004, 0.014) * k + smoothstep(0.45, 1.0, l3) * vec3(0.02, 0.008, -0.012) * (uRig == 3.0 ? 1.6 : 1.0);
    if (uRig == 3.0) col = mix(vec3(0.5), col, 1.06);                                     // a touch more contrast on the tower push
    float lift = uRig == 0.0 ? 0.060 : (uRig == 2.0 ? 0.105 : (uRig == 3.0 ? 0.030 : 0.0));   // haze-heavy rigs need their blacks back
    float gain = uRig == 0.0 ? 1.34 : (uRig == 2.0 ? 1.34 : (uRig == 3.0 ? 1.08 : 1.0));
    if (lift > 0.0) col = clamp((col - lift) * gain, 0.0, 1.0);
  }
  col = mix(col, texture(tHistory, uv).rgb, uBlend);            // temporal blend: a little motion blur, calmer edges
  if (any(isnan(col)) || any(isinf(col))) col = vec3(1.0, 0.0, 1.0);
  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}

<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const TEST = params.get('test') === '1';
const REC = params.has('rec');
const FIXED_TIME = 8.0;

// ---------- stats ----------
const stats = window.__stats = {
  fps: 0, frameMs: 0, shaderError: '', renderScale: 0.75,
  rtW: 0, rtH: 0, dpr: window.devicePixelRatio, gpu: '', test: TEST, frames: 0
};

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(1);            // canvas = CSS pixels; renderScale never multiplies DPR
renderer.autoClear = false;
renderer.debug.onShaderError = (gl, program, vs, fs) => {
  const log = [gl.getShaderInfoLog(vs), gl.getShaderInfoLog(fs), gl.getProgramInfoLog(program)].filter(Boolean).join('\n');
  stats.shaderError = (stats.shaderError + '\n' + log).trim();
  console.error('SHADER ERROR', log);
};
document.body.appendChild(renderer.domElement);
{
  const gl = renderer.getContext();
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  stats.gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
}

let renderScale = parseFloat(params.get('scale') ?? '0.75');
const rt = new THREE.WebGLRenderTarget(2, 2, {                    // linear HDR scene, alpha = depth
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  depthBuffer: false, stencilBuffer: false, type: THREE.HalfFloatType
});
const rtBright = new THREE.WebGLRenderTarget(2, 2, {              // half-res bright pass, mip chain = 4-level downsample
  minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter,
  depthBuffer: false, stencilBuffer: false, type: THREE.HalfFloatType, generateMipmaps: true
});

// ---------- signage atlas ----------

    const m = line.match(/^\s*((?:\[\d+:\d+(?:\.\d+)?\])+)(.*)$/); if (!m) continue;
    const text = m[2].trim(); if (!text) continue;
    for (const st of m[1].matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)) out.push({ t: +st[1]*60 + +st[2], text });
  }

function currentLyric(time){

  for (let i = 0; i < lyrics.length; i++){ if (lyrics[i].t <= time){ cur = lyrics[i]; next = lyrics[i + 1] || null; } else break; }
  if (!cur) return { text: '', a: 0 };

  const a = Math.min(1, (time - cur.t) / 0.5) * Math.min(1, Math.max(0, (end - time) / 0.5));

async function fetchLyrics(t){
  const A = nameVariants(t.artist).filter(Boolean), T = nameVariants(t.title), dur = Math.round(t.duration);
  const api = 'https://lrclib.net/api';
  for (const a of A) for (const ti of T){
    const r = await fetch(`${api}/get?track_name=${encodeURIComponent(ti)}&artist_name=${encodeURIComponent(a)}&duration=${dur}`).catch(() => null);
    if (r && r.ok){ const j = await r.json(); if (j.syncedLyrics) return j.syncedLyrics; }
  }
  const queries = []; for (const a of A) for (const ti of T) queries.push(`${a} ${ti}`); for (const ti of T) queries.push(ti);
  const cands = []; const seen = new Set();
  for (const q of queries){
    if (seen.has(q)) continue; seen.add(q);
    const r = await fetch(`${api}/search?q=${encodeURIComponent(q)}`).catch(() => null);
    if (!r || !r.ok) continue;
    for (const x of (await r.json()).filter(x => x.syncedLyrics)){
      const dd = Math.abs(x.duration - dur); if (dd > 6) continue;
      const ok = A.length ? A.some(a => { const n = normName(a), f = normName(x.artistName); return n.length > 1 && (f.includes(n) || n.includes(f)); }) : true;
      cands.push({ x, dd, ok });

// ---------- UI wiring ----------
const overlay = document.getElementById('overlay'), srcBox = document.getElementById('panel'), bars = document.getElementById('bars');

const barEls = [...bars.querySelectorAll('i')];
let barsVisible = true;
function start(){

}
function showPicker(){ renderPicker(); overlay.classList.remove('hidden'); }
// R: record the canvas for 30 s -> webm (VP9, 8 Mbps)
let rec = null, recTimer = 0;
const recSeconds = parseFloat(params.get('rec') ?? '30');

if (TEST && REC){ setTimeout(() => toggleRecord(), 1500); }   // ?test=1&rec=N: auto-record N seconds
if (TEST){ overlay.classList.add('hidden'); }
else {
  loadLibrary();
  setInterval(updateText, 80);                                  // keeps the lyric on time no matter what the renderer is doing
  player.addEventListener('timeupdate', updateText);
  player.addEventListener('seeked', updateText);
  overlay.addEventListener('click', e => { if (e.target === overlay || e.target.tagName === 'H1' || e.target.tagName === 'P') { if (LIB.current >= 0) overlay.classList.add('hidden'); else start(); } });
  document.getElementById('btnLib').addEventListener('click', showPicker);
  document.getElementById('nowPlaying').addEventListener('click', () => { player.paused ? player.play() : player.pause(); });
  // Scrubbing. The bar is 12 px of hit area around a 2 px line, because a 2 px target is not a target,
  // and it swallows its own clicks so that seeking never also toggles playback.
  { const seekBar = document.querySelector('#nowPlaying .bar'); let scrubbing = false;
    const dur = () => player.duration || (LIB.tracks[LIB.current] || {}).duration || 0;
    const seekTo = e => { const r = seekBar.getBoundingClientRect(); const d = dur();
      if (d) player.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * d; };

    const stop = e => { scrubbing = false; try { seekBar.releasePointerCapture(e.pointerId); } catch(err){} };
    seekBar.addEventListener('pointerup', stop); seekBar.addEventListener('pointercancel', stop);
    seekBar.addEventListener('click', e => e.stopPropagation()); }
  // Volume, remembered across sessions. localStorage throws in some privacy modes, so every touch of
  // it is guarded and the player still works with none.
  { const sVol = document.getElementById('sVol'), vVol = document.getElementById('vVol');
    let v0 = 1; try { v0 = parseFloat(localStorage.getItem('nc.vol') ?? '1'); } catch(e){}
    window.__setVol = v => { const x = Math.min(1, Math.max(0, isFinite(v) ? v : 1));
      player.volume = x; sVol.value = x; vVol.textContent = Math.round(x*100) + '%';
      try { localStorage.setItem('nc.vol', String(x)); } catch(e){} };
    window.__setVol(v0);
    sVol.addEventListener('input', () => window.__setVol(+sVol.value)); }
  player.addEventListener('ended', () => nextTrack(1));
  btnMic.addEventListener('click', useMic);
  btnFile.addEventListener('click', () => fileIn.click());
  fileIn.addEventListener('change', async () => { const fs = [...fileIn.files];
    const lrc = fs.find(f => /\.lrc$/i.test(f.name)); if (lrc) lrc.text().then(t => { lyrics = parseLRC(t); });
    const audios = fs.filter(f => !/\.lrc$/i.test(f.name));
    for (let i = 0; i < audios.length; i++) await addFile(audios[i], { play: i === 0 }); });
  window.addEventListener('dragover', e => { e.preventDefault(); overlay.classList.add('drag'); });
  window.addEventListener('dragleave', () => overlay.classList.remove('drag'));
  window.addEventListener('drop', async e => {
    e.preventDefault(); overlay.classList.remove('drag');
    const files = [...e.dataTransfer.files];
    const lrc = files.find(f => /\.lrc$/i.test(f.name));
    if (lrc) lrc.text().then(async t => { lyrics = parseLRC(t);
      const cur = LIB.tracks[LIB.current]; if (cur){ cur.lrc = t; await idbPut('lyrics', { id: cur.id, lrc: t, at: Date.now() }); renderPicker(); } });
    const audios = files.filter(f => /audio|mp3|wav|m4a|flac|ogg/i.test(f.type + f.name));
    for (let i = 0; i < audios.length; i++) await addFile(audios[i], { play: i === 0 && LIB.current < 0 });
  });
  const bind = (id, vid, fn) => { const el = document.getElementById(id), v = document.getElementById(vid);
    el.addEventListener('input', () => { fn(+el.value); v.textContent = (+el.value).toFixed(2); }); };
  bind('sResp', 'vResp', x => ctl.response = x);
  bind('sSpeed', 'vSpeed', x => ctl.speed = x);
  bind('sFog', 'vFog', x => ctl.fog = x);
  bind('sBeat', 'vBeat', x => audio.beatThreshold = x);
  document.getElementById('songName').addEventListener('input', e => setTitle(e.target.value));
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    const k = e.key.toLowerCase();

    if (k === 'l'){ overlay.classList.contains('hidden') ? showPicker() : overlay.classList.add('hidden'); }
    if (e.code === 'Space'){ e.preventDefault(); player.paused ? player.play() : player.pause(); }
    if (k === 'arrowright'){ if (e.shiftKey) player.currentTime = Math.min((player.duration || 1e9), player.currentTime + 10); else nextTrack(1); }
    if (k === 'arrowleft'){ if (e.shiftKey) player.currentTime = Math.max(0, player.currentTime - 10); else nextTrack(-1); }
    if (k === 'arrowup'){ e.preventDefault(); window.__setVol(player.volume + 0.05); }
    if (k === 'arrowdown'){ e.preventDefault(); window.__setVol(player.volume - 0.05); }
    if (k === 'escape') overlay.classList.add('hidden');

    if (k === 'r'){ toggleRecord(); }
    if (k === 's'){ renderer.domElement.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'nightcity-' + Date.now() + '.png'; a.click(); }); }
  });
  // The panel is a tool, not part of the picture. While a track is playing it fades out after a few
  // seconds of stillness, along with the cursor in fullscreen, and comes back the moment the mouse
  // moves or a key is pressed. H still switches it off for good; pausing brings it back and keeps it.
  let cursorTimer = 0;
  const idle = () => {
    if (document.fullscreenElement) document.body.classList.add('nocursor');
    if (barsVisible && !player.paused) document.body.classList.add('hud-away');
  };
  const wake = () => { document.body.classList.remove('nocursor', 'hud-away'); clearTimeout(cursorTimer);
    cursorTimer = setTimeout(idle, 2500); };

  // and on a screen capture — which is how the capture tool kept the panel on screen while measuring
  // whether the panel went off screen.
  let mx = -1, my = -1;
  window.addEventListener('mousemove', e => { if (e.clientX === mx && e.clientY === my) return; mx = e.clientX; my = e.clientY; wake(); });
  window.addEventListener('keydown', wake);
  document.addEventListener('fullscreenchange', wake);
  player.addEventListener('play', wake); player.addEventListener('pause', wake);
  window.__toggleRecord = toggleRecord;
}
function drawBars(a){
  if (!barsVisible) return;
  const v = [a.bass, a.mid, a.high, a.energy, a.beat];
  for (let i = 0; i < 5; i++) barEls[i].style.height = (2 + 58*Math.min(1, v[i])) + 'px';
}

// ---------- loop: 60 fps cap, pause when hidden / unfocused ----------
let paused = false;
const setPaused = (p) => { paused = p; };
// Only a genuinely hidden document pauses rendering. Window blur must not: going fullscreen on macOS moves the
// window to another Space and fires blur, which used to freeze the whole frame (and with it the lyric) mid-song.
document.addEventListener('visibilitychange', () => setPaused(document.hidden));

const t0 = performance.now();
let lastRender = 0, fpsCount = 0, fpsT = performance.now(), msAcc = 0;
function renderFrame(now){
  const t = TEST ? FIXED_TIME : (now - t0) / 1000;
  if (!TEST){                                              // editing: pick the rig for the section, cut on a beat
    const bySection = [1, 0, 3, 2];                          // verse -> street, build -> aerial, drop -> tower, breakdown -> river
    const noAudio = audio.kind === 'none';
    let want = noAudio ? (rig + 1) % 4 : bySection[audio.section];
    const age = t - shotStart, onBeat = noAudio || (t - audio.lastBeat < 0.08);
    if (want !== rig && onBeat && (age > RIG_MIN[rig] || (noAudio && age > 8))){ rig = want; shotStart = t; cutFrames = 2; }
    else if (age > RIG_MAX && onBeat){ rig = (rig + 1) % 4; shotStart = t; cutFrames = 2; }
  }
  const taaOn = !(TEST && !params.get('taa') && !REC) && cutFrames === 0;
  if (cutFrames > 0) cutFrames--;
  const c = cameraAt(t, camZ);
  if (!camPrev) camPrev = c;
  uniforms.uCamRo.value.fromArray(c.ro); uniforms.uCamRt.value.fromArray(c.rt); uniforms.uCamUp.value.fromArray(c.up); uniforms.uCamFw.value.fromArray(c.fw); uniforms.uFocal.value = c.focal;
  postU.uPrevRo.value.fromArray(camPrev.ro); postU.uPrevRt.value.fromArray(camPrev.rt); postU.uPrevUp.value.fromArray(camPrev.up); postU.uPrevFw.value.fromArray(camPrev.fw); postU.uPrevFocal.value = camPrev.focal;
  jitterIdx = (jitterIdx + 1) % 16;
  if (taaOn) uniforms.uJitter.value.set(halton(jitterIdx + 1, 2) - 0.5, halton(jitterIdx + 1, 3) - 0.5); else uniforms.uJitter.value.set(0, 0);
  postU.uTaa.value = taaOn ? 1 : 0;
  postU.uRig.value = rig;
  // Focus and aperture. These were a macro lens: the street rig was sharp only between 8.0 and
  // 10.5 m, and what sits at 9 m is usually empty road — so the buildings, the signs and the street
  // itself were all outside the depth of field at once, which is what "everything is out of focus"
  // means. Measured on the frame: the far zone lost 30% of its detail to this alone. Now each rig is
  // sharp across the distances its shot is actually about, with enough left at the extremes to keep
  // the near foreground soft and distant lights blooming.
  { const FOCUS = [110, 38, 48, 150], APER = [0.40, 0.32, 0.42, 0.45];
    const age = t - shotStart, pull = TEST ? 1 : Math.min(1, age / 0.6);
    const f = FOCUS[rig] * (0.35 + 0.65 * pull*pull*(3 - 2*pull));                  // focus pull after a cut

  renderer.setRenderTarget(rtTaa[taaCur]);
  renderer.render(scenePost, cam);
  postU.tScene.value = rtTaa[taaCur].texture;
  taaCur = 1 - taaCur; camPrev = c;
  postU.uMode.value = 0; postU.uRes.value.set(rtBright.width, rtBright.height);
  renderer.setRenderTarget(rtBright);

  postU.uMode.value = 1; postU.uRes.value.set(rt.width, rt.height);

  postU.uBlend.value = (TEST && !params.get('taa') && !REC) ? 0 : (cutFrames > 0 ? 0 : 0.08);
  renderer.setRenderTarget(rtHist[histCur]);
  renderer.render(scenePost, cam);                 // composite, blended with the previous frame
  postU.uMode.value = 2; postU.uRes.value.set(window.innerWidth, window.innerHeight);

}
function frame(now){
  requestAnimationFrame(frame);

  const dt = lastRender ? now - lastRender : 16.7;
  lastRender = now;

  const t = TEST ? FIXED_TIME : (now - t0) / 1000;
  uniforms.iTime.value = t;
  const a = currentAudio(t, dt/1000);
  uniforms.uAudio.value.set(a.bass, a.mid, a.high, a.energy);
  uniforms.uBeat.value = a.beat;
  drawBars(a);
  const baseSpeed = 3.0;
  const dropBoost = 1 + 0.8*Math.exp(-Math.max(0, t - dropTime) / 3);
  camZ = TEST ? parseFloat(params.get('camz') ?? '100') : camZ + (dt/1000) * baseSpeed * ctl.speed * (0.6 + 0.8*a.energy) * dropBoost;
  uniforms.uCamZ.value = camZ;
  uniforms.uParams.value.set(ctl.response, ctl.fog, ctl.speed, 0);
  searchAngle = TEST ? parseFloat(params.get('search') ?? '-1.75') : searchAngle + (dt/1000) * (2*Math.PI/20) * (0.6 + 1.2*a.bass);
  uniforms.uSearch.value = searchAngle;
  {
    const tp = (now - t0) / 1000;
    const fi = Math.min(1, Math.max(0, (tp - fadeInAt) / 2.0)), fo = Math.min(1, Math.max(0, (fadeOutAt - tp) / 1.5));
    const f = Math.min(fi, fo); uniforms.uMood.value.w = TEST ? 1 : f*f*(3 - 2*f);
  }

    const D = [Math.cos(searchAngle)*ct, -st, Math.sin(searchAngle)*ct];
    const cr = cameraAt(t, camZ).ro;
    const v = [cr[0] - S[0], cr[1] - S[1], cr[2] - S[2]]; const s = v[0]*D[0] + v[1]*D[1] + v[2]*D[2];
    let bm = 0;
    if (s > 0){ const px = v[0]-D[0]*s, py = v[1]-D[1]*s, pz = v[2]-D[2]*s; const dist = Math.hypot(px, py, pz); const rad = 1.2 + 0.035*s;

  else { uniforms.uBeatAge.value.set(t - beatTimes[0], t - beatTimes[1]); uniforms.uFlashAge.value = t - flashTime; }

  const rainEnv = TEST ? 0.5 : (0.15 + 0.85*Math.pow(Math.sin(t/17), 2)) * (0.5 + 0.5*a.high);   // drizzle -> downpour -> drizzle, highs on top
  postU.uRain.value = rainEnv;
  uniforms.uMood.value.x = rainEnv;
  slowEnergy += ((a.energy) - slowEnergy) * (dt/1000) / 3.0;   // ~3 s follower
  uniforms.uMood.value.y = TEST ? 1 : Math.min(1, Math.max(0, slowEnergy*1.6));
  uniforms.uSection.value.set(TEST ? parseFloat(params.get('section') ?? '0') : audio.section, TEST ? 5 : audio.sectionAge);
  updateText();

  renderFrame(now);

  fpsCount++; msAcc += dt; stats.frames++;
  if (now - fpsT >= 1000) {
    stats.fps = Math.round(fpsCount * 1000 / (now - fpsT));
    stats.frameMs = +(msAcc / fpsCount).toFixed(2);
    fpsCount = 0; msAcc = 0; fpsT = now;
    adaptScale(stats.fps);
    if (LIB.current >= 0){ const t = LIB.tracks[LIB.current];
      document.getElementById('npTitle').textContent = (player.paused ? '❚❚ ' : '▶ ') + t.title;
      { const d = player.duration || t.duration || 0;
        document.getElementById('npTime').textContent = mmss(player.currentTime || 0) + (d ? ' / ' + mmss(d) : ''); }
      document.getElementById('npBar').style.width = (100 * (player.currentTime || 0) / Math.max(1, player.duration || t.duration)) + '%'; }
    statLine.textContent = `fps ${stats.fps} · scale ${renderScale.toFixed(2)} · ${stats.rtW}x${stats.rtH}` + (audio.bpm ? ` · ${audio.bpm.toFixed(0)} bpm · S${audio.section}` : '');
  }
}
requestAnimationFrame(frame);
